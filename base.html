privacy protection"], "a": 2, "e": ""}, {"q": "STR as defined by JFIU:", "o": ["Standard transaction report", "Suspicious transaction report", "Supervisory transaction report", "Supervisory trend-setting report"], "a": 1, "e": ""}, {"q": "How many recommendations does FATF currently publish?", "o": ["20", "40", "49", "51"], "a": 1, "e": ""}, {"q": "FATF recommendations cover:", "o": ["AML/CFT policies", "Money laundering & confiscation", "Terrorist & proliferation financing", "All of the above"], "a": 3, "e": ""}, {"q": "NOT a primary APG function:", "o": ["Technical assistance", "Typologies research", "Private-sector engagement", "On-site inspection"], "a": 3, "e": ""}, {"q": "Mock Q46: function intended for transaction surveillance (official key C):", "o": ["Senior staff approve high-value transactions", "Due control of every cross-border transaction", "Customer due diligence by frontline staff", "Authenticate every online transaction"], "a": 2, "e": "Official key: C — the guide describes surveillance as front-line due diligence plus systematic review."}]}, {"t": "第6章 项目与营运 Projects", "h": "\n<h1>第6章 业务分析、系统项目与IT营运 · Business Analysis, System Projects & IT Operations</h1>\n<div class=\"card\"><b>主线:</b>怎么开发系统(SDLC / Agile / RAD)→ 怎么设计总蓝图(EA / SOA / UCD)→ 怎么安全外判(原则、SLA、HKMA 规定)→ 有哪些专业证书。</div>\n<h2>6.1 开发与项目管理方法</h2>\n<p><b>SDLC</b> = 规划、控制、创建、测试、交付信息系统的框架。<b>项目管理</b>五阶段:Initiating → Planning → Executing → Monitoring & Controlling → Closing;须平衡范围、质量、进度、预算、资源、风险。</p>\n<div class=\"flow\"><span>Waterfall</span><span>RAD</span><span>JAD</span><span>Fountain</span><span>Spiral</span><span>Build and Fix</span><span>Synchronise and Stabilise</span></div>\n<div class=\"trap\"><b class=\"t\">陷阱</b>\"Build and <b>Use</b>\" 不是 SDLC 模型(Q21 = D);\"Trojan\" 不是 Agile 方法(Q18 = D)。Agile 家族:DAD、Adaptive、Agile Modelling、Kanban、Scrum、Scrumban、XP、DSDM、FDD、Lean。</div>\n<p>通用步骤:评估现有系统 → 定义需求 → 设计(硬件、OS、编程、通信、安全)→ 开发+培训+测试 → 上线(分阶段或一次性)→ 评估与维护。<b>无论哪种模型,文档都重要。</b></p>\n<table><tr><th></th><th>Waterfall</th><th>Agile</th></tr><tr><td>流程</td><td>线性;开发前先做严谨设计规格</td><td>迭代 sprint,每轮交付可用软件</td></tr><tr><td>需求变化</td><td>不适合</td><td>适合;在 <b>Feedback</b> 阶段修改需求</td></tr><tr><td>适用</td><td>需求稳定</td><td>客户可参与、需快速交付、团队同地。<b>最适合不断演变的 fintech 需求</b>(Mock Q32)</td></tr></table>\n<div class=\"flow\"><span>Requirements</span><i>→</i><span>Development</span><i>→</i><span>Testing/QA</span><i>→</i><span>Delivery</span><i>→</i><span>Feedback</span><i>↺</i></div>\n<ul><li><b>Scrum</b>(最常见起点):Product Owner(愿景、是否发布)、Scrum Master(清除障碍、保持 sprint backlog 透明)、自我管理团队;sprint <b>1–2 周</b>;每日站会。</li></ul>\n<div class=\"must\"><b class=\"t\">RAD 快速应用开发</b><b>优点:</b>以人为本、增量;用户看<b>运行中的系统</b>而非纸面文档,上线后被拒比率低;缩短开发时间、组件可重用。<b>缺点:</b><span class=\"kw\">scope creep(范围蔓延)</span>——用户不断要求加功能,成本和进度大幅超支。所以常在瀑布中加入有限原型(Mock Q2 = A,Q35 = C)。</div>\n<p><b>工具:</b>Gantt chart(按时间排任务)· CPM / PERT(活动最短/最长时间)· inventory(RFID、QR、条形码)。<b>Budget plan 不是</b>管理项目活动的工具(Ch6 review Q3)。</p>\n<h3>QA、测试与变更管理</h3>\n<ul><li>QA 需要 CIO 承诺与质量指标;测试环境须能重现生产环境;开发/测试/生产环境分隔。</li><li><b>变更管理</b>包含:变更与影响分类优先排序 · 各方角色责任 · 版本控制与审计轨迹 · 排程追踪监控 · <b>roll-back</b> · 实施后验证 · 正式的<b>紧急变更</b>程序。<b>变更管理 + 环境分隔</b>可减少部署时的系统中断(Q38 = B)。</li></ul>\n<h2>6.2 企业架构 EA</h2>\n<div class=\"card\"><b>EA</b> = IT 蓝图,目标是对齐、标准化、重用、共享方法,使 IT 更便宜、更策略性、更敏捷。</div>\n<table><tr><th>维度</th><th>Application design</th><th>Enterprise architecture</th></tr><tr><td>Scope</td><td>特定需求,静态蓝图</td><td>持续变化与模糊性</td></tr><tr><td>Products</td><td>自动化系统</td><td>高层次总蓝图与共同建构块</td></tr><tr><td>Stakeholders / Governance</td><td>业务拥有者</td><td>多方利益相关者</td></tr><tr><td>Delivery</td><td>开发、测试、发布后才有用</td><td>订定总蓝图并决定何时落地</td></tr></table>\n<div class=\"trap\"><b class=\"t\">陷阱</b><b>Cost</b> 不是 EA 与应用设计的区分维度(Mock Q15 = D)。</div>\n<ul><li><b>SOA</b>:由<b>松耦合(loosely coupled)</b>、可重用、与平台/语言/OS 无关的 \"服务\" 构成(开户申请、网上结单)。赋能技术:<b>XML、SOAP</b>(W3C;平台独立)、REST、CORBA、Jini。好处:互操作、共享服务、灵活、减少厂商锁定。关键原则<b>不含 controllability</b>。<b>Loose coupling + reusable services</b> 提升灵活性(Q17 = A)。</li><li><b>UCD</b>:<b>Persona</b>(行为、需求、目标、技能、态度)· <b>Scenario</b>(日常问题场景)· <b>Use case</b>(用户与系统逐步互动,含失败路径)。</li></ul>\n<h2>6.3 供应商与外判管理</h2>\n<div class=\"card\"><b>Outsourcing</b> = 第三方(甚至集团内关联实体)持续执行银行原本自己做的活动。好处:质量、效率、降成本、专注核心业务、加快服务。流程:选供应商 → Inception → 监控 + SLA → Exit & transition。</div>\n<ul><li><b>原则:</b>对的时间、对的理由、对的方法;原因:降成本、赶期限、缺技术;先评估资金与远程团队管理能力;留意共享的机密数据;规划内外分工;定期监察;持续沟通。云(IaaS/PaaS/SaaS)是替代方案。</li><li><b>Exit 策略:</b>合约终止(尤其提前)最棘手——约定过渡服务及期限、供应商投入资源、与接替供应商合作;宜协商较低的提前终止罚款。绩效标准不应静态。</li></ul>\n<h3>SLA(★)</h3>\n<ul><li>含具体 <b>performance levels</b> 的外判协议;罚则/抵扣常是最难谈的部分。</li><li>SLA 是<b>基准而非保证</b>:未达标触发罚款,明显超标则有奖金/抵扣。关键指标须<b>客观、可衡量、可验证</b>;定期复核;未达标时供应商须调查<b>根本原因</b>并书面报告。</li></ul>\n<table><tr><th>外判风险</th><th>含义</th></tr><tr><td>Strategic 战略</td><td>错误商业决策影响盈利/资本</td></tr><tr><td>Reputational 声誉</td><td>第三方服务差或与银行标准不符</td></tr><tr><td>Compliance 合规</td><td>供应商控制不足</td></tr><tr><td>Operational 营运</td><td>技术失败、财力不足等</td></tr></table>\n<div class=\"must\"><b class=\"t\">HKMA 外判要求</b>跨境外判须通知 HKMA;保障客户资料完整与保密;<b>董事会</b>有效监督。SPM 涵盖:问责、风险管理、provider 能力、客户资料完整保密、对外判活动的控制、应急计划、查阅外判数据。<b>成本控制(cost control)不属强制涵盖</b>(Ch6 review Q10 = C)。<b>对系统风险的问责不能外判</b>(Mock Q39 = C)。依赖第三方 IT 供应商是营运风险,因为<b>失去对关键系统的可见度与控制</b>(Q45 = A)。OR-2:须确认第三方的营运韧性不低于银行。与外判商<b>不共享</b>的资产:<b>intellectual property</b>(Q11 = C)。</div>\n<ul><li>营运韧性弱的迹象 = <b>缺乏实时监控与 escalation</b>(Q47 = C);主动缓解风险 = <b>持续监控 + 定期风险评估</b>(Q49 = B)。</li></ul>\n<h2>6.4 专业资格配对</h2>\n<table><tr><th>方向</th><th>证书</th></tr>\n<tr><td>项目管理</td><td><b>PMP</b>(全球认可;PMI 称平均薪酬高约 25%)· <b>CPIT(PD)</b>(HKCS;评审制、master 级、10–15 年经验、论文+面试)· <b>CPIT(PM)</b>(认可制、specialist 级、5+ 年)</td></tr>\n<tr><td>系统服务管理</td><td><b>ITIL</b>(最佳实践方法论)· <b>PRINCE2</b>(英国政府常用;Foundation 与 Practitioner)· <b>CPIT(SSO)</b>(practitioner 级、2+ 年)</td></tr>\n<tr><td>业务分析</td><td><b>IIBA</b> 核心证书(<b>3</b> 个):ECBA(入门)· CCBA(2–3 年)· CBAP(5+ 年);CPIT(BA)</td></tr>\n<tr><td>网络安全</td><td><b>CISA · CISSP · CPIT(ISO)</b></td></tr></table>\n<div class=\"tip\"><b class=\"t\">记忆法</b>PMP 管项目,ITIL 管服务,IIBA 管分析,CISSP/CISA 管安全。</div>\n", "q": [{"q": "Which methodology emphasises rigorous design specifications before development?", "o": ["Waterfall", "RAD", "JAD", "Build and Fix", "All"], "a": 0, "e": ""}, {"q": "When are requirements modified in an Agile environment?", "o": ["Development", "Testing", "Delivery", "Feedback", "All"], "a": 3, "e": ""}, {"q": "Which is NOT used to manage project activities?", "o": ["Gantt chart", "Budget plan", "CPM", "PERT chart", "All"], "a": 1, "e": ""}, {"q": "Which certification relates to cyber security?", "o": ["PMP", "CISSP", "ITIL", "IIAB", "All"], "a": 1, "e": ""}, {"q": "Which is NOT a key SOA principle?", "o": ["Interoperability", "Controllability", "Shared services", "Flexibility", "All"], "a": 1, "e": ""}, {"q": "Number of core IIBA business-analysis certifications:", "o": ["1", "3", "7", "10", "12"], "a": 1, "e": ""}, {"q": "Which is FALSE about SOAP?", "o": ["Application communication protocol", "Message format", "Platform dependent", "Based on XML", "All"], "a": 2, "e": ""}, {"q": "ITIL focuses on:", "o": ["Business analysis", "Project management", "Cyber security", "Best-practice methodology", "All"], "a": 3, "e": ""}, {"q": "Defining a persona in UCD uses:", "o": ["Behaviour", "Needs", "Skills", "Attitudes", "All"], "a": 4, "e": ""}, {"q": "NOT mandatorily covered by HKMA's outsourcing SPM:", "o": ["Accountability", "Risk management", "Cost control", "Customer data confidentiality", "All"], "a": 2, "e": ""}, {"q": "Mock Q38: control reducing disruption when changes are deployed:", "o": ["UAT only", "Change management and environment segregation", "Vendor self-certification", "Manual approval"], "a": 1, "e": ""}, {"q": "Mock Q39: responsibility that CANNOT be outsourced:", "o": ["Coding", "System testing", "Accountability for system risk", "Infrastructure hosting"], "a": 2, "e": ""}]}, {"t": "Section B 论述题 Essays", "h": "\n<h1>Section B 论述题与参考答案 · Essay Questions</h1>\n<div class=\"card\">形式:3 题<b>任选 2 题</b>,每题 25 分,黑/蓝笔。以下三题来自 HKIB Mock Paper(EXAM-G-065,2026年5月),答案是我对官方 suggested solution 的中英浓缩改写。评分规律:通常<b>每个要点 1 分(或\"要点 1 分 + 解释 1 分\")</b>,所以要分点作答、逐点标号。</div>\n<h2>Q1 — iAM Smart、FSS 与 Open API(25 分)</h2>\n<p><i>背景:OGCIO 的 iAM Smart(2020年12月推出,HKID 持有人免费)可用手机生物识别登入政府及商业网上服务;HKMA 支持,金融机构可在 FSS 测试应用。</i></p>\n<h3>(a) iAM Smart 如何协助 FI 提供服务 — 6 分(每项 2 分,最多 3 项)</h3>\n<ul><li><b>Authentication:</b>手机生物识别,注册时已对照 HKID;一个数码身份,免管理多组帐号密码。</li><li><b>Digital signing:</b>依《电子交易条例》(Cap. 553)具法律效力。</li><li><b>e-Form filling (e-ME):</b>存储个人资料,自动填表。</li><li><b>Personalised notifications:</b>服务更新、到期提醒。</li><li><b>Remote registration / onboarding</b> 客户。</li></ul>\n<h3>(b)(i) FSS 是什么 — 3 分</h3>\n<p>监管者订立的框架:允许以<b>较小参与群体</b>进行试点,<b>无需完全符合</b> HKMA 监管要求,并在接近生产环境的 integration testing 环境测试。</p>\n<h3>(b)(ii) 任选三项运作原则 — 9 分(原则 1 分 + 解释 2 分)</h3>\n<ol><li><b>Boundary</b>——试点范围、阶段、时间、终止安排清晰。</li><li><b>Customer protection</b>——客户明白风险并自愿参加;投诉处理;损失补偿;可退出。</li><li><b>Risk-management controls</b>——为未完全合规设补偿性控制;保护生产系统与其他客户。</li><li><b>Readiness & monitoring</b>——系统与流程已就绪;密切监察试点。</li></ol>\n<h3>(c)(i) Open API 是什么 — 3 分</h3>\n<p>API 是让不同电脑系统交换资料、执行指令的软件中介/规则集。<b>Open</b> API:机构向第三方服务提供者开放内部系统与数据,以透明、有文档的方式供程序化访问。</p>\n<h3>(c)(ii) 好处 — 4 分</h3>\n<p><b>User-friendly</b>(免申请、注册、认证,免费)· <b>Efficient & convenient</b>(一次编程后自动更新)· <b>Promotes innovation</b>(灵活整合资讯开发新应用)。</p>\n<h2>Q2 — 远程开户、生物识别与数据私隐(25 分)</h2>\n<h3>(a)(i) Liveness check — 3 分</h3>\n<p><b>是什么:</b>检测机制,证明生物特征来自真人(如面部动作)而非伪造,以算法分析。<b>为何重要:</b>防止 spoofing / impersonation(指纹模、3D 硅胶面具、预录视频),降低欺诈风险。</p>\n<h3>(a)(ii) 远程开户步骤 — 3 分(每步 0.5)</h3>\n<p>拍 HKID → 认证 HKID → 自拍与 HKID 比对 → 填申请表 → 客户风险评估 → 开户。</p>\n<h3>(b) 云端生物识别供应商的合规关注(PCPD 要求)— 8 分</h3>\n<ul><li><b>银行业指引与 DPPs:</b>收集、准确、保留、使用、保安、查阅。</li><li><b>生物识别指引:</b>不当披露可致冒充或歧视;存 <b>template</b> 而非原图并安全销毁原样本;template 技术上难以还原;合法、直接相关、不过量;<b>自由且知情同意</b>;定期清除;定期独立审计。</li><li><b>云计算指引:</b>委托前取得供应商保证;无论存放何处 FI 仍须负责;以合约防止处理者保留数据过久(DPP2);跨司法管辖区流动及客户知情;分包商须同等保护;PICS/私隐政策清楚说明可能外包给云服务商。</li></ul>\n<h3>(c)(i) 谁须负责 — 3 分</h3>\n<p><b>银行(雇主)须负责</b>(员工亦然):依 PDPO 第 65 条,雇员在雇佣期间的行为视为雇主所为;若银行证明已采取<b>切实可行步骤</b>防止,可作辩护。</p>\n<h3>(c)(ii) 四项可行措施 — 8 分</h3>\n<p>定期向员工传达数据保护政策 · 持续及入职培训 · 定期检讨手册 · need-to-know / need-to-use 权限 · 保密声明及违规后果 · 系统内置控制、内部审计与抽查。</p>\n<h2>Q3 — RegTech(25 分)</h2>\n<h3>(a) 两项不采用原因 — 4 分</h3>\n<p>预算/资源限制 · 方案对本地需求不成熟 · 缺乏人才 · 数据格式难数码化。</p>\n<h3>(b) 四项好处并论证 — 8 分</h3>\n<p>风险管理 · 降低 KYC/CDD 成本 · 吸引留住客户 · 客户体验 · 金融普惠 · 降低系统风险 · 强化监督 · 监管效率(详见第5章)。</p>\n<h3>(c) 五项 HKMA AI 控制原则 — 10 分(原则 1 + 解释 1)</h3>\n<table><tr><th>领域</th><th>原则</th><th>解释</th></tr>\n<tr><td>Governance</td><td>董事会与高管问责</td><td>自学习 AI 自动决策;需治理框架、风险措施、三道防线职责清晰</td></tr>\n<tr><td rowspan=\"6\">Design & development</td><td>具备足够专长</td><td>开发者须有能力;招聘、培训、留任</td></tr>\n<tr><td>适当的 explainability</td><td>不可以 \"黑箱\" 为借口,按重要性相称</td></tr>\n<tr><td>高质量数据</td><td>有效的数据治理框架</td></tr>\n<tr><td>严格的模型验证</td><td>投产前测试;宜由独立方参与</td></tr>\n<tr><td>Auditability</td><td>保留审计日志与文档</td></tr>\n<tr><td>第三方供应商监督;道德、公平、透明</td><td>尽职审查与定期检视;不歧视;事前告知客户服务由 AI 驱动及风险</td></tr>\n<tr><td rowspan=\"4\">Ongoing monitoring</td><td>定期检视与持续监控</td><td>模型随实时数据改变,须重新验证</td></tr>\n<tr><td>遵守数据保护规定</td><td>PDPO;适当时用脱敏数据代替 PII</td></tr>\n<tr><td>网络安全</td><td>应对 data poisoning、adversarial attack</td></tr>\n<tr><td>风险缓解与应变计划</td><td>human-in-the-loop、风险限额、抽样 QA;可随时暂停 AI 并回退人手/传统流程</td></tr></table>\n<h3>(d) AML 领域 RegTech 的推动力 — 3 分</h3>\n<p>任选三项(跨境欺诈复杂化、跨渠道侦测需求、新数码支付、实时分析、制裁筛查等,见第5章)。</p>\n<div class=\"tip\"><b class=\"t\">答题技巧</b>Define → 机制 → 银行例子 → 风险/限制 → 连结法规(PDPO、SPM、FATF)。逐点标号,方便评卷员给分。</div>\n", "q": []}, {"t": "Mock Paper 官方答案(50题)", "h": "<h1>Mock Paper — Section A 官方答案 · Official Key</h1><div class=\"card\">50 题均为浓缩版(题目保持英文,与真题一致)。答案与章节参考来自 Mock Paper 的 suggested-answer 表。点选项即时判分。</div>", "q": [{"q": "<b>Q1.</b> Technology addressing exposure when employees check company email at home <small>[Ch2.5]</small>", "o": ["IPS", "TIP", "SEM", "MDM"], "a": 3, "e": ""}, {"q": "<b>Q2.</b> Issue often associated with RAD <small>[Ch6.1]</small>", "o": ["Scope creep", "Lower acceptance", "Higher risk", "Lower quality"], "a": 0, "e": ""}, {"q": "<b>Q3.</b> NOT a goal of Capital One Lab <small>[Ch1.1]</small>", "o": ["Facilitate design thinking", "Create brand awareness in social media", "Seed disruptive ideas", "Foster rapid prototyping"], "a": 1, "e": ""}, {"q": "<b>Q4.</b> Bank losing young customers to fintech with seamless onboarding — most likely gap <small>[Ch1.1]</small>", "o": ["Branch coverage", "Insufficient data analytics and AI capability", "Over-investment in cybersecurity", "Excess compliance"], "a": 1, "e": ""}, {"q": "<b>Q5.</b> Trend forcing banks from 'customer interface owner' to 'infrastructure provider' <small>[Ch1.2]</small>", "o": ["Cloud", "BaaS and Open API banking", "Blockchain settlement", "Digital asset custody"], "a": 1, "e": ""}, {"q": "<b>Q6.</b> Why fintechs compete despite relying on bank infrastructure <small>[Ch1.2]</small>", "o": ["Lower risk", "Front-end design, analytics, journey orchestration without owning the balance sheet", "Outside regulatory perimeter", "Higher guaranteed yields"], "a": 1, "e": ""}, {"q": "<b>Q7.</b> NOT covered under Big Data governance framework <small>[Ch3.1 (official key B)]</small>", "o": ["Metadata definitions", "Data security policies", "Data privacy policies", "Data cleansing policies"], "a": 1, "e": ""}, {"q": "<b>Q8.</b> Development signalling need to redesign architecture for scalability and speed <small>[Ch4.9]</small>", "o": ["Branch automation", "Growth of mobile/digital banking behaviour", "Decline in interbank payments", "Less IT outsourcing"], "a": 1, "e": ""}, {"q": "<b>Q9.</b> DPP least relevant to cloud computing <small>[Ch2.2 (official key A)]</small>", "o": ["Data Collection", "Accuracy and Retention", "Data Use", "Data Security"], "a": 0, "e": ""}, {"q": "<b>Q10.</b> NOT a property of data mining <small>[Ch3.1]</small>", "o": ["Actionable information", "Predicting outcomes", "Automatic pattern discovery", "Probability of every outcome"], "a": 3, "e": ""}, {"q": "<b>Q11.</b> Bank asset NOT shared with outsourced providers <small>[Ch6.3]</small>", "o": ["Customer data", "Commercial ideas", "Intellectual property", "Operational techniques"], "a": 2, "e": ""}, {"q": "<b>Q12.</b> Best balance of regulatory control and scalability <small>[Ch1.2]</small>", "o": ["Public only", "Private only", "Hybrid", "Community"], "a": 2, "e": ""}, {"q": "<b>Q13.</b> Why senior-management support is key to ISMS <small>[Ch2.1]</small>", "o": ["Also vulnerable", "Hackers target them", "Investment in cyber security is worth it", "Usually laymen"], "a": 2, "e": ""}, {"q": "<b>Q14.</b> NOT a drawback critics claim for Big Data SME lending <small>[Ch1.3]</small>", "o": ["Not transparent", "Outcome not proven", "Too inhumane", "Possibly racially biased"], "a": 2, "e": ""}, {"q": "<b>Q15.</b> NOT a differentiator of EA vs application design <small>[Ch6.2]</small>", "o": ["Delivery", "Product", "Governance", "Cost"], "a": 3, "e": ""}, {"q": "<b>Q16.</b> Ordinance to observe when rolling out a chatbot <small>[Ch3.6]</small>", "o": ["Employment", "Dutiable Commodities", "Personal Data (Privacy)", "Prevention of Bribery"], "a": 2, "e": ""}, {"q": "<b>Q17.</b> SOA characteristic that most improves flexibility <small>[Ch6.2]</small>", "o": ["Loose coupling and reusable services", "Centralised ownership", "Single vendor", "Manual reconciliation"], "a": 0, "e": ""}, {"q": "<b>Q18.</b> NOT an Agile methodology <small>[Ch6.1]</small>", "o": ["Scrumban", "Kanban", "Scrum", "Trojan"], "a": 3, "e": ""}, {"q": "<b>Q19.</b> DLT vs traditional databases — most effective when <small>[Ch4.8]</small>", "o": ["Shared consistency across institutions", "High-speed batch only", "Strong anonymisation", "Simpler reporting"], "a": 0, "e": ""}, {"q": "<b>Q20.</b> NOT an input of biometric authentication <small>[Ch5.3]</small>", "o": ["Facial", "Fingerprint", "Signature", "Iris"], "a": 2, "e": ""}, {"q": "<b>Q21.</b> NOT a methodology in SDLC <small>[Ch6.1]</small>", "o": ["Spiral", "Waterfall", "Fountain", "Build and Use"], "a": 3, "e": ""}, {"q": "<b>Q22.</b> Purpose of a penetration test <small>[Ch2.1]</small>", "o": ["Help regulator onsite review", "Support board IT policy review", "Identify technical vulnerability", "Help law enforcement hack suspects"], "a": 2, "e": ""}, {"q": "<b>Q23.</b> Why robo-advisors won't soon replace humans <small>[Ch4.5]</small>", "o": ["High cost", "Human touch entices action", "Lack of diversity", "Language flexibility"], "a": 1, "e": ""}, {"q": "<b>Q24.</b> Exploratory analytics for fraud without knowing which is fraudulent <small>[Ch3.2]</small>", "o": ["Regression", "Clustering", "Naive Bayes", "Probabilistic"], "a": 1, "e": ""}, {"q": "<b>Q25.</b> NOT a weakness of AI in transaction surveillance <small>[Ch5.1]</small>", "o": ["Depends on algorithm sophistication", "Needs massive data", "Data integration hindered by privacy", "Labour unions object"], "a": 3, "e": ""}, {"q": "<b>Q26.</b> Characteristic of a data warehouse <small>[Ch3.1]</small>", "o": ["All data loaded, none rejected", "Highly structured", "Stored as-is", "Encrypted"], "a": 1, "e": ""}, {"q": "<b>Q27.</b> Control that MOST directly strengthens customer authentication <small>[Ch2.5]</small>", "o": ["Password complexity", "Session timeout", "Manual account review", "Biometric and multi-factor authentication"], "a": 3, "e": ""}, {"q": "<b>Q28.</b> NOT considered a DLT weakness <small>[Ch4.8 (official key A)]</small>", "o": ["Lack of accessibility", "Lack of scalability", "Lack of latency", "Lack of readiness"], "a": 0, "e": ""}, {"q": "<b>Q29.</b> Why supplement rule-based AML with ML <small>[Ch5.2]</small>", "o": ["Rule systems prohibited", "ML eliminates false positives", "ML adapts to evolving patterns", "Regulators mandate AI-only"], "a": 2, "e": ""}, {"q": "<b>Q30.</b> Method for suspicious activity without labelled fraud data <small>[Ch3.2]</small>", "o": ["Regression", "Supervised learning", "Unsupervised learning", "Descriptive analytics"], "a": 2, "e": ""}, {"q": "<b>Q31.</b> Major regulatory concern with complex AI models <small>[Ch3.6]</small>", "o": ["Computing cost", "Lack of transparency and explainability", "Limited data sources", "Slow performance"], "a": 1, "e": ""}, {"q": "<b>Q32.</b> PM approach best supporting evolving fintech requirements <small>[Ch6.1]</small>", "o": ["Waterfall", "Agile", "Big bang", "Fixed-scope outsourcing"], "a": 1, "e": ""}, {"q": "<b>Q33.</b> Ordinance for AI RegTech aggregating customer data <small>[Ch4.7]</small>", "o": ["Banking Ordinance", "SFO", "Personal Data (Privacy) Ordinance", "Employment Ordinance"], "a": 2, "e": ""}, {"q": "<b>Q34.</b> NOT a key ISMS element (ISACA) <small>[Ch2.3]</small>", "o": ["Awareness and education", "Project management", "Incident handling", "Risk management"], "a": 1, "e": ""}, {"q": "<b>Q35.</b> Key risk of RAD <small>[Ch6.1]</small>", "o": ["Low user involvement", "Excessive documentation", "Scope expansion without control", "Guaranteed compliance"], "a": 2, "e": ""}, {"q": "<b>Q36.</b> Incorrect statement about DLT <small>[Ch4.8]</small>", "o": ["Shared record", "Records transactions across locations", "Spread across computers", "Open, publicly accessible database"], "a": 3, "e": ""}, {"q": "<b>Q37.</b> Beyond HK regulatory requirements for big-data analytics <small>[Ch4.8]</small>", "o": ["PDPO", "AMLO (FIs)", "US FATCA", "NAFTA"], "a": 3, "e": ""}, {"q": "<b>Q38.</b> Control reducing disruption when changes are deployed <small>[Ch6.1]</small>", "o": ["UAT only", "Change management and environment segregation", "Vendor self-certification", "Manual approval"], "a": 1, "e": ""}, {"q": "<b>Q39.</b> Responsibility that CANNOT be outsourced <small>[Ch2.1]</small>", "o": ["Coding", "System testing", "Accountability for system risk", "Infrastructure hosting"], "a": 2, "e": ""}, {"q": "<b>Q40.</b> Function with a detective role in cyber incidents <small>[Ch2.3]</small>", "o": ["Business units", "SOC", "Product teams", "External auditors only"], "a": 1, "e": ""}, {"q": "<b>Q41.</b> NOT a function of the APG <small>[Ch5.4]</small>", "o": ["Typologies research", "Issuing codes of practice", "Global engagement", "Technical assistance and training"], "a": 1, "e": ""}, {"q": "<b>Q42.</b> A merit of going digital for FIs <small>[Ch3.1]</small>", "o": ["Less staff time with customers", "Less face-time avoids complaints", "Access to vast digital information", "Every detail recorded means fewer disputes"], "a": 2, "e": ""}, {"q": "<b>Q43.</b> NOT an intended goal of Capital One labs <small>[Ch1.1]</small>", "o": ["Research emerging tech", "Closer relationship with Millennials", "Test new products", "Seed disruptive ideas"], "a": 1, "e": ""}, {"q": "<b>Q44.</b> Issuer of the Suitability Obligation Guideline <small>[Ch4.5]</small>", "o": ["HKAB", "OGCIO", "HKMA", "SFC"], "a": 3, "e": ""}, {"q": "<b>Q45.</b> Why third-party IT vendor reliance is an operational risk <small>[Ch6.3]</small>", "o": ["Loss of visibility and control over critical systems", "Vendors unregulated", "Faster innovation", "Lower compliance burden"], "a": 0, "e": ""}, {"q": "<b>Q46.</b> Function intended for transaction surveillance <small>[Ch5.2 (official key C)]</small>", "o": ["Senior approval of high-value transactions", "Due control of every cross-border transaction", "Customer due diligence by frontline staff", "Authenticate every online transaction"], "a": 2, "e": ""}, {"q": "<b>Q47.</b> Situation most indicating weak IT operational resilience <small>[Ch2.3]</small>", "o": ["Few incidents", "Regular reports", "Lack of real-time monitoring and escalation", "High login success"], "a": 2, "e": ""}, {"q": "<b>Q48.</b> PDPO principle addressing to whom data may be transferred <small>[Ch2.6 (official key B)]</small>", "o": ["Data Access & Correction", "Data Collection", "Data Use", "Openness"], "a": 1, "e": ""}, {"q": "<b>Q49.</b> Action BEST supporting proactive IT risk mitigation function chrome(){const u=UI[L];$("#ttl").textContent=u.title;$("#bdark").textContent=u.dark;$("#bprint").textContent=u.print;$("#blang").textContent=u.lang;document.documentElement.lang=L=="zh"?"zh-CN":"en";document.title=u.title}
function toc(){$("#toc").innerHTML=DATA[L].map((c,i)=>`<a class="${i==cur?'on':''}" onclick="go(${i})">${c.t}</a>`).join("")}
function go(i){cur=i;chrome();toc();const c=DATA[L][i],u=UI[L];let h=c.h;

 $("#main").innerHTML=h;window.sc=0;scrollTo(0,0);$("#bar").style.width=(i/(DATA[L].length-1)*100)+"%"}
function pick(b,n,k){const c=DATA[L][cur].q[n],p=b.parentNode;if(p.dataset.done)return;p.dataset.done=1;const bs=p.querySelectorAll(".opt");bs[c.a].classList.add("ok");if(k==c.a){window.sc++;$("#sc").textContent=window.sc+" / "+DATA[L][cur].q.length}else b.classList.add("no");$("#ex"+n).classList.add("show")}
