es.</div>\n<h2>5.3 KYC & onboarding</h2>\n<ul><li><b>Aggregation of identity:</b> RegTech firms aggregate worldwide data for a fuller picture of the customer.</li><li><b>Biometric authentication</b> (face, voice, fingerprint, iris): login <b>and</b> onboarding — can beat face-to-face checks.</li></ul>\n<h2>5.4 International efforts</h2>\n<table><tr><th>Body</th><th>Founded</th><th>Facts</th></tr>\n<tr><td><b>JFIU</b> Joint Financial Intelligence Unit</td><td>1989</td><td>Run jointly by <b>Hong Kong Police and Customs &amp; Excise</b>; holds the database of <b>STRs</b> (Suspicious Transaction Reports); analyses and refers them — <b>does not investigate itself</b>; gives guidance and seminars. The only one of the three established in HK</td></tr>\n<tr><td><b>FATF</b></td><td>1989</td><td>Inter-governmental; <b>37 member jurisdictions + 2 regional organisations</b> (incl. China, HK, US, UK); sets international standards</td></tr>\n<tr><td><b>APG</b> Asia/Pacific Group on Money Laundering</td><td>1997</td><td>Inter-governmental; <b>41</b> members; FATF-style regional body</td></tr></table>\n<div class=\"must\"><b class=\"t\">FATF recommendations</b>40 on money laundering → 2001: +9 on terrorist financing (updated 2004) → <b>2012: merged into 40</b>. Seven groupings: AML/CFT policies &amp; coordination · money laundering &amp; confiscation · terrorist financing &amp; proliferation financing · preventive measures · transparency &amp; beneficial ownership · powers of authorities &amp; institutional measures · international cooperation. <b>Travel Rule</b> for VASPs.</div>\n<div class=\"must\"><b class=\"t\">APG's five functions</b>1 Mutual evaluations · 2 Technical assistance &amp; training · 3 Typologies research · 4 Global engagement · 5 Private-sector engagement. <b>Not</b> on-site inspection, and <b>not</b> issuing codes of practice (Mock Q41 = B).</div>\n<div class=\"tip\"><b class=\"t\">Conclusion in the guide</b>RegTech is best driven by banks' own innovation teams: regulatory know-how + latest technology.</div>\n", "q": [{"q": "Regulatory trend since 2008?", "o": ["Same amount", "More regulation", "Less regulation", "Compliance much easier"], "a": 1, "e": ""}, {"q": "RegTech's definition is:", "o": ["Static", "Evolving", "Well established", "Non-existent"], "a": 1, "e": ""}, {"q": "RegTech vs FinTech:", "o": ["Unrelated", "RegTech is a subset of FinTech", "FinTech is a subset of RegTech", "Same"], "a": 1, "e": ""}, {"q": "RegTech for AML:", "o": ["Manual identification", "Identify suspicious transactions with AI/ML", "Follow up suspicious transactions", "Auto-report to regulators"], "a": 1, "e": ""}, {"q": "Which body was established in Hong Kong?", "o": ["JFIU", "FATF", "APG", "None"], "a": 0, "e": ""}, {"q": "Biometric authentication can be used for:", "o": ["Surveillance monitoring", "Regulatory reporting", "On-boarding", "Data privacy protection"], "a": 2, "e": ""}, {"q": "STR as defined by JFIU:", "o": ["Standard transaction report", "Suspicious transaction report", "Supervisory transaction report", "Supervisory trend-setting report"], "a": 1, "e": ""}, {"q": "How many recommendations does FATF currently publish?", "o": ["20", "40", "49", "51"], "a": 1, "e": ""}, {"q": "FATF recommendations cover:", "o": ["AML/CFT policies", "Money laundering & confiscation", "Terrorist & proliferation financing", "All of the above"], "a": 3, "e": ""}, {"q": "NOT a primary APG function:", "o": ["Technical assistance", "Typologies research", "Private-sector engagement", "On-site inspection"], "a": 3, "e": ""}, {"q": "Mock Q46: function intended for transaction surveillance (official key C):", "o": ["Senior staff approve high-value transactions", "Due control of every cross-border transaction", "Customer due diligence by frontline staff", "Authenticate every online transaction"], "a": 2, "e": "Official key: C — the guide describes surveillance as front-line due diligence plus systematic review."}]}, {"t": "Ch6 Projects & IT Ops", "h": "\n<h1>Chapter 6 · Business Analysis, System Projects & IT Operations</h1>\n<div class=\"card\"><b>Big picture:</b> How to build systems (SDLC / Agile / RAD) → how to design the master blueprint (EA / SOA / UCD) → how to outsource safely (principles, SLA, HKMA rules) → which professional certifications exist.</div>\n<h2>6.1 Development & project-management methods</h2>\n<p><b>SDLC</b> = framework for planning, controlling, creating, testing and delivering an information system. <b>Project management</b> = initiating → planning → executing → monitoring &amp; controlling → closing, balancing scope, quality, schedule, budget, resources, risk.</p>\n<h3>SDLC models</h3>\n<div class=\"flow\"><span>Waterfall</span><span>RAD</span><span>JAD</span><span>Fountain</span><span>Spiral</span><span>Build and Fix</span><span>Synchronise and Stabilise</span></div>\n<div class=\"trap\"><b class=\"t\">Traps</b>\"Build and <b>Use</b>\" is not a model (Mock Q21 = D). \"Trojan\" is not an Agile method (Q18 = D). Agile methods: DAD, Adaptive, Agile Modelling, Kanban, Scrum, Scrumban, XP, DSDM, FDD, Lean.</div>\n<p>General SDLC steps: evaluate existing system → define requirements → design (hardware, OS, programming, communications, security) → build, train, test → go live (phased or all at once) → evaluate and maintain. <b>Documentation matters whatever the model.</b></p>\n<table><tr><th></th><th>Waterfall</th><th>Agile</th></tr><tr><td>Flow</td><td>Linear; rigorous design specification <b>before</b> development</td><td>Iterative loop of sprints; working software every iteration</td></tr><tr><td>Changing needs</td><td>Poor fit</td><td>Good fit; requirements modified at the <b>Feedback</b> stage</td></tr><tr><td>Best when</td><td>Stable requirements</td><td>Customers available, quick delivery, flexibility, co-located team. <b>Best for evolving fintech requirements</b> (Mock Q32)</td></tr></table>\n<div class=\"flow\"><span>Requirements</span><i>→</i><span>Development</span><i>→</i><span>Testing/QA</span><i>→</i><span>Delivery</span><i>→</i><span>Feedback</span><i>↺</i></div>\n<ul><li><b>Scrum</b> (most common starting point): Product Owner (vision, release decision), Scrum Master (removes impediments, keeps sprint backlog transparent), self-managing team; sprints of 1–2 weeks; daily stand-ups. Adoption practices: daily meetings, live demos, shared feedback, keep improving.</li></ul>\n<div class=\"must\"><b class=\"t\">RAD and prototyping</b><b>Pro:</b> human-centred, incremental; users review a <b>live system</b> rather than paper, so fewer rejections after go-live; faster, reusable modular components. <b>Con:</b> <span class=\"kw\">scope creep</span> — endless enhancement requests blow up cost and schedule. Hence teams mix limited prototyping into a waterfall (Mock Q2 = A, Q35 = C).</div>\n<p><b>Tools:</b> Gantt chart (tasks over time) · CPM/PERT (min/max activity timing) · inventory control (RFID, QR, barcodes). <b>Not a project-management activity tool:</b> budget plan (Ch6 review Q3).</p>\n<h3>QA, testing, change management</h3>\n<ul><li>QA needs CIO commitment and quality metrics (e.g. components with errors ÷ total components); test environments should reproduce production; keep development, test and production separate.</li><li><b>Change management</b> process: classify and prioritise changes/impact · roles and responsibilities · version control and audit trails · scheduling/tracking/monitoring · <b>roll-back</b> · post-implementation verification · formal <b>emergency-change</b> procedure. <b>Change management + environment segregation</b> reduces disruption on deployment (Mock Q38 = B).</li></ul>\n<h2>6.2 Enterprise architecture</h2>\n<div class=\"card\"><b>EA</b> = blueprint for placing IT resources to support the business: alignment, standardisation, reuse, shared methods → IT cheaper, more strategic, more responsive.</div>\n<table><tr><th>Dimension</th><th>Application design</th><th>Enterprise architecture</th></tr><tr><td>Scope</td><td>Specific requirements, static blueprint</td><td>Continuous change and ambiguity</td></tr><tr><td>Products</td><td>An automation system</td><td>High-level master plan and building blocks for agility, simplicity, interoperability</td></tr><tr><td>Stakeholders / governance</td><td>Business owner</td><td>Multiple stakeholders</td></tr><tr><td>Delivery</td><td>Useful once developed, tested, released</td><td>Decides when each system should be put in place</td></tr></table>\n<div class=\"trap\"><b class=\"t\">Trap</b>\"Cost\" is NOT a differentiator (Mock Q15 = D).</div>\n<ul><li><b>SOA</b>: applications built from <b>loosely coupled</b>, reusable, platform/language/OS-independent services (e.g. open an account, view e-statement). Enablers: <b>XML, SOAP</b> (W3C; platform-independent), also REST, CORBA, Jini. Benefits: interoperability, shared services, flexibility, less vendor lock-in. Key principles <b>exclude \"controllability\"</b>. <b>Loose coupling and reusable services</b> raise flexibility (Mock Q17 = A).</li><li><b>UCD</b>: <b>Persona</b> (behaviour, needs, goals, skills, attitudes) · <b>Scenario</b> (daily-life problems) · <b>Use case</b> (step-by-step user–system interaction, incl. failure paths); methods: testing, card sorting, participatory design, surveys, interviews.</li></ul>\n<h2>6.3 Vendor & outsourcing management</h2>\n<div class=\"card\"><b>Outsourcing</b> = a third party (even an affiliate) continuously performs activities the bank would normally do. Benefits: quality, efficiency, cost, focus on core business, faster services.</div>\n<svg viewBox=\"0 0 700 90\"><rect x=\"10\" y=\"15\" width=\"150\" height=\"55\" rx=\"8\" fill=\"#bfdbfe\"/><text x=\"25\" y=\"47\">Select vendor</text><rect x=\"180\" y=\"15\" width=\"150\" height=\"55\" rx=\"8\" fill=\"#bbf7d0\"/><text x=\"195\" y=\"47\">Inception</text><rect x=\"350\" y=\"15\" width=\"150\" height=\"55\" rx=\"8\" fill=\"#fde68a\"/><text x=\"365\" y=\"47\">Monitor + SLA</text><rect x=\"520\" y=\"15\" width=\"170\" height=\"55\" rx=\"8\" fill=\"#fbcfe8\"/><text x=\"535\" y=\"47\">Exit &amp; transition</text></svg>\n<ul><li><b>Principles:</b> right time, right reasons, right method; typical reasons: cost, deadlines, missing skills/technology; assess finances and ability to manage a remote team; consider what confidential data is shared; plan the split between in-house and vendor work; regular monitoring; constant communication and feedback. Cloud (IaaS/PaaS/SaaS) is an alternative.</li><li><b>Exit strategy:</b> termination, especially early, is the hardest part — agree transitional services and duration, vendor resources committed, cooperation with the replacement vendor; early exit with low penalties preferred. Performance standards must not be static.</li></ul>\n<h3>SLA</h3>\n<ul><li>Outsourcing agreement with specific performance levels; credits/penalties are often the most negotiated part.</li><li>SLAs are <b>benchmarks, not warranties</b>: trigger penalties (missed) or bonuses/credits (exceeded). Critical metrics must be <b>objective, measurable, verifiable</b>; review periodically; on failure the provider must investigate root cause and report in writing.</li></ul>\n<table><tr><th>Outsourcing risk</th><th>Meaning</th></tr><tr><td>Strategic</td><td>Bad business decisions hurt earnings/capital</td></tr><tr><td>Reputational</td><td>Poor third-party service or conduct inconsistent with bank standards</td></tr><tr><td>Compliance</td><td>Inadequate controls at provider</td></tr><tr><td>Operational</td><td>Technology failure, weak provider finances, etc.</td></tr></table>\n<div class=\"must\"><b class=\"t\">HKMA expectations</b>Notify HKMA of cross-border outsourcing; safeguard customer data integrity and confidentiality; <b>Board oversight</b>. SPM covers accountability, risk management, provider ability, customer data integrity/confidentiality, control over outsourced activities, contingency planning, access to data. <b>Cost control is not mandatorily covered</b> (Ch6 review Q10 = C). <b>Accountability for system risk cannot be outsourced</b> (Mock Q39 = C). Vendor reliance is an operational risk because of <b>loss of visibility and control over critical systems</b> (Q45 = A). Under SPM OR-2, verify third parties have at least equivalent operational resilience. Not shared with outsourced providers: <b>intellectual property</b> (Mock Q11 = C).</div>\n<ul><li>Weak IT resilience = <b>no real-time monitoring and escalation</b> (Q47 = C). Proactive mitigation = <b>continuous monitoring + periodic risk assessment</b> (Q49 = B).</li></ul>\n<h2>6.4 Professional development</h2>\n<table><tr><th>Field</th><th>Certificates</th></tr>\n<tr><td>Project management</td><td><b>PMP</b> (global; ~25% higher average pay per PMI) · <b>CPIT(PD)</b> (HKCS; assessment-based, master level, 10–15 yrs, essay + panel) · <b>CPIT(PM)</b> (recognition-based, specialist, 5+ yrs)</td></tr>\n<tr><td>System service management</td><td><b>ITIL</b> (best-practice methodology) · <b>PRINCE2</b> (UK government method; Foundation and Practitioner) · <b>CPIT(SSO)</b> (practitioner level, 2+ yrs)</td></tr>\n<tr><td>Business analysis</td><td><b>IIBA</b> core certifications (<b>3</b>): ECBA (entry) · CCBA (2–3 yrs) · CBAP (5+ yrs); CPIT(BA)</td></tr>\n<tr><td>Cyber security</td><td><b>CISA · CISSP · CPIT(ISO)</b></td></tr></table>\n", "q": [{"q": "Which methodology emphasises rigorous design specifications before development?", "o": ["Waterfall", "RAD", "JAD", "Build and Fix", "All"], "a": 0, "e": ""}, {"q": "When are requirements modified in an Agile environment?", "o": ["Development", "Testing", "Delivery", "Feedback", "All"], "a": 3, "e": ""}, {"q": "Which is NOT used to manage project activities?", "o": ["Gantt chart", "Budget plan", "CPM", "PERT chart", "All"], "a": 1, "e": ""}, {"q": "Which certification relates to cyber security?", "o": ["PMP", "CISSP", "ITIL", "IIAB", "All"], "a": 1, "e": ""}, {"q": "Which is NOT a key SOA principle?", "o": ["Interoperability", "Controllability", "Shared services", "Flexibility", "All"], "a": 1, "e": ""}, {"q": "Number of core IIBA business-analysis certifications:", "o": ["1", "3", "7", "10", "12"], "a": 1, "e": ""}, {"q": "Which is FALSE about SOAP?", "o": ["Application communication protocol", "Message format", "Platform dependent", "Based on XML", "All"], "a": 2, "e": ""}, {"q": "ITIL focuses on:", "o": ["Business analysis", "Project management", "Cyber security", "Best-practice methodology", "All"], "a": 3, "e": ""}, {"q": "Defining a persona in UCD uses:", "o": ["Behaviour", "Needs", "Skills", "Attitudes", "All"], "a": 4, "e": ""}, {"q": "NOT mandatorily covered by HKMA's outsourcing SPM:", "o": ["Accountability", "Risk management", "Cost control", "Customer data confidentiality", "All"], "a": 2, "e": ""}, {"q": "Mock Q38: control reducing disruption when changes are deployed:", "o": ["UAT only", "Change management and environment segregation", "Vendor self-certification", "Manual approval"], "a": 1, "e": ""}, {"q": "Mock Q39: responsibility that CANNOT be outsourced:", "o": ["Coding", "System testing", "Accountability for system risk", "Infrastructure hosting"], "a": 2, "e": ""}]}, {"t": "Section B Essays", "h": "\n<h1>Section B · Essay Questions with Model Answers</h1>\n<div class=\"card\">Format: answer <b>any 2 of 3</b>, 25 marks each, black/blue pen. The three questions below are from the HKIB Mock Paper (EXAM-G-065, May 2026); answers are my condensed rewrite of the suggested solutions. Marking pattern: usually <b>1 mark per point (or 1 for the point + 1 for the explanation)</b>, so write distinct, labelled points.</div>\n<h2>Question 1 — iAM Smart, FSS and Open APIs (25 marks)</h2>\n<p><i>Scenario: OGCIO's iAM Smart (launched Dec 2020; free for HKID holders) lets users authenticate with phone biometrics and use government and commercial online services; HKMA supports it and FIs can test applications in the FSS.</i></p>\n<h3>(a) How iAM Smart helps FIs provide services — 6 marks (2 each, max 3 features)</h3>\n<ul><li><b>Authentication:</b> biometric on the user's phone, identity verified against the HKID at registration; one digital identity, no multiple usernames/passwords.</li><li><b>Digital signing:</b> legally backed under the Electronic Transactions Ordinance (Cap. 553); the higher-tier account has signing, the basic tier has authentication, form-filling and notifications.</li><li><b>e-Form filling (e-ME):</b> stored personal data auto-fills forms.</li><li><b>Personalised notifications:</b> service updates, expiry alerts.</li><li><b>Remote registration/onboarding</b> of customers.</li></ul>\n<h3>(b)(i) What is the FSS? — 3 marks</h3>\n<p>A regulator-set framework for pilot trials with a <b>smaller group of participants</b>, <b>without needing full compliance</b> with HKMA supervisory requirements, in an integration-testing environment similar to production.</p>\n<h3>(b)(ii) Any three operating principles — 9 marks (1 name + 2 explanation each)</h3>\n<ol><li><b>Boundary</b> — clear scope, phases, timing and termination arrangements.</li><li><b>Customer protection</b> — customers understand risk and join voluntarily; complaint handling; compensation for losses; right to withdraw.</li><li><b>Risk-management controls</b> — compensating controls for less-than-full compliance; protect production systems and other customers.</li><li><b>Readiness &amp; monitoring</b> — systems/processes ready; close monitoring of the trial.</li></ol>\n<h3>(c)(i) What are Open APIs? — 3 marks</h3>\n<p>An API is a software intermediary / set of rules letting computer systems exchange information and execute instructions. <b>Open</b> API: an organisation opens internal systems and data for programmatic access by third-party service providers in a transparent, documented way.</p>\n<h3>(c)(ii) Benefits — 4 marks</h3>\n<p><b>User-friendly</b> (no application, registration or certification; free) · <b>efficient and convenient</b> (automatic updates after one-off programming) · <b>promotes innovation</b> (flexible consolidation of information into new applications).</p>\n<h2>Question 2 — Remote onboarding, biometrics and data privacy (25 marks)</h2>\n<p><i>Scenario: pandemic-driven non-face-to-face onboarding with ID upload and liveness checks; a cloud-based biometric verification vendor; a work-from-home staff selfie that exposes customer data.</i></p>\n<h3>(a)(i) Liveness check — 3 marks</h3>\n<p><b>What:</b> detection mechanism proving the biometric comes from a live person (e.g. facial movement) and is not a fake, analysed algorithmically. <b>Why:</b> prevents spoofing and impersonation (fingerprint moulds, 3D silicone masks, pre-recorded video) and mitigates fraud.</p>\n<h3>(a)(ii) Remote onboarding steps — 3 marks (0.5 each)</h3>\n<p>Capture HKID photo → authenticate the HKID → selfie matched to HKID → complete application form → customer risk assessment → account opened.</p>\n<h3>(b) Compliance concerns with a cloud biometric vendor (PCPD requirements) — 8 marks</h3>\n<ul><li><b>Banking-industry guidance &amp; DPPs:</b> collection, accuracy, retention, use, security, access of customer data.</li><li><b>Biometric guidance:</b> wrongful disclosure can cause impersonation or discrimination; keep <b>templates</b> not raw images; derive templates and safely discard originals; templates should be technically infeasible to convert back; lawful, directly related, not excessive collection; <b>free and informed consent</b> with explanation of privacy impact; regular purging; periodic independent audits; protect against unauthorised/accidental access.</li><li><b>Cloud guidance:</b> obtain assurances from the provider before entrusting data; the FI stays responsible wherever data sits; use contractual means so the processor does not retain data longer than necessary (DPP2); multi-jurisdiction data flow and customer awareness of transborder arrangements; sub-contracting — same protection and controls; clear PICS/privacy notice that processing may be outsourced to a cloud provider.</li></ul>\n<h3>(c)(i) Who is accountable? — 3 marks</h3>\n<p><b>The bank (employer) is accountable</b> (and the staff member too): under s.65 PDPO, acts of an employee in the course of employment are treated as done by the employer as well. Defence available if the bank proves it took <b>practicable steps</b> to prevent it.</p>\n<h3>(c)(ii) Four practicable staff-protection measures — 8 marks</h3>\n<p>Regular communication of data-protection policy · ongoing training and induction training · periodic review of manuals/handbooks · need-to-know/need-to-use access · confidentiality/secrecy statements with consequences of breach · built-in system controls, internal audits and random checks.</p>\n<h2>Question 3 — RegTech (25 marks)</h2>\n<p><i>Scenario: HKMA (Arthur Yuen, Nov 2020) stresses RegTech alongside Fintech since the 2017 seven Smart Banking initiatives.</i></p>\n<h3>(a) Two reasons for not adopting RegTech — 4 marks</h3>\n<p>Budget/resource constraints · immature solutions for local requirements · lack of skilled talent · data formats not easily digitised.</p>\n<h3>(b) Four benefits, justified — 8 marks</h3>\n<p>Enhanced risk management · reduced KYC/CDD costs · customer attraction/retention · better customer experience · financial inclusion · reduced systemic risk · enhanced supervision · regulator efficiency (details in Chapter 5 notes).</p>\n<h3>(c) Five HKMA AI control principles — 10 marks (1 principle + 1 explanation each)</h3>\n<table><tr><th>Domain</th><th>Principle</th><th>Explanation</th></tr>\n<tr><td>Governance</td><td>Board and senior management accountable</td><td>Self-learning AI decides automatically; need governance, risk measures, clear three-lines-of-defence roles</td></tr>\n<tr><td rowspan=\"6\">Design &amp; development</td><td>Sufficient expertise</td><td>Competent developers; recruit, train, retain</td></tr>\n<tr><td>Appropriate explainability</td><td>No \"black box\" excuse; proportionate to materiality</td></tr>\n<tr><td>Good-quality data</td><td>Data governance framework</td></tr>\n<tr><td>Rigorous model validation</td><td>Test before production; prefer independent party</td></tr>\n<tr><td>Auditability</td><td>Audit logs and documentation retained</td></tr>\n<tr><td>Third-party vendor oversight; ethical, fair, transparent</td><td>Due diligence and periodic reviews; no discrimination; tell consumers a service is AI-powered and the risks</td></tr>\n<tr><td rowspan=\"4\">Ongoing monitoring</td><td>Periodic review and monitoring</td><td>Models change with live data; re-validate</td></tr>\n<tr><td>Data protection compliance</td><td>PDPO; use sanitised data instead of PII where appropriate</td></tr>\n<tr><td>Cybersecurity</td><td>Data poisoning and adversarial attacks</td></tr>\n<tr><td>Risk mitigation &amp; contingency</td><td>Human-in-the-loop, risk limits, sampling QA; ability to suspend AI and fall back to human/conventional process</td></tr></table>\n<h3>(d) Drivers of RegTech in AML/CFT — 3 marks</h3>\n<p>Pick any three from the Chapter 5 list (complex cross-border fraud, need for cross-channel detection, new digital payments, real-time analytics, sanctions screening, etc.).</p>\n<div class=\"tip\"><b class=\"t\">How to write it</b>Define → explain mechanism → give a banking example → give a risk/limit → link to a rule (PDPO, SPM, FATF). Label each point so the marker can award one mark per point.</div>\n", "q": []}, {"t": "Mock Paper (50 MCQ)", "h": "<h1>Mock Paper — Section A with Official Key</h1><div class=\"card\">All 50 questions are condensed. The key and chapter reference come from the Mock Paper's suggested-answer table. Click an option to check.</div>", "q": [{"q": "<b>Q1.</b> Technology addressing exposure when employees check company email at home <small>[Ch2.5]</small>", "o": ["IPS", "TIP", "SEM", "MDM"], "a": 3, "e": ""}, {"q": "<b>Q2.</b> Issue often associated with RAD <small>[Ch6.1]</small>", "o": ["Scope creep", "Lower acceptance", "Higher risk", "Lower quality"], "a": 0, "e": ""}, {"q": "<b>Q3.</b> NOT a goal of Capital One Lab <small>[Ch1.1]</small>", "o": ["Facilitate design thinking", "Create brand awareness in social media", "Seed disruptive ideas", "Foster rapid prototyping"], "a": 1, "e": ""}, {"q": "<b>Q4.</b> Bank losing young customers to fintech with seamless onboarding — most likely gap <small>[Ch1.1]</small>", "o": ["Branch coverage", "Insufficient data analytics and AI capability", "Over-investment in cybersecurity", "Excess compliance"], "a": 1, "e": ""}, {"q": "<b>Q5.</b> Trend forcing banks from 'customer interface owner' to 'infrastructure provider' <small>[Ch1.2]</small>", "o": ["Cloud", "BaaS and Open API banking", "Blockchain settlement", "Digital asset custody"], "a": 1, "e": ""}, {"q": "<b>Q6.</b> Why fintechs compete despite relying on bank infrastructure <small>[Ch1.2]</small>", "o": ["Lower risk", "Front-end design, analytics, journey orchestration without owning the balance sheet", "Outside regulatory perimeter", "Higher guaranteed yields"], "a": 1, "e": ""}, {"q": "<b>Q7.</b> NOT covered under Big Data governance framework <small>[Ch3.1 (official key B)]</small>", "o": ["Metadata definitions", "Data security policies", "Data privacy policies", "Data cleansing policies"], "a": 1, "e": ""}, {"q": "<b>Q8.</b> Development signalling need to redesign architecture for scalability and speed <small>[Ch4.9]</small>", "o": ["Branch automation", "Growth of mobile/digital banking behaviour", "Decline in interbank payments", "Less IT outsourcing"], "a": 1, "e": ""}, {"q": "<b>Q9.</b> DPP least relevant to cloud computing <small>[Ch2.2 (official key A)]</small>", "o": ["Data Collection", "Accuracy and Retention", "Data Use", "Data Security"], "a": 0, "e": ""}, {"q": "<b>Q10.</b> NOT a property of data mining <small>[Ch3.1]</small>", "o": ["Actionable information", "Predicting outcomes", "Automatic pattern discovery", "Probability of every outcome"], "a": 3, "e": ""}, {"q": "<b>Q11.</b> Bank asset NOT shared with outsourced providers <small>[Ch6.3]</small>", "o": ["Customer data", "Commercial ideas", "Intellectual property", "Operational techniques"], "a": 2, "e": ""}, {"q": "<b>Q12.</b> Best balance of regulatory control and scalability <small>[Ch1.2]</small>", "o": ["Public only", "Private only", "Hybrid", "Community"], "a": 2, "e": ""}, {"q": "<b>Q13.</b> Why senior-management support is key to ISMS <small>[Ch2.1]</small>", "o": ["Also vulnerable", "Hackers target them", "Investment in cyber security is worth it", "Usually laymen"], "a": 2, "e": ""}, {"q": "<b>Q14.</b> NOT a drawback critics claim for Big Data SME lending <small>[Ch1.3]</small>", "o": ["Not transparent", "Outcome not proven", "Too inhumane", "Possibly racially biased"], "a": 2, "e": ""}, {"q": "<b>Q15.</b> NOT a differentiator of EA vs application design <small>[Ch6.2]</small>", "o": ["Delivery", "Product", "Governance", "Cost"], "a": 3, "e": ""}, {"q": "<b>Q16.</b> Ordinance to observe when rolling out a chatbot <small>[Ch3.6]</small>", "o": ["Employment", "Dutiable Commodities", "Personal Data (Privacy)", "Prevention of Bribery"], "a": 2, "e": ""}, {"q": "<b>Q17.</b> SOA characteristic that most improves flexibility <small>[Ch6.2]</small>", "o": ["Loose coupling and reusable services", "Centralised ownership", "Single vendor", "Manual reconciliation"], "a": 0, "e": ""}, {"q": "<b>Q18.</b> NOT an Agile methodology <small>[Ch6.1]</small>", "o": ["Scrumban", "Kanban", "Scrum", "Trojan"], "a": 3, "e": ""}, {"q": "<b>Q19.</b> DLT vs traditional databases — most effective when <small>[Ch4.8]</small>", "o": ["Shared consistency across institutions", "High-speed batch only", "Strong anonymisation", "Simpler reporting"], "a": 0, "e": ""}, {"q": "<b>Q20.</b> NOT an input of biometric authentication <small>[Ch5.3]</small>", "o": ["Facial", "Fingerprint", "Signature", "Iris"], "a": 2, "e": ""}, {"q": "<b>Q21.</b> NOT a methodology in SDLC <small>[Ch6.1]</small>", "o": ["Spiral", "Waterfall", "Fountain", "Build and Use"], "a": 3, "e": ""}, {"q": "<b>Q22.</b> Purpose of a penetration test <small>[Ch2.1]</small>", "o": ["Help regulator onsite review", "Support board IT policy review", "Identify technical vulnerability", "Help law enforcement hack suspects"], "a": 2, "e": ""}, {"q": "<b>Q23.</b> Why robo-advisors won't soon replace humans <small>[Ch4.5]</small>", "o": ["High cost", "Human touch entices action", "Lack of diversity", "Language flexibility"], "a": 1, "e": ""}, {"q": "<b>Q24.</b> Exploratory analytics for fraud without knowing which is fraudulent <small>[Ch3.2]</small>", "o": ["Regression", "Clustering", "Naive Bayes", "Probabilistic"], "a": 1, "e": ""}, {"q": "<b>Q25.</b> NOT a weakness of AI in transaction surveillance <small>[Ch5.1]</small>", "o": ["Depends on algorithm sophistication", "Needs massive data", "Data integration hindered by privacy", "Labour unions object"], "a": 3, "e": ""}, {"q": "<b>Q26.</b> Characteristic of a data warehouse <small>[Ch3.1]</small>", "o": ["All data loaded, none rejected", "Highly structured", "Stored as-is", "Encrypted"], "a": 1, "e": ""}, {"q": "<b>Q27.</b> Control that MOST directly strengthens customer authentication <small>[Ch2.5]</small>", "o": ["Password complexity", "Session timeout", "Manual account review", "Biometric and multi-factor authentication"], "a": 3, "e": ""}, {"q": "<b>Q28.</b> NOT considered a DLT weakness <small>[Ch4.8 (official key A)]</small>", "o": ["Lack of accessibility", "Lack of scalability", "Lack of latency", "Lack of readiness"], "a": 0, "e": ""}, {"q": "<b>Q29.</b> Why supplement rule-based AML with ML <small>[Ch5.2]</small>", "o": ["Rule systems prohibited", "ML eliminates false positives", "ML adapts to evolving patterns", "Regulators mandate AI-only"], "a": 2, "e": ""}, {"q": "<b>Q30.</b> Method for suspicious activity without labelled fraud data <small>[Ch3.2]</small>", "o": ["Regression", "Supervised learning", "Unsupervised learning", "Descriptive analytics"], "a": 2, "e": ""}, {"q": "<b>Q31.</b> Major regulatory concern with complex AI models <small>[Ch3.6]</small>", "o": ["Computing cost", "Lack of transparency and explainability", "Limited data sources", "Slow performance"], "a": 1, "e": ""}, {"q": "<b>Q32.</b> PM approach best supporting evolving fintech requirements <small>[Ch6.1]</small>", "o": ["Waterfall", "Agile", "Big bang", "Fixed-scope outsourcing"], "a": 1, "e": ""}, {"q": "<b>Q33.</b> Ordinance for AI RegTech aggregating customer data <small>[Ch4.7]</small>", "o": ["Banking Ordinance", "SFO", "Personal Data (Privacy) Ordinance", "Employment Ordinance"], "a": 2, "e": ""}, {"q": "<b>Q34.</b> NOT a key ISMS element (ISACA) <small>[Ch2.3]</small>", "o": ["Awareness and education", "Project management", "Incident handling", "Risk management"], "a": 1, "e": ""}, {"q": "<b>Q35.</b> Key risk of RAD <small>[Ch6.1]</small>", "o": ["Low user involvement", "Excessive documentation", "Scope expansion without control", "Guaranteed compliance"], "a": 2, "e": ""}, {"q": "<b>Q36.</b> Incorrect statement about DLT <small>[Ch4.8]</small>", "o": ["Shared record", "Records transactions across locations", "Spread across computers", "Open, publicly accessible database"], "a": 3, "e": ""}, {"q": "<b>Q37.</b> Beyond HK regulatory requirements for big-data analytics <small>[Ch4.8]</small>", "o": ["PDPO", "AMLO (FIs)", "US FATCA", "NAFTA"], "a": 3, "e": ""}, {"q": "<b>Q38.</b> Control reducing disruption when changes are deployed <small>[Ch6.1]</small>", "o": ["UAT only", "Change management and environment segregation", "Vendor self-certification", "Manual approval"], "a": 1, "e": ""}, {"q": "<b>Q39.</b> Responsibility that CANNOT be outsourced <small>[Ch2.1]</small>", "o": ["Coding", "System testing", "Accountability for system risk", "Infrastructure hosting"], "a": 2, "e": ""}, {"q": "<b>Q40.</b> Function with a detective role in cyber incidents <small>[Ch2.3]</small>", "o": ["Business units", "SOC", "Product teams", "External auditors only"], "a": 1, "e": ""}, {"q": "<b>Q41.</b> NOT a function of the APG <small>[Ch5.4]</small>", "o": ["Typologies research", "Issuing codes of practice", "Global engagement", "Technical assistance and training"], "a": 1, "e": ""}, {"q": "<b>Q42.</b> A merit of going digital for FIs <small>[Ch3.1]</small>", "o": ["Less staff time with customers", "Less face-time avoids complaints", "Access to vast digital information", "Every detail recorded means fewer disputes"], "a": 2, "e": ""}, {"q": "<b>Q43.</b> NOT an intended goal of Capital One labs <small>[Ch1.1]</small>", "o": ["Research emerging tech", "Closer relationship with Millennials", "Test new products", "Seed disruptive ideas"], "a": 1, "e": ""}, {"q": "<b>Q44.</b> Issuer of the Suitability Obligation Guideline <small>[Ch4.5]</small>", "o": ["HKAB", "OGCIO", "HKMA", "SFC"], "a": 3, "e": ""}, {"q": "<b>Q45.</b> Why third-party IT vendor reliance is an operational risk <small>[Ch6.3]</small>", "o": ["Loss of visibility and control over critical systems", "Vendors unregulated", "Faster innovation", "Lower compliance burden"], "a": 0, "e": ""}, {"q": "<b>Q46.</b> Function intended for transaction surveillance <small>[Ch5.2 (official key C)]</small>", "o": ["Senior approval of high-value transactions", "Due control of every cross-border transaction", "Customer due diligence by frontline staff", "Authenticate every online transaction"], "a": 2, "e": ""}, {"q": "<b>Q47.</b> Situation most indicating weak IT operational resilience <small>[Ch2.3]</small>", "o": ["Few incidents", "Regular reports", "Lack of real-time monitoring and escalation", "High login success"], "a": 2, "e": ""}, {"q": "<b>Q48.</b> PDPO principle addressing to whom data may be transferred <small>[Ch2.6 (official key B)]</small>", "o": ["Data Access & Correction", "Data Collection", "Data Use", "Openness"], "a": 1, "e": ""}, {"q": "<b>Q49.</b> Action BEST supporting proactive IT risk mitigation <small>[Ch2.1]</small>", "o": ["Post-incident response only", "Continuous monitoring and periodic risk assessment", "Annual compliance reporting", "Full vendor reliance"], "a": 1, "e": ""}, {"q": "<b>Q50.</b> Most flexible response for traditional banks to FinTech disruption <small>[Ch1.1]</small>", "o": ["Innovation Lab", "Incubator Partnership", "Corporate Venture Capital", "Acquisition & Merger"], "a": 1, "e": ""}]}], "zh": [{"t": "总览 Overview", "h": "\n<h1>EFNB 满分笔记 · Essential Fintech in Next-gen Banking</h1>\n<div class=\"card\">HKIB Certified Banker CB(II)。<b>考试:</b>3 小时 · Section A = <b>50 道 MCQ</b>(每题同分,共 50 分)· Section B = <b>3 题任选 2 题</b>论述题,每题 25 分。覆盖全部 6 章。资料来源:HKIB 学习指南(2026年7月版)与 Mock Paper EXAM-G-065(2026年5月),Mock Paper 附有<b>官方答案</b>与论述题参考答案。</div>\n<h2>使用方法</h2>\n<ol><li>先读每章顶部的\"主线\"。</li><li><span class=\"kw\">黄框</span> = 必背;<span style=\"background:#fee2e2;padding:0 6px;border-radius:4px\">红框</span> = 陷阱(\"哪项不是…\"题);<span style=\"background:#dcfce7;padding:0 6px;border-radius:4px\">绿框</span> = 记忆法。</li><li>每章末有练习题(点选项即时判分;<b>题目保持英文</b>,与真题一致)。<b>Mock Paper</b> 页含 50 题官方答案;<b>Section B</b> 页含 3 道论述题参考答案。</li><li>点击左侧 <b>EN / 中文</b> 按钮可随时切换语言。</li></ol>\n<h2>六章知识地图</h2>\n<table><tr><th>章</th><th>核心</th></tr>\n<tr><td>Ch1 转型</td><td>Innovation Lab / Incubator / CVC · Open API · BaaS · Cloud · DeFi</td></tr>\n<tr><td>Ch2 安全与私隐</td><td>SPM(IC-1、TM-G、TM-E、SA-2)· CIA · ISMS · ISO 27001 · CFI · PDPO 六原则</td></tr>\n<tr><td>Ch3 数据与 AI</td><td>Supervised / Unsupervised · 欺诈 · AML · IADS · AI 伦理</td></tr>\n<tr><td>Ch4 数码渠道</td><td>FPS · SVF · SWIFT · Chatbot · Robo · VASP · DLT · Mobile</td></tr>\n<tr><td>Ch5 合规</td><td>RegTech · KYC · JFIU · FATF · APG</td></tr>\n<tr><td>Ch6 项目与营运</td><td>Agile · RAD · EA · SOA · SLA · 外判 · 证书</td></tr></table>\n<p><b>跨章联系:</b>AML:Ch3(ML)↔ Ch5(RegTech/FATF)↔ Ch2(PDPO)· 外判:Ch2(SA-2)↔ Ch6(SLA/OR-2)↔ Ch1(Cloud)· DLT/数字资产:Ch1 ↔ Ch4 ↔ Ch2(稳定币)。</p>\n<h2>必背数字与名称</h2>\n<table><tr><th>主题</th><th>必背</th></tr>\n<tr><td>Fintech 2025 / 2030</td><td>5 支柱 / DART(Data · AI · Resilience · Tokenisation),2025年11月</td></tr>\n<tr><td>Digital Bank</td><td>2024年10月25日由 Virtual Bank 改名;8 张牌照(2025年2月)</td></tr>\n<tr><td>Open API Framework</td><td>2018年7月18日;四阶段(资讯 → 申请 → 账户资料[IADS]→ 交易)</td></tr>\n<tr><td>Cloud</td><td>Public / Private(最安全)/ Hybrid(最佳平衡)</td></tr>\n<tr><td>SPM</td><td>IC-1 · TM-G-1 · TM-G-2 · TM-E-1 · TM-E-2 · SA-2;OR-2(2022年5月31日)</td></tr>\n<tr><td>ISMS / ISO 27001</td><td>7 要素(无 project management)· 2013:114 控制/14 节/35 目标 · 2022 版 · SoA</td></tr>\n<tr><td>CFI</td><td>2016年5月;2.0 于 2021年1月1日生效;C-RAF(固有风险 → 成熟度 → iCAST)· PDP · CISP</td></tr>\n<tr><td>PDPO / GDPR</td><td>1995/1996,6 DPPs / 欧盟居民、72 小时、全球营业额 4%</td></tr>\n<tr><td>沙盒</td><td>FSS 2016年9月(2026年3月 388 试点)· GenA.I. Sandbox 2024年8月13日 · 稳定币条例 2025年8月1日(Cap. 656)</td></tr>\n<tr><td>大数据生命周期</td><td>Acquire · Prepare · Aggregate · Analyse · Report · Act</td></tr>\n<tr><td>IADS</td><td>2023 宣布;2024年1月1日试点;28 银行;Showroom Day 2024年10月23日;FSS 3.1 资助最高 HK$500,000</td></tr>\n<tr><td>HKMA AI 原则</td><td>2019年11月1日,12 个领域</td></tr>\n<tr><td>支付</td><td>CHATS(HKD/USD/RMB/EUR)· FPS 2018 · Payment Connect 2025年6月22日 · PSSVFO 2015年11月13日</td></tr>\n<tr><td>SWIFT</td><td>1973;只做信息传递,不清算结算;ISO 20022</td></tr>\n<tr><td>VASP</td><td>SFC VATP 牌照自 2023年6月1日;欧盟 MiCA;美国 FinCEN/BSA;FATF Travel Rule</td></tr>\n<tr><td>JFIU / FATF / APG</td><td>1989(警务处+海关)/ 1989(37+2 成员,40 条)/ 1997(41 成员,5 职能)</td></tr>\n<tr><td>SDLC / Agile</td><td>Waterfall 先规格;Agile 在 Feedback 改需求;Scrum sprint 1–2 周;RAD 风险 = scope creep</td></tr>\n<tr><td>外判</td><td>问责不可外判;SLA 是基准不是保证;4 类风险(战略/声誉/合规/营运)</td></tr></table>\n<h2>考试技巧</h2>\n<ul><li><b>MCQ:</b>读完所有选项;多数 \"which is NOT\" 题只埋了一个错误项(Trojan 当 Agile、Build and Use 当 SDLC、signature 当 biometric、Project management 当 ISMS 要素)。</li><li><b>论述题:</b>按分数分配时间;评分大致一点一分,务必分点、逐点解释。</li></ul>\n<div class=\"card\"><b>说明:</b>Section A 答案均依 Mock Paper 的<b>官方答案</b>;个别官方答案看似反直觉(如 Q7、Q28),按官方记。</div>\n", "q": []}, {"t": "第1章 转型 Transformation", "h": "\n<h1>第1章 信息系统与科技管理 · Information Systems & Technology Management</h1>\n<div class=\"card\"><b>主线:</b>银行诞生于互联网之前,成本高、系统僵化、依赖分行;FinTech 敏捷,抢走 customer interface。银行最聪明的做法是<span class=\"kw\">合作而非对抗</span>——Innovation Lab / Incubator Partnership / Corporate VC,再借 Open API、BaaS、Cloud 把自己变成平台。</div>\n<h2>1.1 银行业转型 Transformation</h2>\n<h3>银行的 7 大劣势</h3>\n<div class=\"flow\"><span>High operating cost 运营成本高</span><span>Functional gaps 功能缺口</span><span>Low agility 系统不灵活</span><span>Immature IT infrastructure</span><span>Expensive IT projects</span><span>Fragmented technology 技术碎片化</span><span>核心系统重建又慢又贵</span></div>\n<div class=\"must\"><b class=\"t\">必背:科技是 \"enabler\" 不是 \"driver\"</b>真正的驱动力是客户期望;科技是 \"the straw that broke the camel's back\"(压垮骆驼的最后一根稻草)。</div>\n<h3>银行与 FinTech 合作的 3 种方式(★★★ 高频)</h3>\n<table><tr><th>方式</th><th>要点</th><th>案例</th></tr>\n<tr><td><b>Innovation Lab</b><br>最主动、控制力最强</td><td>\"数码游乐场/test kitchen\";fail fast;可请 FinTech 专家做原型;<b>direct control,产品更贴合</b>;intrapreneur(内部创业者)</td><td>Standard Bank PlayRoom(20,000 sq ft);Capital One Labs(DC/NYC/SF,100+ 员工);Commonwealth Bank(10,000 sq ft,约 US$3m);Visa Innovation Centre;DBS Innovation Lab(2016)</td></tr>\n<tr><td><b>Incubator Partnership</b><br>居中、<b>最灵活</b></td><td>银行提供资金、场地、行业洞察、合规经验;初创提供技术</td><td>Accenture FinTech Innovation Lab(纽约 2010,12 周);DBS Accelerator + Nest(香港 The Vault,湾仔,2015:约 140 申请者取 10 家)</td></tr>\n<tr><td><b>Corporate VC</b><br>最保守</td><td>直接注资换股权,依战略优先级,而非只图回报</td><td>—</td></tr></table>\n<div class=\"must\"><b class=\"t\">Capital One Labs 目标</b>加速数码议程 · design thinking / lean start-up · 研究新科技与消费者趋势 · seed disruptive ideas · rapid prototyping · 与生态合作。<br><b>不是目标:</b>在社交媒体建立品牌知名度(Mock Q3);与 Millennials 建立更近关系(Mock Q43)。</div>\n<div class=\"trap\"><b class=\"t\">陷阱</b>\"最直接控制\"= Innovation Lab;\"最灵活\"= Incubator Partnership。</div>\n<h3>香港监管时间线</h3>\n<table><tr><th>时间</th><th>事件</th></tr>\n<tr><td>2017年9月</td><td>HKMA 公布 <b>7 项 Smart Banking</b>:FPS 全面连通 · FSS 1.0→2.0 · 数码银行 · Banking Made Easy · Open API 框架 · 跨境金融科技合作 · 研究与人才</td></tr>\n<tr><td>2018年6月8日</td><td>修订《虚拟银行认可指引》;<b>2024年10月25日</b> \"Virtual Bank\" 改名 <b>Digital Bank</b>;截至 2025年2月共 8 张牌照</td></tr>\n<tr><td>2018年7月18日</td><td><b>Open API Framework</b>:风险为本,<b>四阶段</b></td></tr>\n<tr><td>2021</td><td><b>Fintech 2025</b>(5 支柱)</td></tr>\n<tr><td>2024年8月13日</td><td><b>GenA.I. Sandbox</b>(HKMA + Cyberport)</td></tr>\n<tr><td>2025年11月</td><td><b>Fintech 2030</b>,DART 框架,40+ 措施</td></tr></table>\n<table><tr><th>DART</th><th>内容</th></tr>\n<tr><td><b>D</b>ata & Infrastructure</td><td>CDI(商业数据通)、新一代数据与支付基建、跨境支付连通</td></tr>\n<tr><td><b>A</b>rtificial Intelligence</td><td>\"AI x Authorized Institutions\"(AI2)策略、共享 AI 基建、金融专用模型</td></tr>\n<tr><td><b>R</b>esilience & Security</td><td>金融科技网络安全认证、<b>quantum</b> 韧性、post-quantum cryptography</td></tr>\n<tr><td><b>T</b>okenisation</td><td>真实资产代币化(RWA)、代币化政府债券、Project Ensemble</td></tr></table>\n<div class=\"tip\"><b class=\"t\">记忆法</b>Fintech 2025 五支柱:所有银行上金融科技 · 为 CBDC 做准备 · 新一代数据基建 · 增加人才 · 培育生态。2030 = <b>DART</b>(\"飞镖\")。</div>\n<h3>新科技在银行的应用</h3>\n<table><tr><th>技术</th><th>例子</th></tr>\n<tr><td>Biometrics</td><td>认证由 2 因素演进到 <b>3 因素</b>:know(密码)/ have(令牌)/ are(生物特征)。Mastercard 指纹卡:指纹加密存于 EMV 芯片,最多 2 枚</td></tr>\n<tr><td>Chatbot</td><td>CaixaBank imaginBank(2016,纯手机银行)2017 年推出西班牙首个银行 chatbot;后改名 imagin(imaginKids 0–11 / imaginTeens 12–17 / imagin 18+)</td></tr>\n<tr><td>人脸识别</td><td>Alibaba/Ant \"Smile to Pay\";澳门 ATM</td></tr>\n<tr><td>机器人</td><td>中银香港 RoBOC(Nao;粤/英/普;6000+ 问题);东京三菱 UFJ 最先</td></tr>\n<tr><td>AR</td><td>Westpac NZ(2014)全球首个 AR 银行 App;约 90% 分行事务可线上办</td></tr>\n<tr><td>GenAI</td><td>聊天机器人、信贷建议书生成、ML 降低交易筛查误报、预测性 AML/欺诈监控</td></tr></table>\n<p><b>银行 IS 管理 5 方面:</b>Application systems · IT talent · IT security · Computing services · Technology。应用策略:自建 / 买套装 / 定制 / 外包 / 混合。<b>CTO</b> 负责科技战略、设计、部署、控制与营运。</p>\n<div class=\"card\"><b>数字:</b>2024年香港诈骗 44,480 宗;2025年银行投诉创新高 4,005 宗;《银行业(修订)条例 2025》允许银行实时交换情报(mule accounts);Accenture:到 2020 年北美 35% 银行份额或转移给数码新秀;2024年 85% 消费者用电子钱包(2022年为 56%);2025年 US$320亿 SME 银行收入可转向 embedded finance。</div>\n<h2>1.2 开放银行 Open Banking</h2>\n<div class=\"card\"><b>\"侍应领班\"比喻:</b>客人记得的是领班(maître d'),不是厨师。<b>FinTech = 领班</b>(拥有客户关系与品牌),<b>银行 = 厨师</b>(后台)。核心风险:银行被降为 \"backend utility\"。</div>\n<table><tr><th>概念</th><th>定义</th></tr>\n<tr><td><b>BaaS</b></td><td>服务提供者数码化合并,通过互联网提供端到端银行服务;监管推动 API 开放,把银行产品 \"unbundle\";即插即用 Stripe、PayPal</td></tr>\n<tr><td><b>API</b></td><td>让开发者使用他人软件资源;是<b>技术架构</b>,不是中间件或网关</td></tr>\n<tr><td><b>Private API banking</b></td><td>只向<b>内部</b>开发者开放后台数据和功能</td></tr>\n<tr><td><b>Open API banking</b></td><td>公开规格,<b>内外</b>开发者皆可注册;客户控制个人数据;\"Lego 式银行\"</td></tr></table>\n<h3>银行业务三层架构(Chris Skinner)★</h3>\n<table><tr><th>层</th><th>内容</th></tr><tr><td>Tier 3 <b>Frontier</b></td><td>FinTech 初创与服务提供者生态,面对客户</td></tr><tr><td>Tier 2 <b>Middleware</b></td><td>Banking-as-a-Service,托管 FinTech 并连接银行后台</td></tr><tr><td>Tier 1 <b>Foundation</b></td><td>传统、持牌、受监管银行(牌照、信任、结算)</td></tr></table>\n<h3>云 Cloud</h3>\n<table><tr><th>模式</th><th>要点</th></tr><tr><td>Public</td><td>向公众开放、第三方管理;未来或用于信用卡处理与支票结算</td></tr><tr><td>Private</td><td>又称 internal cloud,仅授权用户、防火墙内、由企业 IT 治理;<b>最安全</b></td></tr><tr><td>Hybrid</td><td>两者结合;监管控制与可扩展性的<b>最佳平衡</b>(Mock Q12)</td></tr></table>\n<div class=\"must\"><b class=\"t\">云的好处</b>降低 CAPEX 和营运成本;pay-per-use;计算周期少、基建复杂度低、设计点少、足迹易管理、开发周期短、容量规划更准。<b>上云前要考虑:</b>数据保密、安全、合规、服务质量。</div>\n<p><b>DeFi:</b>用区块链+智能合约做借贷、交易,不靠中心化机构。特性:<span class=\"kw\">atomic settlement</span>、<span class=\"kw\">composability</span>、<span class=\"kw\">programmability</span>、<span class=\"kw\">permissionless</span>。新服务:liquid staking、flash loans、AMM。最大挑战:监管不确定。</p>\n<h2>1.3 六个案例</h2>\n<table><tr><th>案例</th><th>主体</th><th>要点</th></tr>\n<tr><td>Blockchain</td><td>中银香港 + 测量师</td><td>物业估值上 DLT:周期短、核保快、少人为错误、降成本(地产占 HK GDP 5%、业权 11%、住屋占 CPI 31.7%)</td></tr>\n<tr><td>Innovation Lab</td><td>DBS(2016)</td><td>创业心态、fail fast;预计全年 5,000+ 人参与;McKinsey 2014:欧洲银行只数码化 20–40% 流程、创新开支 &lt;1%</td></tr>\n<tr><td>Payment</td><td>Android Pay(2017年6月)</td><td>8 家港银;5,000+ 非接触式支付点;手机不存卡号</td></tr>\n<tr><td>Credit tech</td><td>AMP</td><td>SME 贷款 <b>US$35k–250k</b>,<b>2 个工作日</b>批核,免抵押,按月营业额定额,<b>90–360 天</b>,每日自动扣款。SME ≈ 全球 80% 经济活动</td></tr>\n<tr><td>Fundraising</td><td>Investible(2014年5月)</td><td>股权众筹;帮 6 间初创集资;年收入 US$4m;50 万+ 用户</td></tr>\n<tr><td>Remittance</td><td>WorldRemit(2010)</td><td>佣金最高 8%;<b>5 步</b>:国家→方式→金额→收款人→发送;可入银行/取现/手机钱包</td></tr></table>\n<div class=\"must\"><b class=\"t\">共同点</b>六个案例都由<b>互联网与数码通信</b>推动(Ch1 review Q8)。</div>\n", "q": [{"q": "Which way gives a bank the most direct control/steering of FinTech development?", "o": ["Innovation labs", "Incubator partnership", "Corporate venture capital", "Crowdfunding", "Licensing agreements"], "a": 0, "e": "In-house lab = direct control."}, {"q": "Which is NOT a key advantage of innovation labs?", "o": ["Projects developed internally", "Targeted products", "Innovation at low cost", "Direct control", "FinTech experts collaborate"], "a": 2, "e": "Labs are not necessarily low-cost (e.g. Commonwealth ~US$3m)."}, {"q": "Which is NOT a typical Millennial trait?", "o": ["Heavy mobile use", "Less face-to-face", "Real-time information", "More willing to pay for expert advice", "Better educated"], "a": 3, "e": ""}, {"q": "Which is NOT a PwC 'Web 2.0 communication gap'?", "o": ["No modern segment strategy", "Lack of latest browser standard", "No targeted products", "Reliance on branches", "No interactive channels"], "a": 1, "e": ""}, {"q": "Digital technologies transform IT services and talent in banking in:", "o": ["Product design", "Risk management", "Development methodology", "'Fail fast' mentality", "All of the above"], "a": 4, "e": ""}, {"q": "Key risk to banks from 'Open Up Banking'?", "o": ["Relegated to back end", "APIs give agile rivals access", "FinTech gains face-time and brand", "High cost vs selective FinTech", "All of the above"], "a": 4, "e": ""}, {"q": "Advantage of cloud architecture?", "o": ["Leverage physical branches", "Lower capex and operating cost", "Less regulatory burden", "Leapfrog FinTech", "Higher information security"], "a": 1, "e": ""}, {"q": "Common theme across the six transformation examples?", "o": ["All raise revenue", "All open untouched markets", "All enabled by the Internet and digital communications", "All well-tested", "None"], "a": 2, "e": ""}]}, {"t": "第2章 安全与私隐 Security", "h": "\n<h1>第2章 网络安全与数据私隐 · Cyber Security & Data Privacy</h1>\n<div class=\"card\"><b>主线:</b>没有绝对安全,只是让入侵更难。靠 layered defence、ISMS、监管框架(SPM、CFI)、技术(SOC/SIEM/MFA/加密)和私隐法(PDPO 六原则)。<b>人是最弱一环。</b></div>\n<h2>2.1 HKMA 技术管理监管</h2>\n<div class=\"card\"><b>HKMA</b>(1993 年成立;依《外汇基金条例》与《银行业条例》)是香港 de facto 中央银行/银行监管者,监管 <b>Authorised Institutions (AIs)</b>:持牌银行、有限制牌照银行、接受存款公司。<b>SPM</b>(Supervisory Policy Manual)订立最低标准;TM-G、TM-E 与 IT 最相关。</div>\n<table><tr><th>模块</th><th>要点</th></tr>\n<tr><td><b>IC-1</b> Risk management framework</td><td>2003 年发布、2017 更新;内控基础;<b>新产品政策须涵盖科技问题</b>,必要时咨询 IT</td></tr>\n<tr><td><b>TM-G-1</b> 科技风险管理一般原则</td><td>2003 发布;IT governance 基石。内容:IT 控制政策、<b>three lines of defence</b>(1st:IT 职能,含职责分离——改程序的人不能自己上线;IT steering committee。2nd:technology risk management,风险 = impact × likelihood。3rd:technology audit)、持续培训。<b>5 个关键 IT 职能:</b>security management · system development & change management · information processing · communication networks · management of technology service providers。高层批准 non-compliance <b>不等于风险已缓解</b>,只代表风险被理解并接受</td></tr>\n<tr><td><b>TM-G-2</b> 业务持续计划 BCP</td><td>因 Y2K 而普及。BCP 范围大于 IT disaster recovery:<b>business impact analysis → recovery strategy → BCP procedures</b>;须<b>定期更新与测试</b>。SPM <b>OR-2</b>(2022年5月31日)operational resilience 四部分:operational risk management · BCP & testing · third-party dependency management · ICT(含 cyber security)。ISO/IEC 22301 = BCM 标准</td></tr>\n<tr><td><b>TM-E-1</b> 电子银行风险管理</td><td>2004 首发;2015 大修,涵盖电话银行、手机银行、自助终端、社交媒体渠道、非接触支付。引入 <b>operational / reputation / legal risk</b>、董事会参与、三道防线、<b>independent assessment</b> 与 <b>penetration testing</b>(找漏洞,不一定要攻入)。2019年10月更新:远程开户认证;高风险交易(转账给第三方、向未登记高风险商户缴费等)须 <b>2FA</b>;异常/高风险交易(如大额 card-not-present)须通知客户;须搜查假网站/App 并报警;风险为本的 <b>source code review</b>;事故可发新闻稿;与社交平台网络隔离;小额交易可豁免 2FA</td></tr>\n<tr><td><b>TM-E-2</b> 网上存款广告</td><td>依《银行业条例》第 92 条(AI 不得向公众宣传存款,有例外)。非技术性:涉及 push notification、搜索引擎可见度、海外网站</td></tr>\n<tr><td><b>SA-2</b> Outsourcing</td><td><b>活动可外包,问责不可外包。</b>关注:accountability、风险评估、provider 能力、协议、客户资料保密、控制、应急计划、查阅数据、海外外包。子公司用总行系统也算外包</td></tr>\n<tr><td>SVF & RPS</td><td>依 PSSVFO;SVF 牌照制度 2016 年开始(此前只有八达通)。无牌经营多用途 SVF 是<b>刑事罪行</b>。RPS 若中断会影响金融稳定则受监管。SVF 指引 2016、RPS 监管 2020</td></tr>\n<tr><td>HKAB NFC</td><td>NFC 手机支付安全最佳实践;HKMA 监管时会参考</td></tr></table>\n<h3>HKMA 沙盒与稳定币</h3>\n<table><tr><th>项目</th><th>要点</th></tr>\n<tr><td><b>FSS</b></td><td>2016年9月推出;2.0(2017)、3.0(2021)、3.1(2024);至 2026年3月底批准 <b>388</b> 个试点。可在<b>未完全合规</b>下用有限客户试点。FSS 2.0 四原则:<b>Boundary · Customer protection · Risk-management controls · Readiness & monitoring</b>。FSS 3.1 经 Cyberport 提供资金,项目须支持 CBDC/CDI/IADS/RegTech/risk management;IADS 项目最高 HK$500,000</td></tr>\n<tr><td><b>GenA.I. Sandbox</b></td><td>2024年8月13日(银行业);2026年3月扩展至证监会、保监局、强积金局。焦点:<b>风险管理、反欺诈、客户体验</b>;\"A.I. vs A.I.\";Cyberport 提供 GPU。首批 15 个用例/10 间银行(如 BOCHK AI avatar;Citi AML/KYC 摘要;大新 STR 生成;渣打按揭 memo 由 1 天缩至 5 分钟)</td></tr>\n<tr><td><b>Stablecoins Ordinance</b> (Cap. 656)</td><td>2025年8月1日生效;发行指定稳定币须 HKMA 牌照。指引:科技风险框架;每年第三方审计(含 smart contract 验证);<b>私钥全生命周期</b>控制(HSM、重要密钥 <b>air-gapped</b> 生成、multi-sig 密钥分开存放、MFA、日志);客户 2FA 与<b>预先登记</b>钱包地址;事故预案(freeze/burn);DR 每年测试。AML 指引:blockchain analytics、<b>Travel Rule</b>、钱包筛查、二级市场监察、记录保存</td></tr></table>\n<h2>2.2 网络安全威胁(定义配对)</h2>\n<table><tr><th>威胁</th><th>一句话定义</th></tr>\n<tr><td>Malware</td><td>恶意程序统称(virus、worm、Trojan)</td></tr>\n<tr><td>Virus / worm</td><td>会复制;worm 在网络内快速自我复制</td></tr>\n<tr><td>DoS / DDoS</td><td>用海量请求压垮系统;DDoS 用多台电脑(<b>botnet</b>)</td></tr>\n<tr><td>Phishing</td><td>伪装可信方的诱饵电邮,骗取密码;常配合 email spoofing</td></tr>\n<tr><td>Man-in-the-middle</td><td>攻击者夹在双方之间截取并修改信息(例:改转账指令)</td></tr>\n<tr><td>Ransomware</td><td>加密系统索取赎金(常用比特币)</td></tr>\n<tr><td>Botnet</td><td>\"robot network\",被集中控制的僵尸电脑</td></tr>\n<tr><td>APT</td><td>高度组织、持续监视目标、复杂度极高</td></tr>\n<tr><td>Social engineering</td><td>攻击<b>人</b>(冒充 IT 支援或高层骗密码)</td></tr>\n<tr><td>Cloud (NIST)</td><td>按需访问共享资源池;IaaS / PaaS / SaaS;安全管理本质像外包</td></tr></table>\n<h2>2.3 网络安全概念</h2>\n<ul><li><b>CIA:</b>Confidentiality(只给 need-to-know 的人)· Integrity(防未授权更改)· Availability(防中断)· <b>Non-repudiation</b>(发送者无法否认,靠非对称加密)。</li><li>Information security = 任何形式的信息;cyber security = 联网环境下的<b>数码</b>信息。</li></ul>\n<div class=\"must\"><b class=\"t\">Weakest link 原则</b>攻击者攻最弱一环(前门十把锁,侧门没关)。所以要 layered defence + 定期 vulnerability assessment + security awareness。</div>\n<h3>ISMS 的 7 大要素(ISACA)★★</h3>\n<div class=\"flow\"><span>1 高层领导、承诺与支持</span><span>2 Policies & procedures</span><span>3 Organisation</span><span>4 Awareness & education</span><span>5 Risk management</span><span>6 Monitoring & compliance</span><span>7 Incident handling & response</span></div>\n<div class=\"trap\"><b class=\"t\">陷阱</b><b>Project management</b> 不是 ISMS 要素(Mock Q34)。高层支持让安全开支从 \"expense\" 变成 \"investment\"(Q13)。</div>\n<ul><li>需要 CISO 与 Chief Data Privacy Officer;风险 = 影响 × 可能性;monitoring 属<b>侦测性(detective)</b>控制(IT Risk/Audit);技术监控可外包给 <b>SOC</b>;\"零事故报告\"可能只是没发现。</li><li>三道防线:1st IT 安全营运 · 2nd IT 风险 · 3rd <b>IT audit</b>。</li></ul>\n<h3>ISO/IEC 27001</h3>\n<table><tr><th>项目</th><th>内容</th></tr><tr><td>地位</td><td>ISMS 主流标准;ISO 27002 提供实施指引;源自 BS7799 → ISO 17799;最新版 <b>2022</b></td></tr>\n<tr><td>2013 结构</td><td>Context → Leadership → Planning → Support → Operation → Performance evaluation → Improvement(对应 PDCA:Plan = Leadership+Planning+Support;Do = Operation;Check = Performance evaluation;Act = Improvement)</td></tr>\n<tr><td>2013 控制措施</td><td><b>114</b> 项 / <b>14</b> 节 / <b>35</b> 个控制目标</td></tr>\n<tr><td>认证 3 步</td><td>诊断审查(含 <b>Statement of Applicability, SoA</b>)→ 独立审计(lead auditor)→ 持续跟进</td></tr>\n<tr><td>相关</td><td>ISO 27018(公有云 PII:14 安全类别 + 11 私隐原则);ISO 29100(私隐框架)</td></tr></table>\n<h2>2.4 网络安全监管制度</h2>\n<p><b>ECF</b>:非强制但鼓励采用的能力基准;网络安全版 <b>ECF-C</b>,分 Core 与 Professional 两级,按三道防线角色分类。</p>\n<h3>CFI 三支柱(★★★)</h3>\n<table><tr><th>支柱</th><th>要点</th></tr>\n<tr><td><b>C-RAF</b> Cyber Resilience Assessment Framework</td><td>① <b>Inherent risk assessment</b>(低/中/高)→ ② <b>Maturity assessment</b>(对照固有风险找缺口)→ ③ <b>iCAST</b>(情报主导的攻击模拟;固有风险中/高或目标成熟度 intermediate/advanced 者必做)</td></tr>\n<tr><td><b>PDP</b> Professional Development Programme</td><td>HKIB + ASTRI 联合开发的本地网络安全专业认证与培训</td></tr>\n<tr><td><b>CISP</b> Cyber Intelligence Sharing Platform</td><td>HKAB + ASTRI 开发;2018年4月全面启动;2019 HKMA 指使用率偏低(不清楚何时分享什么、人才不足)</td></tr></table>\n<p>CFI 于 2016年5月推出;<b>CFI 2.0</b> 于 2020年11月3日公布,2021年1月1日生效。他国类似:美国 FFIEC 评估工具;英国 BoE 的 <b>CBEST</b>。</p>\n<h2>2.5 网络安全技术</h2>\n<table><tr><th>技术</th><th>说明</th></tr>\n<tr><td>SOC</td><td>集中处理网络安全事务;可外包</td></tr><tr><td>TIP</td><td>实时汇总、关联、分析多来源威胁数据;可编程</td></tr><tr><td>SIEM</td><td>= SIM + SEM;实时分析安全告警</td></tr><tr><td>DLP</td><td>保护使用中(endpoint)、传输中(network)、存储中(at rest)的数据</td></tr>\n<tr><td>Endpoint / MDM</td><td>每个远程设备都是入口;MDM 管理移动设备——<b>应对员工在家查公司邮件</b>(Mock Q1)</td></tr>\n<tr><td>NGFW</td><td>第三代防火墙 = 传统防火墙 + 应用防火墙(<b>DPI</b>)+ <b>IPS</b></td></tr>\n<tr><td>MFA</td><td>knowledge / possession / inherence 中至少两类</td></tr>\n<tr><td>Biometrics</td><td>面部、指纹、虹膜、声纹——<b>签名不是</b>生物识别输入(Q20)</td></tr>\n<tr><td>Penetration test</td><td>目的:<b>找出技术漏洞</b>(Q22)</td></tr></table>\n<table><tr><th></th><th>对称加密 Symmetric</th><th>非对称加密 Asymmetric</th></tr><tr><td>密钥</td><td>同一把</td><td>一对(public + private)</td></tr><tr><td>代表</td><td>DES(弱)→ Triple DES → <b>AES</b>(128–256 bit)</td><td>公钥密码学</td></tr><tr><td>缺点</td><td>密钥分发</td><td>较慢</td></tr>\n<tr><td>用法</td><td>大量数据加密</td><td>用<b>私钥</b>加密 → 证明发送者(non-repudiation);用<b>公钥</b>加密 → 只有私钥持有人可读(confidentiality)</td></tr></table>\n<h2>2.6 数据私隐 Data Privacy</h2>\n<div class=\"card\"><b>PDPO</b> 1995 制定、1996 生效;<b>PCPD</b> 1996 成立;2011 修订(2012 大部分生效)规管出售个人资料与直销;2014 PCPD 发银行业指引。<b>违反 DPP 不自动构成刑事罪</b>:PCPD 先发 enforcement notice,违反通知才是罪行。</div>\n<p><b>个人资料</b>两条件:① 与在世、可识别的人有关 ② 以可合理查阅的形式存在。银行称 <b>CIF</b>。<b>PICS</b> 须列明目的、转移对象、提供是自愿还是强制、查阅及更正权利。</p>\n<table><tr><th>DPP</th><th>名称</th><th>核心</th></tr>\n<tr><td>1</td><td><b>Data Collection</b></td><td>合法公平;目的与职能相关;通知目的及<b>可能转移给哪些类别的人</b>;必要但不过量</td></tr>\n<tr><td>2</td><td><b>Accuracy & Retention</b></td><td>资料准确;不保留超过所需时间</td></tr>\n<tr><td>3</td><td><b>Data Use</b></td><td>只用于原目的或直接有关目的,新目的需自愿明确同意</td></tr>\n<tr><td>4</td><td><b>Data Security</b></td><td>防未授权/意外查阅、处理、删除、遗失、使用</td></tr>\n<tr><td>5</td><td><b>Openness</b></td><td>公开政策与做法、持有资料类别</td></tr>\n<tr><td>6</td><td><b>Data Access & Correction</b></td><td>当事人可查阅及更正资料</td></tr></table>\n<div class=\"tip\"><b class=\"t\">记忆法</b>收 → 准 → 用 → 保 → 开 → 查。云计算<b>最不相关</b>:Data Collection Principle(Mock Q9 官方答案 A)。</div>\n<table><tr><th>框架</th><th>要点</th></tr>\n<tr><td>GDPR</td><td>适用于控制/处理<b>欧盟居民</b>数据的任何机构;<b>72 小时</b>通报;罚款最高<b>全球年收入 4%</b>;2018年5月生效</td></tr>\n<tr><td>OECD (2013)</td><td>Collection limitation、Data quality、Purpose specification、Use limitation、Security safeguards、Openness、Individual participation、Accountability</td></tr>\n<tr><td>APEC (2005/2016)</td><td>Preventing harm、Notice、Collection limitation、Use、Choice、Integrity、Security safeguards、Access & correction、Accountability</td></tr>\n<tr><td>BS 10012</td><td>个人信息管理系统(2009;2017 按 GDPR 更新)</td></tr>\n<tr><td>ISO/IEC 29100</td><td>2011;11 项原则(同意与选择、数据最小化、公开透明、问责、信息安全…)</td></tr>\n<tr><td>Privacy by Design</td><td>7 原则:主动非被动 · 私隐为默认 · 嵌入设计 · 全功能(正和)· 端到端生命周期保护 · 可见透明 · 尊重用户</td></tr></table>\n<p><b>论述题常用 PCPD 指引:</b>生物识别资料(存 template 而非原图、不需要即清除、自由且知情同意、定期独立审计)与云计算(合约保证、分包商、跨境流动、清晰的 PICS 通知)。</p>\n", "q": [{"q": "Which is generally the third line of defence in cyber security?", "o": ["IT function", "IT risk", "IT audit", "None"], "a": 2, "e": ""}, {"q": "Which is part of HKMA's CFI?", "o": ["C-RAF", "PDP", "CISP", "All of the above"], "a": 3, "e": ""}, {"q": "What is DDoS?", "o": ["Programs disrupting a target system (many sources)", "Email posing as a trusted party", "An encryption mechanism", "On-demand shared resource pool"], "a": 0, "e": ""}, {"q": "GDPR targets companies controlling personal data of:", "o": ["Hong Kong residents", "US residents", "EU residents", "ASEAN residents"], "a": 2, "e": ""}, {"q": "Which technology supports non-repudiation?", "o": ["Biometrics", "Asymmetric key encryption", "Ransomware", "Firewalls"], "a": 1, "e": ""}, {"q": "Technique to obtain sensitive information through human users:", "o": ["Botnets", "APT", "Social engineering", "Cloud computing"], "a": 2, "e": ""}, {"q": "Which standard addresses information security?", "o": ["ISO/IEC 22301", "ISO/IEC 27001", "ISO/IEC 29100", "ISO/IEC 20000"], "a": 1, "e": ""}, {"q": "Official key: which DPP deals with to whom personal data may be transferred? (Mock Q48)", "o": ["Data Access & Correction", "Data Collection", "Data Use", "Openness"], "a": 1, "e": "Official key: B."}]}, {"t": "第3章 数据与AI Data & AI", "h": "\n<h1>第3章 数据、分析与AI · Data, Analytics & AI</h1>\n<div class=\"card\"><b>主线:</b>大数据(structured + unstructured)→ machine learning(监督/非监督)→ 应用于信贷、欺诈、AML → 受 AI 伦理四支柱约束(偏见、可解释、私隐、问责)→ IADS 提供更多数据。</div>\n<h2>3.1 大数据分析 Big Data Analytics</h2>\n<div class=\"must\"><b class=\"t\">生命周期 6 步</b><div class=\"flow\"><span>Acquire</span><i>→</i><span>Prepare</span><i>→</i><span>Aggregate</span><i>→</i><span>Analyse</span><i>→</i><span>Report</span><i>→</i><span>Act</span></div></div>\n<ul><li><b>Velocity</b> = 收集/处理<b>速度</b>;<b>Variety</b> = <b>格式</b>多样。别混淆。</li><li>大数据 = 半结构化+非结构化混合,关系型数据库无法处理;传统分析靠统计模型,大数据常用 ML。</li><li>互动可视化 4 作用:理解 · 找关系 · 找趋势 · 讲故事。</li><li><b>Data warehouse</b>(80 年代末):<b>高度结构化</b>数据用于报告(Mock Q26 = B);<b>Data lake</b> 原样存放。</li><li>Mock Q7 官方答案 B:\"data security policies\" 被标为<b>不属于</b> Big Data governance framework——按官方答案记。</li></ul>\n<table><tr><th>领域</th><th>应用</th></tr><tr><td>零售</td><td>客户洞察、cross-sell、留存</td></tr>\n<tr><td>商业银行</td><td>AML/KYC/CDD/EDD(UBO、PEP);5 分钟信贷决策;数千数据点承保;精准数码营销;分行选址</td></tr>\n<tr><td>投行/财资</td><td>Goldman Sachs 被称 \"tech company\"(9,000 工程师);IBM Watson(DBS);Kensho;DBS 800+ AI 模型、350 用例、SGD 7.8 亿价值(2024)</td></tr></table>\n<div class=\"must\"><b class=\"t\">AML 三大不足</b>① 人手收集数据与风险评分(约一半 AML 成本是人力)② 复杂持股结构与伪造文件 ③ 交易监控:规则被学会(10 万一笔被抓,20 笔×5,000 不被抓)→ 大量 <b>false positives</b>。</div>\n<h2>3.2 机器学习 Machine Learning(★★★)</h2>\n<div class=\"card\">Arthur Samuel(1959):让电脑<b>不用明确编程</b>也能学习。</div>\n<table><tr><th></th><th>Supervised 监督</th><th>Unsupervised 非监督</th></tr><tr><td>数据</td><td>有标签</td><td>无标签</td></tr><tr><td>任务</td><td>Regression(连续值,如 GDP)、Classification(离散标签,如垃圾邮件)</td><td>Clustering(K-means)、association</td></tr><tr><td>银行例子</td><td>信用卡欺诈(有明确标签);违约概率</td><td><b>AML</b>(没有已确认洗钱标签);\"买了此商品的人也买了…\"</td></tr></table>\n<p>分类算法:Decision Tree · K-Nearest Neighbour(多数表决)· Naive Bayes(特征独立假设)。</p>\n<div class=\"trap\"><b class=\"t\">高频题</b>不需判断观察值是否欺诈的探索分析 → <b>Clustering</b>(Mock Q24 = B);没有标签数据时侦测可疑活动 → <b>Unsupervised learning</b>(Q30 = C)。</div>\n<ul><li><b>Parametric</b> 参数数量固定;<b>non-parametric</b> 复杂度随数据增长。</li><li><b>Overfitting</b>:模型拟合噪音,预测差。</li><li><b>K-means</b>:随机选 K 个中心 → 重复(①分配最近中心 ②移动中心到均值)直到不变。</li><li><b>Data mining</b>:产生可行动信息、预测、自动发现模式;<b>不是</b>\"评估每个结果的概率\"(Q10 = D)。<b>Information extraction</b> 处理非结构化文本。</li><li><b>Deep learning</b>:多层神经网络(input / hidden / output);DeepFace 97.25% vs 人类 97.53%;DeepMind 令 Google 数据中心冷却能耗降 <b>40%</b>。</li><li><b>Cross-sell</b>(相关产品)vs <b>up-sell</b>(更高端同类);留存率 +5% → 利润 +25%~95%;<b>silent attrition</b> = 客户悄悄减少使用。</li><li>HKMA 用 STT + RPA 处理投诉,效率 +8%(Complaints Watch 23)。</li></ul>\n<h2>3.3 AI 应用</h2>\n<table><tr><th>方向</th><th>例子</th></tr><tr><td>Internal 员工向</td><td>摘要、知识管理、报告生成、代码生成、错误侦测、标准化输出</td></tr><tr><td>External 客户向</td><td>Robo-advice、推荐引擎、chatbot(BofA Erica、Kasisto)、获客(SEO)、变现(研究分析)、维护(投诉分析)</td></tr></table>\n<ul><li>2008 后监管数据:US <b>CCAR</b>(2,000+ 变量)、<b>Basel 239</b>(风险数据汇总,G-SIB)、IFRS 9、Solvency II。</li><li>结构化监管数据 → 传统 ML;高频低质量数据 → <b>deep learning</b>。监管者要求模型简单可验证 → <b>CART</b> 决策树可接受;神经网络是 \"black box\"。</li></ul>\n<table><tr><th></th><th>信用卡欺诈</th><th>AML</th></tr><tr><td>标签</td><td>✔ 清楚</td><td>✘ 没有(洗钱难定义、执法机构不反馈)</td></tr><tr><td>方法</td><td>监督分类;FICO Falcon(神经网络)</td><td>聚类等非监督 + 以 SAR 作替代标签</td></tr><tr><td>难点</td><td>平衡误报</td><td>规则系统误报多;ML 须向合规人员可解释</td></tr></table>\n<div class=\"must\"><b class=\"t\">为何规则式 AML 要加 ML(Q29 = C)</b>ML <b>适应不断演变的欺诈模式</b>;只是减少、不是消除误报;监管并未强制只用 AI。</div>\n<ul><li>交易员行为监控(流氓交易、操纵基准、内幕交易):结合邮件、日历、出入记录、电话(NLP)。</li><li>算法/高频交易:70%+ 交易由自动系统完成;承保 underwriting 是 ML 的 \"完美工作\"。</li><li>AI 监控的弱点:依赖算法水平、需大量数据、数据整合受私隐限制——<b>\"劳工团体反对\"不是</b>弱点(Q25 = D)。</li></ul>\n<p><b>Alternative credit scoring</b>:针对无信贷记录者(外籍人士、自由职业者、毕业生、无银行户口者)。数据:设备、页面行为、网络足迹、位置、电话号码/电讯商。公司:Emric(350 数据点)、Lenddo、Friendly Score(820 变量)、First Access。批评:不透明、法律未验证、可能歧视;data broker 的数据种类比信贷机构多样。</p>\n<h2>3.4 信贷资料服务</h2>\n<ul><li><b>Credit Data Smart (CDS)</b> 2024 年推出,HKAB、DTCA、LMLA 开发,HKMA 支持:避免单点故障、强化治理与消费者保护、促进竞争。</li><li><b>SME credit</b>:另类贷款人用大数据评估;挑战——不透明、未经验证、歧视风险(US Fair Credit Reporting Act)。</li><li><b>资本市场</b>:评级(S&P、Moody's、Fitch)滞后(财报后约 6 个月复核)、昂贵、利益冲突(发行人付费)、可能受政治影响。<b>Credit spread</b> = 到期相近但信用质量不同的债券收益率差(如 8% 公司债 vs 6% 国债 = 200bp);及时但<b>流动性差的产品难观察</b>。ML:Thomson Reuters AI 每日读 35 万篇新闻。</li></ul>\n<h2>3.5 IADS 银行账户数据共享(新增完整版)</h2>\n<div class=\"card\">HKMA 推动:零售/SME/企业客户经<b>同意</b>,把账户数据安全分享给其他参与银行。2023 年宣布,<b>2024年1月1日</b>开始试点,<b>28</b> 间参与银行。属全球 Open Banking / Open Finance / Open Data 潮流。</div>\n<table><tr><th>主题</th><th>要点</th></tr>\n<tr><td>生态角色</td><td>HKMA(监管者)· 参与银行(被要求做 <b>data provider</b>,鼓励做 data consumer)· 客户(须在两银行均有存款账户)· HKSTP(营运 <b>IADS Developer Platform</b>)· FinTech/技术供应商(Jetco、Planto)——目前只有银行能当 provider/consumer</td></tr>\n<tr><td>核心原则</td><td>Data ownership · Transparency · Security · Interoperability · Innovation · Customer-centricity</td></tr>\n<tr><td>历史</td><td>属 2017年9月 Smart Banking 的 Open API 项目;受欧盟 <b>PSD2</b> 启发。<b>Open API Framework(2018年7月18日)</b>四阶段:I 产品/服务资料(2019年1月)· II 申请(2019年10月)· III 账户资料(IADS 属此阶段)· IV 交易/支付。HKAB Phase III 标准 2021年12月14日发布(技术、UX、认证、数据、安全[OAuth 2.0、OpenID Connect、2FA]、营运)</td></tr>\n<tr><td>覆盖数据</td><td>企业/SME/零售存款账户:账户可用性、状态、余额与交易记录、账户详情</td></tr>\n<tr><td>同意流程</td><td>客户在 consuming bank 发起,选银行/账户及期限(3/6/12 个月)→ 跳转至 providing bank 登入确认 → 每间银行重复 → 随时可查看/撤销。每次 API 调用不额外收费</td></tr>\n<tr><td>Showroom Day</td><td>2024年10月23日。三大用例:<b>consolidated financial analysis</b>、<b>streamlined loan application</b>、<b>online identity verification (KYC)</b></td></tr>\n<tr><td>借贷</td><td>申请更快;用现金流数据促进普惠;动态风险监控;实时验证减少欺诈。ZA Bank:免上传入息证明,最快 3 分钟批核;上商:SME 贷款逾 HK$5000 万,最快 1 天;恒生 HK$6000 万</td></tr>\n<tr><td>财务管理</td><td><b>PFM</b>(个人)与 <b>BFM</b>(企业,\"digital CFO\")。McKinsey:64% 港人会因数码体验差考虑转行;EY:36% 港 SME 考虑转换</td></tr>\n<tr><td>KYC</td><td>重用另一银行已完成的 CDD。2024年10月只有大新在 SME KYC 用 IADS。对照:新加坡 <b>MyInfo</b>、欧盟 PSD2 + eIDAS</td></tr>\n<tr><td>全球</td><td><b>Open Banking</b> = 经同意分享银行数据(有时含支付);<b>Open Finance</b> = 还含退休金、券商、保险</td></tr>\n<tr><td>对 AI 的影响</td><td>AI 四支柱:training data · training methods · model architecture · computational power。数据是瓶颈(2019 HKMA 调查:52% 称数据不足);港人平均约 3 个银行账户→数据碎片化。IADS 带来更好模型与反馈循环。GenAI 约 80% 用于内部;Agentic AI 起步阶段</td></tr>\n<tr><td>未来</td><td>更多银行、更广数据(信用卡、贷款、投资)、更深用例(PFM/BFM 进 RM dashboard)、纳入保险/MPF;FSS 3.1 资助最高 HK$500,000</td></tr></table>\n<h2>3.6 AI 伦理与监管(4 大支柱)</h2>\n<table><tr><th>支柱</th><th>问题</th><th>对策</th></tr>\n<tr><td><b>Fairness & bias</b></td><td>历史数据偏见 → 对种族、性别、地区歧视</td><td>偏见测试;EU AI Act;MAS 指引</td></tr>\n<tr><td><b>Transparency & explainability</b></td><td>黑箱:拒绝按揭却解释不了</td><td><b>SHAP</b>、<b>LIME</b>;human-in-the-loop;GDPR 解释权</td></tr>\n<tr><td><b>Privacy & security</b></td><td>训练数据含个人资料</td><td>Differential privacy、federated learning、homomorphic encryption、Privacy by Design</td></tr>\n<tr><td><b>Accountability & governance</b></td><td>银行、供应商、数据提供者谁负责?</td><td>董事会监督、AI 风险委员会、AI 伦理政策;HKMA <b>High-level Principles on AI</b>(2019年11月1日;12 个领域)</td></tr></table>\n<div class=\"trap\"><b class=\"t\">陷阱</b>复杂 AI 的主要监管关注 = <b>缺乏透明度与可解释性</b>(Q31 = B)。</div>\n", "q": [{"q": "Why was alternative credit scoring introduced?", "o": ["Few people have bank accounts in some developing countries", "Unbanked lack credit history", "Non-traditional data reduces bad loans", "Behavioural/social data is available", "All of the above"], "a": 4, "e": ""}, {"q": "What is fundamentally different about new lenders using alternative scoring?", "o": ["Seemingly irrelevant data to predict behaviour", "Neural nets to maximise interest", "No branches", "Always more accurate", "All of the above"], "a": 0, "e": ""}, {"q": "Which data might Lenddo-type companies use?", "o": ["Phone brand", "Suburb", "Mobile network provider", "Purchase / 'Like' history", "All of the above"], "a": 4, "e": ""}, {"q": "How does a data broker differ from a credit reference agency?", "o": ["Doesn't keep credit history", "Agencies don't aggregate sources", "Brokers collect far more varieties of data", "Brokers earn from lending", "None"], "a": 2, "e": ""}, {"q": "Shortcomings of credit ratings:", "o": ["Lag", "Expensive", "Issuer-paid", "Political pressure", "All of the above"], "a": 4, "e": ""}, {"q": "Main shortcoming of market credit spreads:", "o": ["Too volatile", "Less accurate than ratings", "Hard to interpret", "Hard to observe for illiquid products", "Easy to forge"], "a": 3, "e": ""}, {"q": "Mock Q24: exploratory fraud detection without knowing what is fraudulent:", "o": ["Regression", "Clustering", "Naive Bayes", "Probabilistic"], "a": 1, "e": ""}, {"q": "Mock Q30: suspicious activity without labelled fraud data:", "o": ["Regression", "Supervised learning", "Unsupervised learning", "Descriptive analytics"], "a": 2, "e": ""}, {"q": "Mock Q29: why supplement rule-based AML with ML?", "o": ["Rules prohibited", "ML eliminates false positives", "ML adapts to evolving patterns", "Regulators mandate AI-only"], "a": 2, "e": ""}, {"q": "Mock Q10: NOT a property of data mining analytics:", "o": ["Actionable information", "Predicting likely outcome", "Automatic pattern discovery", "Probability of every outcome"], "a": 3, "e": ""}, {"q": "Mock Q26: a characteristic of a data warehouse:", "o": ["All data loaded, none turned away", "Highly structured", "Stored 'as is'", "Encrypted"], "a": 1, "e": ""}]}, {"t": "第4章 数码渠道 Channels", "h": "\n<h1>第4章 数码银行与服务渠道 · FinTech for Digital Banking & Service Channels</h1>\n<div class=\"card\"><b>主线:</b>支付 → 汇款 → chatbot → robo-advice → digital branch → 数字货币/资产/VASP → DLT → mobile first。考点集中在:<b>支付基建(FPS/SVF)、数字资产监管、DLT、分行新角色</b>。</div>\n<h2>4.1 Fintech Promotion Roadmap</h2>\n<p>目标:促进创新(AI、DLT)· 金融普惠 · 合作 · 监管支持。措施:Fintech Knowledge Hub · 扩大沙盒(FSS、GenA.I.)· Open API Framework · <b>FPS</b>。</p>\n<h2>4.2 支付 Payments</h2>\n<ul><li><b>CSSO</b>(2004年11月生效)→ 2015年11月13日改名 <b>PSSVFO (Cap. 584)</b>。</li><li><b>CHATS</b>(RTGS,HKICL 营运):HKD / USD / RMB / EUR;实时全额结算,在 HKMA 账簿结算即 <b>final & irrevocable</b>;另处理批量清算(股票、信用卡、支票、EPS、自动转账、ATM)。<b>日圆不被支持</b>(Ch4 review Q1)。</li><li><b>CMU</b>(债券)· <b>CLS</b>(外汇 payment-versus-payment)· <b>DvP</b>(证券)。</li></ul>\n<table><tr><th>项目</th><th>要点</th></tr>\n<tr><td>SVF</td><td>电子钱包、预付卡;HKMA 发牌监管;无牌经营非豁免 SVF = <b>刑事罪</b>。2026年5月底:<b>11</b> 间非银行 + <b>4</b> 间银行持牌人。2025 Q3:<b>8,340 万</b>账户;21 亿宗交易;总值 HK$2,689 亿(POS $452 亿、网上 $306 亿、P2P $165 亿);float HK$207 亿</td></tr>\n<tr><td>FPS 转数快</td><td><b>2018</b> 年推出;<b>HKICL</b> 营运;输入<b>手机号或电邮</b>跨银行/钱包付款;<b>24×7</b>;<b>HKD 与 RMB</b>;依《外汇基金条例》(Cap. 66)成立;所有持牌银行必须加入,SVF 持牌人可参与;支持 e-CNY 开户与增值</td></tr>\n<tr><td>Payment Connect</td><td><b>2025年6月22日</b>(HKMA + 人行,MOU)。连接内地 <b>IBPS</b> 与香港 <b>FPS</b>,24×7 即时小额跨境汇款</td></tr></table>\n<div class=\"card\"><b>金融普惠:</b>World Bank Findex 2025:全球 <b>13 亿</b>成年人无账户;贫富差距 11 个百分点;三大障碍:affordability、accessibility、资金不足;撒哈拉以南非洲 8,000 万无户者已有手机+ID+SIM;肯尼亚约 2/3 成年人用手机收付。</div>\n<h2>4.3 汇款 Remittance</h2>\n<ul><li>现行架构:央行、商业银行、零售银行经 RTGS 与 correspondent accounts——慢、多层、最长约一周。</li><li><b>SWIFT</b>:<b>1973</b> 年由 15 国 239 间银行成立(取代 telex),总部比利时,会员合作社;1977 年上线(518 机构、22 国);现连接 11,000+ 机构、200+ 国家;2025 年单日最高 6,800 万+ 条信息。<b>SWIFT 只是安全信息服务,不做清算/结算</b>(Ch4 review Q2 = C)。迈向 <b>ISO 20022</b>(2025年11月成为跨境支付全球标准;97%+ 流量);75% 付款 10 分钟内到达收款银行;计划加入区块链共享账本(30+ 机构);HKMA 与 Banque de France 做外汇实验。</li><li>新兴:Ripple(RTXP;Santander、UniCredit、UBS 试用)、Stellar、Bitspark(港菲比特币汇款,2020年3月停运)、WorldRemit。</li><li>香港 P2P/支付 App:PayMe、Jetco Pay、Octopus O! ePay、Alipay、WeChat Pay;eCheque——更便宜(有时免费)、更快。</li></ul>\n<h2>4.4 Chatbots</h2>\n<table><tr><th>主题</th><th>要点</th></tr>\n<tr><td>类型</td><td>Rule-based(关键字、流程、触发)vs ML/NLP-based(理解情绪与含义,会学习)。常见于 Messenger、WeChat、SMS;例:Clare.AI(港)、IBM Watson、Microsoft Bot Framework</td></tr>\n<tr><td>银行应用</td><td>RBS <b>Luvo</b>(Watson;复杂个案转人工);Wells Fargo Messenger bot;Bank of America <b>Erica</b>;Gartner:2020 年 85% 互动无需人手</td></tr>\n<tr><td>流程再造</td><td>改地址可通过聊天完成,不必到分行;需分行营运、信贷风险、客服、网银、IT 跨部门协调</td></tr>\n<tr><td>合规 7 方面</td><td>1 内部政策 · 2 网站条款/免责 · 3 受监管活动(建议须最新、升级机制)· 4 <b>数据收集</b>(PDPO、控制者/处理者协议)· 5 诽谤/辱骂/骚扰 · 6 侵犯第三方权利 · 7 监控与 <b>human-intervention trigger</b></td></tr>\n<tr><td>客户通知</td><td>HKMA(Complaints Watch 23):电邮主题要有区分度、到期前提醒、重要资料经 App push 发送</td></tr></table>\n<h2>4.5 Robo-advisory 智能投顾</h2>\n<ul><li>Robo-advisor 是<b>算法而非机器人</b>(\"allocator\"):输入目标、年龄、收入、风险承受力,分配资产,多为管理型 <b>ETF 组合</b>,并 rebalance。美国 D2C 龙头 Betterment(US$73 亿 AUM)、Wealthfront(US$51 亿);Bambu 是 B2B。</li><li>Robo vs 人类顾问:robo 功能基本、便宜;人类能在艰难市况安抚客户、促使行动、综合方案——<b>human touch</b> 是 robo 短期不会取代人类的原因(Mock Q23)。HSBC CEO(2025年3月):银行是 \"people-oriented businesses\"。</li><li><b>监管(4.5.4):</b>监管者是守门人,确保提供者有算法专长;ML 令决策难追溯,问责、适合性、合规更难。<b>SFC</b> 发出 suitability-obligation 指引(2016年12月23日),并就网上分销及顾问平台指引谘询(2017年5月8日)。<b>\"Profitability\" 不是</b> AI 投资决策的关键考虑(Ch4 review Q5)。</li><li><b>社交投资(4.5.5):</b>同侪影响投资决策;价值观配对的 SRI / ESG 产品;可持续表现尚无标准化评估。</li><li><b>算法交易(4.5.6):</b>自动模型交易与订单路由;<b>最终买卖决定与参数仍由人做</b>;HFT 是子集。</li><li>用例:AI 通话分析(ASR + NLP)在通话结束前提示 RM 补问缺失资料(3 个月 PoC;全量监控取代抽样)。</li></ul>\n<h2>4.6 Digital Branch 数码分行</h2>\n<table><tr><th>主题</th><th>要点</th></tr>\n<tr><td>东亚数码分行(2014年2月)</td><td><b>i-Counter</b>(日间人手柜台,夜间视像 i-Teller)· <b>i-Window</b>(触屏投资产品、电子签名、实时录音)· <b>i-Kit</b>(OCR + AirPrint)。15 分钟开户;30 分钟批按揭。渣打香港类似</td></tr>\n<tr><td>Bank Hapoalim(以色列)</td><td>Poalim Digital;平板、触屏墙、数码工作站;iBeacon 通知职员手表、视像投资顾问墙、Digital Desk、手机预约 ATM 取现</td></tr>\n<tr><td>职员角色</td><td>分行职员须懂数码渠道并自己使用;teller 转型为 <b>universal sales consultant</b>;投资顾问可即时取得资讯;premier 服务基准需提升;企业客户重视数码能力(API 聚合平台威胁利润)</td></tr>\n<tr><td>分行今日角色</td><td><b>Digital ambassador · Advisory hub · Problem solver</b>(\"7x24 service centre\" <b>不是</b>——Ch4 review Q10)</td></tr></table>\n<h2>4.7 数字货币、数字资产与 VASP</h2>\n<ul><li><b>为何出现数字货币:</b>更快更便宜的转账、全球汇款、本币不稳时的信任。Bitcoin:Satoshi Nakamoto(2009)、P2P、公共账本(blockchain)、mining、上限 2,100 万枚(最后一枚约 2140 年)。</li><li><b>香港立场:</b>HKMA 视比特币为虚拟商品而非法定货币。2017年4月 HKMA + HKICL + R3 + 银行研究央行数字货币。</li><li><b>CBDC 对央行的好处:</b>扩大货币政策选项 · 更安全的金融系统 · 促进支付竞争创新 · 重获铸币税 · 应对实体现金下降 · 另类金融对货币创造的影响 · 金融普惠。</li><li>无现金:八达通(1997)、Visa payWave / Mastercard PayPass、NFC Apple Pay / Android Pay。风险:洗钱、恐怖融资、逃税、欺诈。</li></ul>\n<table><tr><th>数字资产类型</th><th>例子</th></tr><tr><td>Cryptocurrencies</td><td>BTC、ETH、LTC</td></tr><tr><td>Stablecoins</td><td>USDT、USDC(挂钩法币)</td></tr><tr><td>CBDC</td><td>e-CNY、数字欧元</td></tr><tr><td>Tokenised assets</td><td>股票、债券、房地产上链</td></tr><tr><td>NFT</td><td>艺术、收藏品、知识产权</td></tr><tr><td>Utility tokens</td><td>BNB、UNI</td></tr><tr><td>Security tokens</td><td>代表所有权,受证券法规管</td></tr></table>\n<table><tr><th>地区</th><th>监管机构</th><th>法规</th></tr><tr><td>全球</td><td><b>FATF</b></td><td>AML/CTF、<b>Travel Rule</b></td></tr><tr><td>欧盟</td><td>ESMA</td><td><b>MiCA</b></td></tr><tr><td>美国</td><td><b>FinCEN</b></td><td>Bank Secrecy Act;须登记</td></tr><tr><td>香港</td><td><b>SFC</b></td><td>AMLO;自 <b>2023年6月1日</b>起 VATP 须持牌;Type 7 与 VATP 牌照</td></tr></table>\n<ul><li>香港另有政府虚拟资产政策声明与试点(NFT 发行、绿色债券代币化、e-HKD)。Mock Q33:AI RegTech 汇总客户数据须遵守 <b>PDPO</b>。</li><li><b>VASP 功能:</b>交易所 · 托管 · 支付与跨境汇款 · 代币发行(ICO/STO)· 借贷与收益 · 合规 RegTech(Chainalysis、Elliptic)。<b>挑战:</b>监管分歧、网络威胁、波动、银行与法币出入金。</li><li><b>托管:</b>self-custody(完全控制,丢私钥=永久损失)· third-party · institutional(受监管、有保险)。措施:multi-sig、HSM、threshold cryptography;<b>cold wallet</b>(离线安全)+ <b>hot wallet</b>(在线方便);端到端加密、入侵侦测、审计、zero-trust、生物识别、保险、DR。</li></ul>\n<h2>4.8 分布式账本 DLT</h2>\n<ul><li>DLT 让<b>互不完全信任</b>的各方对共享事实达成共识;传统分布式系统重在工作负载分配。DLT 最适合<b>多机构共享一致数据</b>(Mock Q19)。</li><li>Review Q7(错误说法):\"由中心化机构负责对账\"。</li><li><b>Smart contract</b>:合约条款写成代码,条件满足即自动转移所有权。</li><li>平台:<b>Ethereum</b>(2013年11月白皮书,Vitalik Buterin;ether;Solidity;DAO)· <b>Hyperledger</b>(Linux Foundation)· <b>Ripple</b>(RTXP、XRP,2012)· <b>R3 Corda</b>(2014;只在交易各方间达成共识,保护私隐)。</li><li>挑战:scalability 与 latency、主流理解不足、部分行业未准备好只靠数码记录、旧系统。Mock Q28 官方答案:<b>\"lack of accessibility\" 不被视为弱点</b>;Q36:\"开放、公众可访问的数据库\" 是<b>错误</b>说法;Q37:<b>NAFTA</b> 不在香港大数据监管范围内。</li></ul>\n<h2>4.9 Mobile First / Mobile Only</h2>\n<ul><li><b>Mobile First</b> = 先为手机设计再做桌面(WhatsApp);<b>Mobile Only</b> = (几乎)只经专用 App 提供。印度、印尼以手机为主要设备。</li><li>数据:手机银行用户五年翻倍至 43%(2015);最常见操作:查余额、转账、通知;英国分行到访 4.76 亿(2011)→ 2.78 亿(2016);Bank of America 2016 年削减数百分行;手机存支票是热门功能。</li><li><b>UX 警示案例</b>(Complaints Watch 27):App 未区分 ledger balance 与 available balance,导致支票存款骗案——余额必须清晰标示。</li><li><b>分析:</b>客户分群、画像、交易模式 → 实时个性化优惠(如 BankAmeriDeals)。</li><li><b>技术:</b><b>HTML5</b>(W3C,2014年10月;多媒体、跨设备)· <b>Push technology</b>(服务器发起 publish/subscribe,对比客户端 pull)· Open Banking API(欧洲 PSD2、CMA、GDPR;PFM 整合)· 移动设备。</li></ul>\n", "q": [{"q": "Which currency is NOT supported by CHATS?", "o": ["US Dollar", "Japanese Yen", "RMB", "Euro"], "a": 1, "e": ""}, {"q": "Which is FALSE about SWIFT?", "o": ["Links 11,000+ institutions", "Founded in 1973", "Clearing or settlement is performed by SWIFT", "Financial messaging for payment orders"], "a": 2, "e": ""}, {"q": "Essential compliance aspects for chatbots:", "o": ["Data collection", "Defamation and abuse", "Human-intervention triggers", "Third-party rights", "All of the above"], "a": 4, "e": ""}, {"q": "Which is NOT a well-known digital currency?", "o": ["Ripple", "Ethereum", "Bitcoin", "eCash"], "a": 3, "e": ""}, {"q": "Which is NOT a key consideration for AI-driven robo investment decisions?", "o": ["Accountability", "Profitability", "Investment suitability", "Compliance"], "a": 1, "e": ""}, {"q": "Which is NOT a role of branches today?", "o": ["Advisory hub", "7x24 service centre", "Problem solver", "Digital ambassador"], "a": 1, "e": ""}, {"q": "Mock Q44: 'Suitability Obligation Guideline' issuer:", "o": ["HKAB", "OGCIO", "HKMA", "SFC"], "a": 3, "e": ""}, {"q": "Mock Q23: why robo-advisors won't replace humans soon:", "o": ["High cost", "Human touch drives action", "Lack of diversity", "Language flexibility"], "a": 1, "e": ""}, {"q": "Mock Q19: DLT is most effective when banks need:", "o": ["Shared data consistency across institutions", "High-speed batch only", "Strong anonymisation", "Simpler reporting"], "a": 0, "e": ""}, {"q": "Mock Q28: which is NOT a DLT weakness?", "o": ["Lack of accessibility", "Lack of scalability", "Lack of latency", "Lack of readiness"], "a": 0, "e": "Official key: A."}, {"q": "Mock Q36: which statement about DLT is incorrect?", "o": ["Shared record across a network", "Records transactions across locations", "Spread across computers", "Open, publicly accessible database"], "a": 3, "e": ""}, {"q": "Mock Q37: beyond HK regulatory scope for big-data systems:", "o": ["PDPO", "AMLO", "US FATCA", "NAFTA"], "a": 3, "e": ""}, {"q": "Mock Q8: market development signalling need for scalable, fast architecture:", "o": ["Branch automation", "Growth of mobile/digital behaviour", "Decline in interbank payments", "Less IT outsourcing"], "a": 1, "e": ""}]}, {"t": "第5章 合规 Compliance", "h": "\n<h1>第5章 信息科技合规 · Compliance with Information Technology</h1>\n<div class=\"card\"><b>主线:</b>2008 年后监管与合规成本持续上升 → <b>RegTech</b> 用 AI/数据分析应对 → 主要场景是 <b>transaction surveillance (AML)</b> 与 <b>KYC/onboarding</b> → 国际机构 JFIU / FATF / APG 订立标准。本章短但几乎每个点都可考;Mock Section B Q3 就是 RegTech。</div>\n<h2>5.1 RegTech</h2>\n<ul><li><b>RegTech</b> = regulatory technology,是 FinTech 的<b>子集</b>;定义仍在<b>演变(evolving)</b>。</li><li>Accenture 2017:89% 高管预期合规成本上升;23% 机构预期合规开支逾净收入 5%。</li><li>HKMA 通讯 <b>Regtech Watch</b>;Regtech Knowledge Hub(2022年4月26日;后改名 Fintech Knowledge Hub)。</li></ul>\n<table><tr><th>日期</th><th>HKMA RegTech 动作</th></tr><tr><td>2019年11月1日</td><td><b>High-level Principles on AI</b>(12 个领域:治理、设计与开发、持续监控与维护)</td></tr><tr><td>2022年4月26日</td><td>Regtech Knowledge Hub</td></tr><tr><td>2024年2月7日</td><td>AMLS 项目(AML/CFT Surveillance Capability Enhancement),数据+Suptech 监管</td></tr><tr><td>2024年9月9日</td><td>通告:用 AI 监察可疑活动</td></tr></table>\n<ul><li><b>远程开户两阶段:</b>① 验证身份证件真伪 ② 确认持证人就是开户人。Mock 完整流程:拍 HKID → 认证 HKID → 自拍与 HKID 比对 → 填表 → 客户风险评估 → 开户。<b>Liveness check</b> 判断生物特征是否来自真人(防指纹模、3D 面具、预录视频)。</li><li><b>交易监控:</b>在规则式初筛上加 AI;监督式 ML 降低误报;data mining 找出可疑网络。<b>RPA</b> 加快手工 ML/TF 风险操作。<b>Suptech:</b>HKMA 用 STT + RPA + 分析,投诉处理快 8%、回应表现 100%。</li></ul>\n<table><tr><th>不采用 RegTech 的原因(Mock B-Q3a)</th><th>好处(B-Q3b)</th></tr><tr><td>预算/资源限制 · 方案对本地需求不成熟 · 缺乏人才 · 数据格式难数码化</td><td><b>对金融机构:</b>更好风险管理(少错误、快速分析、全企业视图、预测欺诈)、降低 KYC/CDD 成本、吸引留住客户。<b>对客户:</b>更快体验(OCR/AI)、普惠(另类数据)。<b>对监管者:</b>降低系统风险、更细更及时的报告、提高效率</td></tr></table>\n<h2>5.2 交易监察与 AML</h2>\n<p>Surveillance = 前线人员尽职调查(手工)+ 系统化审查历史交易。</p>\n<table><tr><th></th><th>Rule-based</th><th>AI / ML</th></tr><tr><td>原理</td><td>预设条件</td><td>自行学习复杂因素,发现新趋势</td></tr><tr><td>缺点</td><td>误报多;犯罪者适应,银行总在 \"追赶\"</td><td>仍在发展;取决于算法、算力、数据量;受私隐限制;有偏见风险</td></tr><tr><td>潜力</td><td>—</td><td>监控<b>每一宗</b>交易并预测是否可疑</td></tr></table>\n<div class=\"card\"><b>私隐之争:</b>一方认为私隐概念应演进以释放大数据/AI;另一方认为私隐比以前更重要。结论:<b>私隐概念会演进,但保护的必要性不变</b>。AI 由人设计,偏见可能被有意或无意植入。</div>\n<div class=\"must\"><b class=\"t\">AML 领域 RegTech 的推动力(Mock B-Q3d)</b>交易分散与欺诈复杂化 · 跨境多司法管辖区合规 · 跨渠道侦测 · 数据标准化集中分析 · 客户风险动态持续评估 · 新支付方式(钱包、虚拟货币)· 实时过滤与行为告警 · 社交媒体辅助身份/PEP 核查 · 制裁名单筛查软件 · 高速流处理 · 与过往犯罪模式比对。</div>\n<h2>5.3 KYC 与 onboarding</h2>\n<ul><li><b>Aggregation of identity:</b>RegTech 公司汇聚全球多来源数据,更全面了解客户。</li><li><b>Biometric authentication</b>(面部、声音、指纹、虹膜):不只用于登入,也用于<b>开户</b>,可比面对面更有效。</li></ul>\n<h2>5.4 国际机构(★★★)</h2>\n<table><tr><th>机构</th><th>成立</th><th>要点</th></tr>\n<tr><td><b>JFIU</b> 联合财富情报组</td><td>1989</td><td><b>香港警务处 + 海关</b>联合营运;持有 <b>STR (Suspicious Transaction Report)</b> 数据库;分析并转介,<b>自己不调查</b>;提供指引与研讨会。三者中<b>唯一在香港成立</b></td></tr>\n<tr><td><b>FATF</b></td><td>1989</td><td>政府间机构;<b>37 个成员辖区 + 2 个区域组织</b>(含中国、香港、美、英);订立国际标准</td></tr>\n<tr><td><b>APG</b> 亚太洗钱问题小组</td><td>1997</td><td>政府间机构;<b>41</b> 成员;FATF 式区域组织</td></tr></table>\n<div class=\"must\"><b class=\"t\">FATF 建议演变</b>最初 <b>40</b> 条 → 2001 起加 <b>9</b> 条反恐融资(2004 更新)→ <b>2012 整合为 40 条</b>。七大类:AML/CFT 政策与协调 · 洗钱与没收 · 恐怖融资与扩散融资 · 预防措施 · 法人透明度与实益拥有权 · 主管当局权力与制度措施 · 国际合作。VASP 适用 <b>Travel Rule</b>。</div>\n<div class=\"must\"><b class=\"t\">APG 五项职能</b>① Mutual evaluations ② Technical assistance & training ③ Typologies research ④ Global engagement ⑤ Private sector engagement。<b>不包括</b> on-site inspection,也<b>不包括</b> issuing codes of practice(Mock Q41 = B)。</div>\n", "q": [{"q": "Regulatory trend since 2008?", "o": ["Same amount", "More regulation", "Less regulation", "Compliance much easier"], "a": 1, "e": ""}, {"q": "RegTech's definition is:", "o": ["Static", "Evolving", "Well established", "Non-existent"], "a": 1, "e": ""}, {"q": "RegTech vs FinTech:", "o": ["Unrelated", "RegTech is a subset of FinTech", "FinTech is a subset of RegTech", "Same"], "a": 1, "e": ""}, {"q": "RegTech for AML:", "o": ["Manual identification", "Identify suspicious transactions with AI/ML", "Follow up suspicious transactions", "Auto-report to regulators"], "a": 1, "e": ""}, {"q": "Which body was established in Hong Kong?", "o": ["JFIU", "FATF", "APG", "None"], "a": 0, "e": ""}, {"q": "Biometric authentication can be used for:", "o": ["Surveillance monitoring", "Regulatory reporting", "On-boarding", "Data
