<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFNB Study Notes</title><style>
:root{--bg:#f6f7fb;--fg:#1f2430;--card:#fff;--ac:#2563eb;--bd:#e3e6ee;--hi:#fff4c2;--ok:#16a34a;--no:#dc2626;--mut:#667}

*{box-sizing:border-box}body{margin:0;font:15px/1.75 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--fg)}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--ac);width:0;z-index:20}
nav{position:fixed;top:0;left:0;bottom:0;width:250px;overflow:auto;padding:14px;background:var(--card);border-right:1px solid var(--bd);z-index:10}
nav h3{margin:4px 0 8px;font-size:16px}nav a{display:block;padding:7px 9px;border-radius:8px;color:var(--fg);text-decoration:none;cursor:pointer;font-size:14px}
nav a.on{background:var(--ac);color:#fff}nav button{width:100%;margin:4px 0;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
nav button.lang{background:var(--ac);color:#fff;font-weight:bold}
main{margin-left:250px;padding:26px 30px 80px;max-width:1000px}
h1{font-size:26px;margin:.2em 0}h2{font-size:20px;border-left:5px solid var(--ac);padding-left:10px;margin:1.6em 0 .5em}h3{font-size:16px;margin:1.2em 0 .3em;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:12px 0}
.must{background:var(--hi);border-left:5px solid #f59e0b;border-radius:8px;padding:10px 14px;margin:12px 0}
.trap{background:#fee2e2;border-left:5px solid var(--no);border-radius:8px;padding:10px 14px;margin:12px 0;color:#7f1d1d}
body.dark .trap{background:#4a1d1d;color:#fecaca}
.tip{background:#dcfce7;border-left:5px solid var(--ok);border-radius:8px;padding:10px 14px;margin:12px 0;color:#14532d}
body.dark .tip{background:#143d28;color:#bbf7d0}
b.t{display:block;margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;background:var(--card)}th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--ac);color:#fff}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.flow span{background:var(--card);border:2px solid var(--ac);border-radius:10px;padding:6px 10px;font-size:13px}.flow i{font-style:normal;color:var(--ac);font-weight:bold}
svg{max-width:100%;height:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0}
svg text{fill:#1f2430;font-size:13px}body.dark svg text{fill:#e6e9f2}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:14px}
.opt.ok{background:#bbf7d0;color:#064e3b;border-color:var(--ok)}.opt.no{background:#fecaca;color:#7f1d1d;border-color:var(--no)}
.ex{font-size:13px;color:var(--mut);margin-top:6px;display:none}.ex.show{display:block}
.kw{display:inline-block;background:var(--hi);padding:0 6px;border-radius:4px;font-weight:600}
.score{position:sticky;top:6px;float:right;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:13px}
@media(max-width:800px){nav{position:static;width:auto}main{margin:0;padding:14px}}

const DATA={"en": [{"t": "Overview", "h": "\n<h1>EFNB — Essential Fintech in Next-gen Banking: Complete Study Notes</h1>\n<div class=\"card\">HKIB Certified Banker CB(II). <b>Exam:</b> 3 hours · Section A = <b>50 MCQs</b> (equal marks, 50 total) · Section B = <b>any 2 of 3 essays</b>, 25 marks each. Covers the whole syllabus (6 chapters). Source: HKIB Study Guide (July 2026 version) and Mock Paper EXAM-G-065 (May 2026), which includes an <b>official answer key and suggested essay solutions</b>.</div>\n<h2>How to use these notes</h2>\n<ol><li>Read the \"Big picture\" box at the top of each chapter first.</li><li><span class=\"kw\">Yellow boxes</span> = must-know; <span style=\"background:#fee2e2;padding:0 6px;border-radius:4px\">red boxes</span> = exam traps (the \"which is NOT…\" questions); <span style=\"background:#dcfce7;padding:0 6px;border-radius:4px\">green boxes</span> = memory aids.</li><li>Each chapter ends with practice questions (click an option for instant marking). The <b>Mock Paper</b> tab has all 50 Section A questions with the official key and chapter references. <b>Section B</b> has the three mock essays with model answers.</li></ol>\n<h2>Knowledge map</h2>\n<svg viewBox=\"0 0 760 330\"><rect x=\"280\" y=\"10\" width=\"200\" height=\"40\" rx=\"10\" fill=\"#2563eb\"/><text x=\"320\" y=\"35\" style=\"fill:#fff\">EFNB — six chapters</text>\n<g font-size=\"12\"><rect x=\"10\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#bfdbfe\"/><text x=\"18\" y=\"112\">Ch1 Transformation</text><text x=\"18\" y=\"132\">Lab / Incubator / CVC</text><text x=\"18\" y=\"150\">Open API · BaaS</text><text x=\"18\" y=\"168\">Cloud · DeFi</text>\n<rect x=\"135\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#fecaca\"/><text x=\"143\" y=\"112\">Ch2 Security</text><text x=\"143\" y=\"132\">SPM · CIA · ISMS</text><text x=\"143\" y=\"150\">ISO 27001 · CFI</text><text x=\"143\" y=\"168\">PDPO 6 DPPs</text>\n<rect x=\"260\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#bbf7d0\"/><text x=\"268\" y=\"112\">Ch3 Data &amp; AI</text><text x=\"268\" y=\"132\">Supervised/Unsup.</text><text x=\"268\" y=\"150\">Fraud · AML · IADS</text><text x=\"268\" y=\"168\">AI ethics</text>\n<rect x=\"385\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#fde68a\"/><text x=\"393\" y=\"112\">Ch4 Channels</text><text x=\"393\" y=\"132\">FPS · SVF · SWIFT</text><text x=\"393\" y=\"150\">VASP · DLT</text><text x=\"393\" y=\"168\">Robo · Mobile</text>\n<rect x=\"510\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#e9d5ff\"/><text x=\"518\" y=\"112\">Ch5 Compliance</text><text x=\"518\" y=\"132\">RegTech · KYC</text><text x=\"518\" y=\"150\">JFIU · FATF</text><text x=\"518\" y=\"168\">APG</text>\n<rect x=\"635\" y=\"90\" width=\"115\" height=\"100\" rx=\"8\" fill=\"#fbcfe8\"/><text x=\"643\" y=\"112\">Ch6 Projects</text><text x=\"643\" y=\"132\">Agile · RAD</text><text x=\"643\" y=\"150\">EA · SOA · SLA</text><text x=\"643\" y=\"168\">Outsourcing</text></g>\n<g stroke=\"#667\"><line x1=\"380\" y1=\"50\" x2=\"67\" y2=\"90\"/><line x1=\"380\" y1=\"50\" x2=\"192\" y2=\"90\"/><line x1=\"380\" y1=\"50\" x2=\"317\" y2=\"90\"/><line x1=\"380\" y1=\"50\" x2=\"442\" y2=\"90\"/><line x1=\"380\" y1=\"50\" x2=\"567\" y2=\"90\"/><line x1=\"380\" y1=\"50\" x2=\"692\" y2=\"90\"/></g>\n<text x=\"20\" y=\"240\">Cross-chapter links:</text><text x=\"20\" y=\"262\">• AML: Ch3 (ML) ↔ Ch5 (RegTech/FATF) ↔ Ch2 (PDPO)</text><text x=\"20\" y=\"282\">• Outsourcing: Ch2 (SA-2) ↔ Ch6 (SLA/SPM OR-2) ↔ Ch1 (Cloud)</text><text x=\"20\" y=\"302\">• DLT/digital assets: Ch1 (DeFi, blockchain case) ↔ Ch4 (DLT/VASP) ↔ Ch2 (Stablecoins)</text></svg>\n<h2>Numbers and names to memorise</h2>\n<table><tr><th>Topic</th><th>Must-know</th></tr>\n<tr><td>Fintech 2025 / 2030</td><td>5 pillars / DART (Data · AI · Resilience · Tokenisation), Nov 2025</td></tr>\n<tr><td>Digital Bank</td><td>Renamed from Virtual Bank 25 Oct 2024; 8 licences (Feb 2025)</td></tr>\n<tr><td>Open API Framework</td><td>18 Jul 2018; four phases (info → applications → account info [IADS] → transactions)</td></tr>\n<tr><td>Cloud</td><td>Public / Private (most secure) / Hybrid (best balance)</td></tr>\n<tr><td>SPM modules</td><td>IC-1 · TM-G-1 · TM-G-2 · TM-E-1 · TM-E-2 · SA-2; OR-2 (31 May 2022)</td></tr>\n<tr><td>ISMS / ISO 27001</td><td>7 elements (no project management) · 2013: 114 controls / 14 sections / 35 objectives · 2022 edition · SoA</td></tr>\n<tr><td>CFI</td><td>May 2016; 2.0 effective 1 Jan 2021; C-RAF (inherent risk → maturity → iCAST) · PDP · CISP</td></tr>\n<tr><td>PDPO / GDPR</td><td>1995/1996, 6 DPPs / EU residents, 72 hours, 4% of global turnover</td></tr>\n<tr><td>Sandboxes</td><td>FSS Sep 2016 (388 trials by Mar 2026) · GenA.I. Sandbox 13 Aug 2024 · Stablecoins Ordinance 1 Aug 2025 (Cap. 656)</td></tr>\n<tr><td>Big data lifecycle</td><td>Acquire · Prepare · Aggregate · Analyse · Report · Act</td></tr>\n<tr><td>IADS</td><td>Announced 2023; pilot 1 Jan 2024; 28 banks; Showroom Day 23 Oct 2024; FSS 3.1 funding up to HK$500,000</td></tr>\n<tr><td>HKMA AI principles</td><td>1 Nov 2019, 12 domains (governance · design &amp; development · ongoing monitoring)</td></tr>\n<tr><td>Payments</td><td>CHATS (HKD/USD/RMB/EUR) · FPS 2018 · Payment Connect 22 Jun 2025 · PSSVFO 13 Nov 2015 (Cap. 584)</td></tr>\n<tr><td>SWIFT</td><td>1973, messaging only (no clearing/settlement), ISO 20022</td></tr>\n<tr><td>VASP</td><td>SFC VATP licensing from 1 Jun 2023; EU MiCA; US FinCEN/BSA; FATF Travel Rule</td></tr>\n<tr><td>JFIU / FATF / APG</td><td>1989 (HK Police + Customs) / 1989 (37+2 members, 40 recs) / 1997 (41 members, 5 functions)</td></tr>\n<tr><td>SDLC / Agile</td><td>Waterfall = spec first; Agile changes requirements at Feedback; Scrum sprint 1–2 weeks; RAD risk = scope creep</td></tr>\n<tr><td>Outsourcing</td><td>Accountability cannot be outsourced; SLA = benchmark not warranty; 4 risks (strategic, reputational, compliance, operational)</td></tr></table>\n<h2>Exam technique</h2>\n<ul><li><b>MCQ:</b> read all options; most \"which is NOT\" questions hinge on one planted wrong item (Trojan as Agile, Build and Use as SDLC, signature as biometric, Project management as ISMS).</li><li><b>Essays:</b> allocate time by marks (about 25 minutes of writing per essay when you have 3 hours total including 50 MCQs). Mark schemes award roughly one mark per distinct, explained point.</li></ul>\n<div class=\"card\"><b>Verification note:</b> Section A answers follow the <b>official key</b> printed in the Mock Paper. A few keyed answers feel counter-intuitive (e.g. Q7, Q28); learn them as given.</div>\n", "q": []}, {"t": "Ch1 Transformation", "h": "\n<h1>Chapter 1 · Information Systems & Technology Management</h1>\n<div class=\"card\"><b>Big picture:</b> Banks were built for a pre-internet world: costly, rigid, branch-heavy. FinTechs are agile and win the customer interface. The smartest bank response is to <span class=\"kw\">collaborate, not compete</span> — via Innovation Labs, Incubator Partnerships or Corporate VC — and to turn itself into a platform with Open APIs, BaaS and Cloud.</div>\n\n<h2>1.1 Transformation of the banking industry</h2>\n<h3>Why banks are vulnerable (7 constraints)</h3>\n<div class=\"flow\"><span>High operating cost</span><span>Functional gaps</span><span>Low system agility</span><span>Immature IT infrastructure</span><span>Expensive IT projects</span><span>Fragmented technology</span><span>Slow, costly core-system rebuilds</span></div>\n<div class=\"must\"><b class=\"t\">MUST KNOW: technology is an \"enabler\", not the \"driver\"</b>Customer expectations drive change; technology is \"the straw that broke the camel's back\".</div>\n<h3>Three ways banks work with FinTech (very high frequency)</h3>\n<svg viewBox=\"0 0 760 150\"><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"#2563eb\"/></marker></defs>\n<line x1=\"40\" y1=\"120\" x2=\"720\" y2=\"120\" stroke=\"#2563eb\" stroke-width=\"3\" marker-end=\"url(#a)\"/>\n<rect x=\"30\" y=\"20\" width=\"210\" height=\"70\" rx=\"10\" fill=\"#fde68a\" stroke=\"#f59e0b\"/><text x=\"45\" y=\"45\">1. Innovation Lab</text><text x=\"45\" y=\"65\">Most active; full control</text><text x=\"45\" y=\"82\">\"Fail fast\", in-house</text>\n<rect x=\"270\" y=\"20\" width=\"210\" height=\"70\" rx=\"10\" fill=\"#bfdbfe\" stroke=\"#2563eb\"/><text x=\"285\" y=\"45\">2. Incubator Partnership</text><text x=\"285\" y=\"65\">Moderate, most flexible</text><text x=\"285\" y=\"82\">Resources for technology</text>\n<rect x=\"510\" y=\"20\" width=\"220\" height=\"70\" rx=\"10\" fill=\"#bbf7d0\" stroke=\"#16a34a\"/><text x=\"525\" y=\"45\">3. Corporate VC</text><text x=\"525\" y=\"65\">Most conservative</text><text x=\"525\" y=\"82\">Equity stake, strategy-led</text>\n<text x=\"40\" y=\"145\">Active / high control</text><text x=\"600\" y=\"145\">Conservative / low control</text></svg>\n<table><tr><th>Approach</th><th>Key points</th><th>Examples to remember</th></tr>\n<tr><td>Innovation Lab</td><td>\"Digital playground / test kitchen\". Bring in FinTech specialists to prototype; <b>direct control and more relevant products</b>; \"intrapreneurs\" drive ideas</td><td>Standard Bank PlayRoom (20,000 sq ft); Capital One Labs (DC, NYC, SF; 100+ staff); Commonwealth Bank lab (10,000 sq ft, ~US$3m; Garages, Collaboration Hubs, Usability Labs); Visa Innovation Centre; DBS Innovation Lab (2016)</td></tr>\n<tr><td>Incubator Partnership</td><td>Bank gives money, space, industry insight, compliance know-how; start-ups bring technology. <b>The most flexible option</b></td><td>Accenture FinTech Innovation Lab (NY, 2010, 12-week programme); DBS Accelerator with Nest (HK, \"The Vault\", Wan Chai, 2015: 10 shortlisted of ~140 applicants)</td></tr>\n<tr><td>Corporate VC</td><td>Direct equity investment according to corporate strategy, not only financial gain</td><td>—</td></tr></table>\n<div class=\"must\"><b class=\"t\">Capital One Labs goals</b>Accelerate the digital agenda · institutionalise design thinking and lean start-up learning · research emerging technology and consumer trends · seed disruptive ideas · rapid prototyping and pilots · collaborate with the ecosystem (academics, VCs, entrepreneurs).<br><b>NOT a goal:</b> creating brand awareness on social media (Mock Q3); fostering closer relationships with Millennials (Mock Q43).</div>\n<div class=\"trap\"><b class=\"t\">Trap</b>\"Most direct control\" = Innovation Lab. \"Most flexible\" = Incubator Partnership.</div>\n<h3>Hong Kong policy timeline</h3>\n<table><tr><th>When</th><th>Event</th></tr>\n<tr><td>Sep 2017</td><td>HKMA announces <b>7 Smart Banking initiatives</b>: FPS full connectivity; FSS 1.0→2.0; digital banks; Banking Made Easy; Open API framework; cross-border fintech cooperation; research and talent</td></tr>\n<tr><td>8 Jun 2018</td><td>Revised Guideline on Authorization of Virtual Banks. On <b>25 Oct 2024</b> \"Virtual Bank\" renamed <b>Digital Bank</b>; 8 licences by end-Feb 2025</td></tr>\n<tr><td>18 Jul 2018</td><td><b>Open API Framework</b>: risk-based, <b>four phases</b></td></tr>\n<tr><td>2021</td><td><b>Fintech 2025</b> (5 pillars)</td></tr>\n<tr><td>13 Aug 2024</td><td><b>GenA.I. Sandbox</b> (HKMA + Cyberport)</td></tr>\n<tr><td>Nov 2025</td><td><b>Fintech 2030</b>, \"DART\", 40+ initiatives</td></tr></table>\n<table><tr><th>DART pillar</th><th>Content</th></tr>\n<tr><td><b>D</b>ata & Infrastructure</td><td>Commercial Data Interchange (CDI), next-gen data and payment infrastructure, cross-border payment links</td></tr>\n<tr><td><b>A</b>rtificial Intelligence</td><td>\"AI x Authorized Institutions\" (AI2) strategy, shared AI infrastructure, finance-specific models</td></tr>\n<tr><td><b>R</b>esilience & Security</td><td>Fintech cybersecurity certification, <b>quantum</b> resilience, post-quantum cryptography</td></tr>\n<tr><td><b>T</b>okenisation</td><td>Real-world asset tokenisation, tokenised government bonds, Project Ensemble</td></tr></table>\n<div class=\"tip\"><b class=\"t\">Memory aid</b>Fintech 2025's five pillars: all banks go fintech · CBDC-ready · next-gen data infrastructure · fintech-savvy workforce · ecosystem funding/policy. Fintech 2030 = <b>DART</b>.</div>\n<h3>New technologies in banking</h3>\n<table><tr><th>Technology</th><th>Example</th></tr>\n<tr><td>Biometrics</td><td>Authentication has moved from 2 to <b>3 factors</b>: know (password) / have (token) / are (biometric). Mastercard fingerprint card: print stored encrypted on the EMV chip, up to 2 prints</td></tr>\n<tr><td>Chatbot</td><td>CaixaBank imaginBank (2016, mobile-only) launched Spain's first bank chatbot in 2017; became \"imagin\" (imaginKids 0–11, imaginTeens 12–17, imagin 18+)</td></tr>\n<tr><td>Facial recognition</td><td>Alibaba/Ant \"Smile to Pay\"; Macau ATMs</td></tr>\n<tr><td>Robots</td><td>Bank of China (HK) \"RoBOC\" (Nao robot; Cantonese/English/Mandarin; 6,000+ enquiries); Tokyo-Mitsubishi UFJ first</td></tr>\n<tr><td>AR</td><td>Westpac NZ (2014) world's first AR banking app; ~90% of branch-type tasks online</td></tr>\n<tr><td>GenAI</td><td>Chatbots, credit-proposal generation, ML to prioritise screening alerts (fewer false positives), predictive AML/fraud monitoring</td></tr></table>\n<h3>Five areas of bank IS management</h3>\n<div class=\"flow\"><span>Application systems</span><span>IT talent</span><span>IT security</span><span>Computing services</span><span>Technology</span></div>\n<p>Application strategy: build in-house / buy packages / customise off-the-shelf / outsource / hybrid. The <b>CTO</b> role oversees strategy, design, deployment, control and operation of technology.</p>\n<div class=\"card\"><b>Numbers:</b> 44,480 HK deception cases in 2024; record 4,005 bank complaints in 2025; Banking (Amendment) Ordinance 2025 enables real-time bank-to-bank intelligence sharing (mule accounts); Accenture: 35% of North American bank share could move to digital players by 2020; 85% of consumers used digital wallets in 2024 (56% in 2022); US$32bn SME banking revenue could shift to embedded finance by 2025.</div>\n\n<h2>1.2 Open banking</h2>\n<div class=\"card\"><b>The maître d' analogy:</b> diners remember the maître d', not the chef. FinTech = maître d' (owns the relationship and brand equity); bank = chef (back-end). Core risk: banks relegated to a \"backend utility\".</div>\n<table><tr><th>Concept</th><th>Definition</th></tr>\n<tr><td><b>BaaS</b></td><td>Service providers digitally merged with an end-to-end process for a defined set of banking services over the Internet; regulation-driven APIs \"unbundle\" banks; plug-and-play partners (Stripe, PayPal)</td></tr>\n<tr><td><b>API</b></td><td>Lets developers use another software's resources; a <b>technical architecture</b>, not middleware or a gateway</td></tr>\n<tr><td><b>Private API banking</b></td><td>Back-end data/functions opened to <b>internal</b> developers only</td></tr>\n<tr><td><b>Open API banking</b></td><td>Specification published; <b>internal and external</b> developers can register; customer controls personal data; \"banking in a Lego way\"</td></tr></table>\n<h3>Three-tier banking business architecture (Chris Skinner)</h3>\n<svg viewBox=\"0 0 700 220\"><rect x=\"60\" y=\"10\" width=\"580\" height=\"55\" rx=\"8\" fill=\"#bbf7d0\" stroke=\"#16a34a\"/><text x=\"80\" y=\"35\">Tier 3 FRONTIER: ecosystem of FinTech start-ups and service providers</text><text x=\"80\" y=\"55\">Customer-facing innovation</text>\n<rect x=\"60\" y=\"80\" width=\"580\" height=\"55\" rx=\"8\" fill=\"#bfdbfe\" stroke=\"#2563eb\"/><text x=\"80\" y=\"105\">Tier 2 MIDDLEWARE: Banking-as-a-Service</text><text x=\"80\" y=\"125\">Hosts FinTechs and connects to bank back offices</text>\n<rect x=\"60\" y=\"150\" width=\"580\" height=\"55\" rx=\"8\" fill=\"#fde68a\" stroke=\"#f59e0b\"/><text x=\"80\" y=\"175\">Tier 1 FOUNDATION: traditional, licensed, regulated banks</text><text x=\"80\" y=\"195\">Licence, trust, settlement</text></svg>\n<h3>Cloud</h3>\n<table><tr><th>Model</th><th>Key points</th></tr><tr><td>Public</td><td>Open to the public, run by third-party vendors; may be used for card processing and cheque clearing in future</td></tr>\n<tr><td>Private</td><td>\"Internal cloud\", authorised users only, behind firewall, governed by corporate IT; <b>most secure</b></td></tr>\n<tr><td>Hybrid</td><td>Combination; <b>best balance of regulatory control and scalability</b> (Mock Q12)</td></tr></table>\n<div class=\"must\"><b class=\"t\">Cloud benefits</b>Lower CAPEX and operating cost; pay-per-use; fewer computing cycles; less infrastructure complexity; fewer design points; more manageable footprint; shorter development cycles; sharper capacity planning. <b>Before moving:</b> data confidentiality, security, regulatory compliance, service quality.</div>\n<h3>DeFi</h3>\n<p>Blockchain + smart contracts for lending, borrowing, trading without centralised institutions. Features: <span class=\"kw\">atomic settlement</span>, <span class=\"kw\">composability</span>, <span class=\"kw\">programmability</span>, <span class=\"kw\">permissionless access</span>. New services: liquid staking, flash loans, automated market makers. Main challenge: unclear regulation.</p>\n<h2>1.3 Six case studies</h2>\n<table><tr><th>Case</th><th>Who</th><th>Facts</th></tr>\n<tr><td>Blockchain</td><td>BOCHK + surveyors</td><td>Property valuation on DLT: shorter cycle, faster underwriting, fewer human errors, lower cost. (Real estate = 5% HK GDP, ownership 11%, housing 31.7% of CPI)</td></tr>\n<tr><td>Innovation Lab</td><td>DBS (2016)</td><td>Start-up mindset, fail fast; 5,000+ people expected on innovation projects; McKinsey 2014: European banks digitise only 20–40% of processes, spend &lt;1% on digital innovation</td></tr>\n<tr><td>Payments</td><td>Android Pay (Jun 2017)</td><td>Eight HK banks incl. DBS, Dah Sing, Hang Seng, CITIC, HSBC, SC, BEA; 5,000+ contactless locations; no card number stored on phone</td></tr>\n<tr><td>Credit tech</td><td>AMP Credit Technologies</td><td>SME loans <b>US$35k–250k</b>, approved in <b>2 working days</b>, no collateral, sized on monthly turnover, <b>90–360 days</b>, daily repayment from bank account. SMEs ≈ 80% of world economic activity</td></tr>\n<tr><td>Fundraising</td><td>Investible (May 2014)</td><td>Equity crowdfunding; helped 6 start-ups; US$4m revenue; 500,000+ users</td></tr>\n<tr><td>Remittance</td><td>WorldRemit (2010)</td><td>Fees up to 8%, days to settle. <b>5 steps</b>: country → mode → amount → recipient → send. Payout: bank deposit / cash pick-up / mobile money</td></tr></table>\n<div class=\"must\"><b class=\"t\">Common theme</b>All six were enabled by the <b>Internet and digital communications</b> (Ch1 review Q8).</div>\n", "q": [{"q": "Which way gives a bank the most direct control/steering of FinTech development?", "o": ["Innovation labs", "Incubator partnership", "Corporate venture capital", "Crowdfunding", "Licensing agreements"], "a": 0, "e": "In-house lab = direct control."}, {"q": "Which is NOT a key advantage of innovation labs?", "o": ["Projects developed internally", "Targeted products", "Innovation at low cost", "Direct control", "FinTech experts collaborate"], "a": 2, "e": "Labs are not necessarily low-cost (e.g. Commonwealth ~US$3m)."}, {"q": "Which is NOT a typical Millennial trait?", "o": ["Heavy mobile use", "Less face-to-face", "Real-time information", "More willing to pay for expert advice", "Better educated"], "a": 3, "e": ""}, {"q": "Which is NOT a PwC 'Web 2.0 communication gap'?", "o": ["No modern segment strategy", "Lack of latest browser standard", "No targeted products", "Reliance on branches", "No interactive channels"], "a": 1, "e": ""}, {"q": "Digital technologies transform IT services and talent in banking in:", "o": ["Product design", "Risk management", "Development methodology", "'Fail fast' mentality", "All of the above"], "a": 4, "e": ""}, {"q": "Key risk to banks from 'Open Up Banking'?", "o": ["Relegated to back end", "APIs give agile rivals access", "FinTech gains face-time and brand", "High cost vs selective FinTech", "All of the above"], "a": 4, "e": ""}, {"q": "Advantage of cloud architecture?", "o": ["Leverage physical branches", "Lower capex and operating cost", "Less regulatory burden", "Leapfrog FinTech", "Higher information security"], "a": 1, "e": ""}, {"q": "Common theme across the six transformation examples?", "o": ["All raise revenue", "All open untouched markets", "All enabled by the Internet and digital communications", "All well-tested", "None"], "a": 2, "e": ""}]}, {"t": "Ch2 Security & Privacy", "h": "\n<h1>Chapter 2 · Cyber Security & Data Privacy</h1>\n<div class=\"card\"><b>Big picture:</b> There is no absolute security — you only make intrusion harder. Use layered defence, an ISMS, regulatory frameworks (SPM, CFI), technology (SOC/SIEM/MFA/encryption) and privacy law (PDPO's six DPPs). People are the weakest link.</div>\n<h2>2.1 HKMA regulation of technology management</h2>\n<div class=\"card\"><b>HKMA</b> (est. 1993; Exchange Fund Ordinance + Banking Ordinance) is the de facto central bank/regulator of <b>Authorised Institutions (AIs)</b>: licensed banks, restricted licence banks, deposit-taking companies. The <b>Supervisory Policy Manual (SPM)</b> sets minimum standards; TM-G and TM-E are the IT-related modules.</div>\n<table><tr><th>Module</th><th>What to remember</th></tr>\n<tr><td><b>IC-1</b> Risk management framework</td><td>Published 2003, updated 2017. Foundation of internal control; <b>new-product policies must cover technology issues</b> and consult IT where necessary</td></tr>\n<tr><td><b>TM-G-1</b> General principles of technology risk management</td><td>Published 2003; key foundation for IT governance. Covers IT control policies, <b>three lines of defence</b> (1st: IT functions incl. segregation of duties, e.g. the programmer who changes code must not deploy to production; steering committee. 2nd: technology risk management = impact × likelihood. 3rd: technology audit), continuous training. <b>Five key IT functions:</b> security management · system development & change management · information processing · communication networks · management of technology service providers. Senior-management approval of a non-compliance does NOT mitigate the risk — it only means it is understood and accepted</td></tr>\n<tr><td><b>TM-G-2</b> Business continuity planning (BCP)</td><td>Popularised by Y2K. BCP is wider than IT disaster recovery: <b>business impact analysis → recovery strategy → BCP procedures</b>; must be <b>updated and tested regularly</b>. SPM OR-2 (31 May 2022) operational resilience has four components: operational risk management; BCP and testing; third-party dependency management; ICT incl. cyber security. ISO/IEC 22301 = BCM standard</td></tr>\n<tr><td><b>TM-E-1</b> E-banking risk management</td><td>First 2004; 2015 revamp consolidated circulars and extended to phone banking, mobile, self-service terminals, social media channels, contactless payments. Introduces <b>operational, reputation and legal risk</b>, Board involvement, three lines of defence, <b>independent assessment</b> and <b>penetration testing</b> (finds vulnerabilities; need not exploit them). Oct 2019 update: remote account opening authentication; <b>2FA</b> (two of knowledge/possession/inherence) for high-risk transactions (third-party transfers, bill payments to unregistered high-risk merchants, changes of customer interests); notify customers of unauthorised/high-risk (e.g. large card-not-present) transactions; hunt fake sites/apps and report to police; risk-based <b>source-code review</b>; press releases for incidents; segregate network from social platforms; keep records for instant-messaging banking; lower-value transactions may skip 2FA</td></tr>\n<tr><td><b>TM-E-2</b> Internet deposit advertising</td><td>Based on s.92 Banking Ordinance (AIs cannot advertise deposits to the public, subject to exceptions). Not technical: covers push notifications, search-engine visibility, overseas-hosted sites</td></tr>\n<tr><td><b>SA-2</b> Outsourcing</td><td><b>Activities can be outsourced; accountability stays with the AI.</b> Concerns: accountability, risk assessment, provider ability, agreement, customer data confidentiality, control, contingency planning, access to data, overseas outsourcing. A subsidiary using HQ's systems is also outsourcing</td></tr>\n<tr><td>SVF & RPS</td><td>PSSVFO; SVF licensing started 2016 (before that only Octopus). Operating a multi-purpose SVF unlicensed is a <b>criminal offence</b>. RPS = system for transfer/clearing/settlement of retail payment obligations; regulated if disruption would hurt monetary/financial stability. SVF guidelines 2016, RPS oversight 2020</td></tr>\n<tr><td>HKAB NFC best practice</td><td>Common standards for NFC mobile payment security; HKMA considers them in supervision</td></tr></table>\n<h3>HKMA sandboxes & stablecoins</h3>\n<table><tr><th>Item</th><th>Facts</th></tr>\n<tr><td><b>FSS</b></td><td>Launched Sep 2016; 2.0 (2017), 3.0 (2021), 3.1 (2024); 388 trials by end-Mar 2026. Pilot with a limited customer group <b>without full supervisory compliance</b>. FSS 2.0 principles: <b>Boundary · Customer protection · Risk-management controls · Readiness & monitoring</b>. FSS 3.1: funding via Cyberport; projects must support CBDC/CDI/IADS/RegTech/risk management and have a sponsor; IADS projects up to HK$500,000</td></tr>\n<tr><td><b>GenA.I. Sandbox</b></td><td>13 Aug 2024 (banking); expanded Mar 2026 with SFC, IA, MPFA. Focus: <b>risk management, anti-fraud, customer experience</b>; \"A.I. vs A.I.\"; Cyberport supplies GPU. First cohort: 15 use cases, 10 banks (e.g. BOCHK AI avatar; Citi AML/KYC summarisation; Dah Sing STR generation; Standard Chartered mortgage memo: 1 day → 5 minutes)</td></tr>\n<tr><td><b>Stablecoins Ordinance</b> (Cap. 656)</td><td>In force 1 Aug 2025; HKMA licence needed to issue specified stablecoins. Guideline (Aug 2025): technology risk framework; annual third-party audits incl. smart-contract verification; <b>private-key lifecycle</b> controls (HSM, <b>air-gapped</b> generation for significant keys, multi-sig keys stored separately, MFA, logging); customer 2FA and <b>pre-registered</b> wallet addresses; incident plans (freeze/burn coins); DR with annual tests. AML guideline: blockchain analytics, <b>Travel Rule</b>, wallet screening, secondary-market monitoring, record keeping</td></tr></table>\n<h2>2.2 Cyber threats</h2>\n<table><tr><th>Threat</th><th>Definition</th></tr>\n<tr><td>Malware</td><td>Umbrella term for malicious code (virus, worm, Trojan)</td></tr>\n<tr><td>Virus / worm</td><td>Replicates; worms spread rapidly across a network</td></tr>\n<tr><td>DoS / DDoS</td><td>Overwhelm a system with requests; DDoS uses many computers (<b>botnet</b>)</td></tr>\n<tr><td>Phishing</td><td>Bait email masquerading as a trusted party, link asks for passwords; often with email spoofing</td></tr>\n<tr><td>Man-in-the-middle</td><td>Attacker intercepts and alters messages between two parties (e.g. altered fund-transfer instruction)</td></tr>\n<tr><td>Ransomware</td><td>Encrypts the system and demands ransom (often bitcoin)</td></tr>\n<tr><td>Botnet</td><td>\"Robot network\" of zombie computers controlled by central malware</td></tr>\n<tr><td>APT</td><td>Highly organised, sophisticated, persistent monitoring of a target</td></tr>\n<tr><td>Social engineering</td><td>Attack on <b>humans</b> (posing as IT support or senior management to get passwords)</td></tr>\n<tr><td>Cloud (NIST)</td><td>On-demand access to a shared pool of resources; IaaS / PaaS / SaaS. Security management is mostly like outsourcing</td></tr></table>\n<h2>2.3 Cyber security concepts</h2>\n<svg viewBox=\"0 0 520 220\"><polygon points=\"260,20 70,190 450,190\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"3\"/><text x=\"195\" y=\"14\">Confidentiality</text><text x=\"20\" y=\"210\">Integrity</text><text x=\"400\" y=\"210\">Availability</text><text x=\"205\" y=\"130\">Non-repudiation</text></svg>\n<ul><li><b>Confidentiality</b> — need-to-know access. <b>Integrity</b> — no unauthorised change. <b>Availability</b> — undisrupted access. <b>Non-repudiation</b> — sender cannot deny (asymmetric encryption).</li><li>Information security = all forms of information; cyber security = digital information in networked environments.</li></ul>\n<div class=\"must\"><b class=\"t\">Weakest-link principle</b>Attackers use the weakest point (ten locks on the front door, side door open). Hence layered defence, regular vulnerability assessment, and security awareness.</div>\n<h3>ISMS — 7 key elements (ISACA)</h3>\n<div class=\"flow\"><span>1 Senior-management leadership, commitment & support</span><span>2 Policies & procedures</span><span>3 Organisation</span><span>4 Security awareness & education</span><span>5 Risk management</span><span>6 Monitoring & compliance</span><span>7 Incident handling & response</span></div>\n<div class=\"trap\"><b class=\"t\">Trap</b>\"Project management\" is NOT an ISMS element (Mock Q34). Management support turns security spend from an expense into a worthwhile <b>investment</b> (Mock Q13).</div>\n<ul><li>Organisation needs a CISO and Chief Data Privacy Officer; risk = impact × likelihood; monitoring is a <b>detective</b> control (IT Risk/Audit); outsource technical monitoring to a <b>SOC</b>. Few reported incidents may mean poor detection.</li><li>Lines of defence: 1st IT security ops/delivery · 2nd IT risk · 3rd <b>IT audit</b>.</li></ul>\n<h3>ISO/IEC 27001</h3>\n<table><tr><th>Item</th><th>Facts</th></tr><tr><td>Standard</td><td>Main ISMS standard; ISO 27002 gives implementation guidance; from BS7799 → ISO 17799; latest edition <b>2022</b></td></tr>\n<tr><td>2013 structure</td><td>Context → Leadership → Planning → Support → Operation → Performance evaluation → Improvement (maps to PDCA: Plan = Leadership+Planning+Support; Do = Operation; Check = Performance evaluation; Act = Improvement)</td></tr>\n<tr><td>2013 controls</td><td><b>114</b> controls · <b>14</b> sections · <b>35</b> control objectives</td></tr>\n<tr><td>Certification (3 steps)</td><td>Diagnostic review incl. <b>Statement of Applicability (SoA)</b> → independent audit by lead auditors → follow-up/surveillance audits</td></tr>\n<tr><td>Related</td><td>ISO 27018 (PII in public cloud: 14 security categories + 11 privacy principles); ISO 29100 (privacy framework)</td></tr></table>\n<h2>2.4 Cyber security regimes</h2>\n<p><b>ECF</b> (Enhanced Competency Framework): voluntary but encouraged benchmark; cyber version <b>ECF-C</b> with Core and Professional levels, organised by three lines of defence.</p>\n<h3>CFI — Cybersecurity Fortification Initiative (3 pillars)</h3>\n<svg viewBox=\"0 0 700 120\"><rect x=\"20\" y=\"15\" width=\"200\" height=\"90\" rx=\"10\" fill=\"#bfdbfe\"/><text x=\"40\" y=\"45\" font-weight=\"bold\">C-RAF</text><text x=\"40\" y=\"68\">Cyber Resilience</text><text x=\"40\" y=\"88\">Assessment Framework</text>\n<rect x=\"250\" y=\"15\" width=\"200\" height=\"90\" rx=\"10\" fill=\"#bbf7d0\"/><text x=\"270\" y=\"45\" font-weight=\"bold\">PDP</text><text x=\"270\" y=\"68\">Professional</text><text x=\"270\" y=\"88\">Development Programme</text>\n<rect x=\"480\" y=\"15\" width=\"200\" height=\"90\" rx=\"10\" fill=\"#fde68a\"/><text x=\"500\" y=\"45\" font-weight=\"bold\">CISP</text><text x=\"500\" y=\"68\">Cyber Intelligence</text><text x=\"500\" y=\"88\">Sharing Platform</text></svg>\n<table><tr><th>Item</th><th>Facts</th></tr>\n<tr><td>CFI</td><td>Launched May 2016; <b>CFI 2.0</b> announced 3 Nov 2020, effective 1 Jan 2021. Similar: US FFIEC tool; Bank of England <b>CBEST</b></td></tr>\n<tr><td>C-RAF</td><td>(1) <b>Inherent risk assessment</b> (low/medium/high) → (2) <b>Maturity assessment</b> (gap vs inherent risk) → (3) <b>iCAST</b> intelligence-led attack simulation (required for medium/high inherent risk or intermediate/advanced target maturity)</td></tr>\n<tr><td>PDP</td><td>Local certification/training for cyber professionals by HKIB + ASTRI</td></tr>\n<tr><td>CISP</td><td>Built by HKAB + ASTRI; fully launched Apr 2018; 2019 HKMA: low usage (unclear what/when to share, talent shortage)</td></tr></table>\n<h2>2.5 Technologies</h2>\n<table><tr><th>Technology</th><th>Meaning / use</th></tr>\n<tr><td>SOC</td><td>Centralised security unit; may be outsourced</td></tr><tr><td>TIP</td><td>Aggregates, correlates and analyses threat data in real time; programmable</td></tr>\n<tr><td>SIEM</td><td>SIM + SEM; real-time analysis of security alerts</td></tr><tr><td>DLP</td><td>Protects data in use (endpoint), in motion (network), at rest</td></tr>\n<tr><td>Endpoint security / MDM</td><td>Each remote device is an entry point; MDM manages mobile devices — <b>addresses staff checking company email from home</b> (Mock Q1)</td></tr>\n<tr><td>NGFW</td><td>Third-gen firewall = firewall + application firewall with <b>deep packet inspection</b> + <b>IPS</b></td></tr>\n<tr><td>MFA</td><td>≥2 of knowledge / possession / inherence</td></tr>\n<tr><td>Biometrics</td><td>Face, fingerprint, iris, voice — <b>signature is not</b> a biometric input (Mock Q20)</td></tr>\n<tr><td>Penetration test</td><td>Purpose: <b>identify technical vulnerabilities</b> (Mock Q22)</td></tr></table>\n<table><tr><th></th><th>Symmetric</th><th>Asymmetric</th></tr><tr><td>Keys</td><td>One shared key</td><td>Key pair (public + private)</td></tr><tr><td>Examples</td><td>DES (weak) → Triple DES → <b>AES</b> (128–256 bit)</td><td>Public-key cryptography</td></tr>\n<tr><td>Weakness</td><td>Key distribution</td><td>Slower</td></tr>\n<tr><td>Use</td><td>Bulk encryption</td><td>Encrypt with <b>private</b> key → proves sender (non-repudiation). Encrypt with <b>public</b> key → only key owner can read (confidentiality)</td></tr></table>\n<h2>2.6 Data privacy</h2>\n<div class=\"card\"><b>PDPO</b> enacted 1995, in force 1996; <b>PCPD</b> created 1996; 2011 amendment (mostly effective 2012) regulates sale and direct-marketing use of data; 2014 PCPD banking guidance. <b>Breaching a DPP is not automatically a crime</b>: PCPD issues an enforcement notice; contravening it is the offence.</div>\n<p><b>Personal data</b>: (1) relates to a living, identifiable person; (2) exists in a reasonably accessible form. Banks call it the <b>CIF</b>. A <b>PICS</b> states purpose, transferees, whether supply is obligatory/optional, and access/correction rights.</p>\n<table><tr><th>DPP</th><th>Name</th><th>Core</th></tr>\n<tr><td>1</td><td><b>Data Collection</b></td><td>Lawful, fair; purpose related to function; tell subject the purpose and <b>classes of persons to whom data may be transferred</b>; necessary but not excessive</td></tr>\n<tr><td>2</td><td><b>Accuracy & Retention</b></td><td>Accurate; not kept longer than necessary</td></tr>\n<tr><td>3</td><td><b>Data Use</b></td><td>Original or directly related purpose unless voluntary explicit consent</td></tr>\n<tr><td>4</td><td><b>Data Security</b></td><td>Protect against unauthorised/accidental access, processing, erasure, loss, use</td></tr>\n<tr><td>5</td><td><b>Openness</b></td><td>Publish policies and practices, types of data held</td></tr>\n<tr><td>6</td><td><b>Data Access & Correction</b></td><td>Subject may access and correct their data</td></tr></table>\n<div class=\"tip\"><b class=\"t\">Memory</b>Collect → Accurate → Use → Secure → Open → Access. Least relevant to cloud computing (Mock Q9, official key A) = the Data Collection Principle.</div>\n<table><tr><th>Framework</th><th>Key points</th></tr>\n<tr><td>GDPR</td><td>Any organisation controlling/processing data of <b>EU residents</b>; <b>72-hour</b> breach reporting; fines up to <b>4% of global annual revenue</b>; in force May 2018</td></tr>\n<tr><td>OECD (2013)</td><td>Collection limitation, data quality, purpose specification, use limitation, security safeguards, openness, individual participation, accountability</td></tr>\n<tr><td>APEC (2005/2016)</td><td>Preventing harm, notice, collection limitation, use, choice, integrity, security safeguards, access & correction, accountability</td></tr>\n<tr><td>BS 10012</td><td>Personal information management system (2009; revised 2017 for GDPR)</td></tr>\n<tr><td>ISO/IEC 29100</td><td>2011; 11 privacy principles incl. consent and choice, data minimisation, openness, accountability, security</td></tr>\n<tr><td>Privacy by Design</td><td>7 principles: proactive not reactive · privacy as default · embedded in design · full functionality (positive-sum) · end-to-end lifecycle security · visibility/transparency · respect for user privacy</td></tr></table>\n<p><b>PCPD guidance relevant to essays:</b> biometric data (keep templates not raw images, purge when no longer needed, free and informed consent, periodic independent audits) and cloud computing (contractual assurances, sub-contractors, transborder flow, clear PICS notice).</p>\n", "q": [{"q": "Which is generally the third line of defence in cyber security?", "o": ["IT function", "IT risk", "IT audit", "None"], "a": 2, "e": ""}, {"q": "Which is part of HKMA's CFI?", "o": ["C-RAF", "PDP", "CISP", "All of the above"], "a": 3, "e": ""}, {"q": "What is DDoS?", "o": ["Programs disrupting a target system (many sources)", "Email posing as a trusted party", "An encryption mechanism", "On-demand shared resource pool"], "a": 0, "e": ""}, {"q": "GDPR targets companies controlling personal data of:", "o": ["Hong Kong residents", "US residents", "EU residents", "ASEAN residents"], "a": 2, "e": ""}, {"q": "Which technology supports non-repudiation?", "o": ["Biometrics", "Asymmetric key encryption", "Ransomware", "Firewalls"], "a": 1, "e": ""}, {"q": "Technique to obtain sensitive information through human users:", "o": ["Botnets", "APT", "Social engineering", "Cloud computing"], "a": 2, "e": ""}, {"q": "Which standard addresses information security?", "o": ["ISO/IEC 22301", "ISO/IEC 27001", "ISO/IEC 29100", "ISO/IEC 20000"], "a": 1, "e": ""}, {"q": "Official key: which DPP deals with to whom personal data may be transferred? (Mock Q48)", "o": ["Data Access & Correction", "Data Collection", "Data Use", "Openness"], "a": 1, "e": "Official key: B."}]}, {"t": "Ch3 Data & AI", "h": "\n<h1>Chapter 3 · Data, Analytics & AI</h1>\n<div class=\"card\"><b>Big picture:</b> Big data (structured + unstructured) → machine learning (supervised / unsupervised) → applied to credit, fraud and AML → constrained by four AI-ethics issues (bias, explainability, privacy, accountability) → fuelled by IADS data sharing.</div>\n<h2>3.1 Big data analytics</h2>\n<div class=\"must\"><b class=\"t\">Lifecycle (6 steps)</b><div class=\"flow\"><span>Acquire</span><i>→</i><span>Prepare</span><i>→</i><span>Aggregate</span><i>→</i><span>Analyse</span><i>→</i><span>Report</span><i>→</i><span>Act</span></div></div>\n<ul><li><b>Velocity</b> = speed of collection/processing; <b>Variety</b> = range of formats. Do not mix them up.</li><li>Big data = semi-structured + unstructured mixes that relational databases cannot handle; traditional analytics = statistical models, big data = machine learning.</li><li>Interactive visualisation: comprehension aid · relationship identifier · trend identifier · storytelling medium.</li><li><b>Data warehouse</b> (late 1980s): <b>highly structured</b> data for reporting (Mock Q26 = B). <b>Data lake</b> keeps data \"as is\".</li><li>Mock Q7 (official key = B): \"data security policies\" is the item marked as NOT covered by the Big Data governance framework. Learn the key as given, even though it feels counter-intuitive.</li></ul>\n<h3>Use by banking segment</h3>\n<table><tr><th>Segment</th><th>Applications</th></tr>\n<tr><td>Retail</td><td>Customer insight, cross-sell, retention</td></tr>\n<tr><td>Commercial</td><td>AML/KYC/CDD/EDD (UBO, PEP lists); credit decisions in 5 minutes; underwriting with thousands of data points; targeted digital marketing; branch-location analytics</td></tr>\n<tr><td>Investment / treasury</td><td>Goldman Sachs \"tech company\" (9,000 engineers); IBM Watson at DBS; Kensho; DBS 800+ AI models, 350 use cases, SGD 780m value (2024)</td></tr></table>\n<div class=\"must\"><b class=\"t\">Three weaknesses of AML programmes</b>(1) manual data collection and risk scoring (~50% of AML cost is headcount); (2) complex holding structures and forged documents; (3) transaction monitoring — rule systems get learned (US$100k caught, 20 × US$5k not) so massive <b>false positives</b>.</div>\n<h2>3.2 Machine learning</h2>\n<div class=\"card\">Arthur Samuel (1959): computers learn <b>without being explicitly programmed</b>.</div>\n<svg viewBox=\"0 0 760 250\"><rect x=\"280\" y=\"5\" width=\"200\" height=\"34\" rx=\"8\" fill=\"#2563eb\"/><text x=\"330\" y=\"27\" style=\"fill:#fff\">Machine Learning</text>\n<rect x=\"60\" y=\"70\" width=\"260\" height=\"34\" rx=\"8\" fill=\"#bbf7d0\" stroke=\"#16a34a\"/><text x=\"75\" y=\"92\">Supervised (labelled data)</text>\n<rect x=\"440\" y=\"70\" width=\"260\" height=\"34\" rx=\"8\" fill=\"#fde68a\" stroke=\"#f59e0b\"/><text x=\"455\" y=\"92\">Unsupervised (no labels)</text>\n<line x1=\"380\" y1=\"39\" x2=\"190\" y2=\"70\" stroke=\"#2563eb\"/><line x1=\"380\" y1=\"39\" x2=\"570\" y2=\"70\" stroke=\"#2563eb\"/>\n<rect x=\"20\" y=\"140\" width=\"160\" height=\"50\" rx=\"8\" fill=\"#e0f2fe\" stroke=\"#2563eb\"/><text x=\"30\" y=\"160\">Regression</text><text x=\"30\" y=\"178\">continuous (GDP)</text>\n<rect x=\"200\" y=\"140\" width=\"170\" height=\"50\" rx=\"8\" fill=\"#e0f2fe\" stroke=\"#2563eb\"/><text x=\"210\" y=\"160\">Classification</text><text x=\"210\" y=\"178\">discrete label (spam)</text>\n<rect x=\"450\" y=\"140\" width=\"250\" height=\"50\" rx=\"8\" fill=\"#ffedd5\" stroke=\"#f59e0b\"/><text x=\"460\" y=\"160\">Clustering (K-means)</text><text x=\"460\" y=\"178\">groups / outliers, no labels</text>\n<line x1=\"190\" y1=\"104\" x2=\"100\" y2=\"140\" stroke=\"#16a34a\"/><line x1=\"190\" y1=\"104\" x2=\"285\" y2=\"140\" stroke=\"#16a34a\"/><line x1=\"570\" y1=\"104\" x2=\"575\" y2=\"140\" stroke=\"#f59e0b\"/>\n<text x=\"20\" y=\"225\">Classifiers: Decision Tree · K-Nearest Neighbour (majority vote) · Naive Bayes (independent features)</text></svg>\n<table><tr><th></th><th>Supervised</th><th>Unsupervised</th></tr><tr><td>Data</td><td>Labelled</td><td>Unlabelled</td></tr><tr><td>Tasks</td><td>Regression, classification</td><td>Clustering, association</td></tr><tr><td>Bank example</td><td>Credit-card fraud (clear fraud/non-fraud labels); default probability</td><td><b>AML</b> (no confirmed labels); \"customers who bought this also bought\"</td></tr></table>\n<div class=\"trap\"><b class=\"t\">High-frequency</b>Exploring data for fraud without knowing which cases are fraud → <b>Clustering</b> (Mock Q24 = B). Detecting suspicious activity without labelled fraud data → <b>Unsupervised learning</b> (Q30 = C).</div>\n<ul><li><b>Parametric</b> = fixed number of parameters; <b>non-parametric</b> = complexity grows with data.</li><li><b>Overfitting</b> = model fits noise, predicts badly.</li><li><b>K-means</b>: pick K centroids → repeat (assign points to nearest centroid; move centroid to cluster mean) until no change.</li><li><b>Data mining</b> extracts patterns from structured databases; its properties: actionable information, prediction, automatic pattern discovery — <b>not</b> \"evaluating the probability of every outcome\" (Mock Q10 = D). <b>Information extraction</b> works on unstructured text.</li><li><b>Deep learning</b>: multi-layer neural networks (input, hidden, output layers). DeepFace 97.25% vs humans 97.53%; DeepMind cut Google data-centre cooling energy by <b>40%</b>.</li></ul>\n<ul><li><b>Cross-sell</b> = related products; <b>up-sell</b> = higher-end version. Retention +5% → profit +25% to 95%; <b>silent attrition</b> = slowly shrinking usage.</li><li>HKMA used Speech-to-Text + RPA (+ analytics) for complaints: 8% faster handling (Complaints Watch Issue 23).</li></ul>\n<h2>3.3 AI applications</h2>\n<table><tr><th>Direction</th><th>Examples</th></tr><tr><td>Internal (staff-facing)</td><td>Summarisation, knowledge management, report generation, code/idea generation, error detection, standardised output</td></tr>\n<tr><td>External (client-facing)</td><td>Robo-advice and recommendation engines, chatbots (BofA \"Erica\", Kasisto), customer acquisition (SEO, collateral), monetisation (research analysis, needs identification), maintenance (complaint analysis, reporting)</td></tr></table>\n<ul><li>Post-2008 data: US <b>CCAR</b> (2,000+ variables), <b>Basel 239</b> (risk data aggregation for G-SIBs), IFRS 9, Solvency II.</li><li>Structured supervisory data → conventional ML; high-frequency messy data → <b>deep learning</b>. Regulators want simple, verifiable models → interpretable <b>CART</b> trees acceptable; neural nets are \"black boxes\".</li></ul>\n<table><tr><th></th><th>Card fraud</th><th>AML</th></tr><tr><td>Labels</td><td>Clear</td><td>None (money laundering is hard to define; law enforcement gives no feedback)</td></tr><tr><td>Method</td><td>Supervised classifiers; FICO Falcon (neural network)</td><td>Clustering/unsupervised + SAR outcomes as proxy labels</td></tr><tr><td>Issue</td><td>False positives</td><td>Rule systems create many false positives; ML must be explainable to compliance</td></tr></table>\n<div class=\"must\"><b class=\"t\">Why add ML to rule-based AML? (Mock Q29 = C)</b>ML <b>adapts to evolving fraud patterns</b>. It reduces — it does not eliminate — false positives; regulators do not mandate AI-only.</div>\n<ul><li>Trader conduct surveillance (rogue trading, benchmark rigging, insider trading) links trades with emails, calendars, building access, calls (NLP); behavioural-science base model + ML for explainability.</li><li>Algorithmic / high-frequency trading: 70%+ of trading automated. Underwriting is a \"perfect job\" for ML.</li><li>AI weaknesses in surveillance: depends on algorithm sophistication, needs massive data, data integration hindered by privacy — <b>labour-union objection is NOT one</b> (Mock Q25 = D).</li></ul>\n<p><b>Alternative credit scoring</b> targets people without credit history (expats, freelancers, graduates, unbanked). Data: device, behaviour on page, web presence, location, phone number/carrier. Firms: Emric (350 data points), Lenddo, Friendly Score (820 variables), First Access. Critics: opaque, legally untested, may discriminate; data brokers (more varied data than credit agencies).</p>\n<h2>3.4 Credit investigation</h2>\n<ul><li><b>Credit Data Smart (CDS)</b> launched 2024 by HKAB, DTCA and LMLA with HKMA support: avoid single point of failure, better governance and consumer protection, competition among credit reference agencies.</li><li><b>SME credit</b>: alternative lenders use big data beyond FICO; challenges — opaque, untested, legal/discrimination risk (US Fair Credit Reporting Act).</li><li><b>Capital markets</b>: ratings (S&amp;P, Moody's, Fitch) are slow (reviewed ~every 6 months after reporting), costly, conflicted (issuer-paid), may face political pressure. <b>Credit spread</b> = yield difference between bonds of similar maturity but different credit quality (e.g. 8% corporate vs 6% Treasury = 200bp); timely but hard to observe for illiquid products. ML: Thomson Reuters AI reads 350,000 articles a day.</li></ul>\n<h2>3.5 IADS — Interbank Account Data Sharing</h2>\n<div class=\"card\">HKMA initiative letting retail/SME/corporate customers share account data with other participating banks <b>with consent</b>. Announced 2023; pilot began <b>1 Jan 2024</b>; <b>28</b> participating banks. Part of the global Open Banking/Open Finance/Open Data movement.</div>\n<table><tr><th>Topic</th><th>Facts</th></tr>\n<tr><td>Players</td><td>HKMA (regulator) · participating banks (mandated <b>data providers</b>; data consumers encouraged) · customers (need deposit accounts at both banks) · HKSTP (runs the <b>IADS Developer Platform</b>) · FinTech/tech providers (e.g. Jetco, Planto) — only banks can be providers/consumers</td></tr>\n<tr><td>Core principles</td><td>Data ownership · transparency · security · interoperability · innovation · customer-centricity</td></tr>\n<tr><td>History</td><td>Part of the Open API initiative under the Sep 2017 Smart Banking plan; pressure from EU <b>PSD2</b>. <b>Open API Framework (18 Jul 2018)</b>: four phases — I product/service information (Jan 2019) · II applications (Oct 2019) · III account information (IADS lives here) · IV transactions/payments. HKAB Phase III standards 14 Dec 2021 (technical, UX, authentication, data, security [OAuth 2.0, OpenID Connect, 2FA], operations)</td></tr>\n<tr><td>Data covered</td><td>Corporate/SME/retail deposit account info: account availability, status, balances and transactions, account details</td></tr>\n<tr><td>Consent flow</td><td>Customer starts at consuming bank, picks banks/accounts and duration (3/6/12 months) → redirected to providing bank → logs in and confirms → repeat per bank → can view/revoke any time. No per-call charge</td></tr>\n<tr><td>Showroom Day</td><td>23 Oct 2024. Three main use cases: <b>consolidated financial analysis</b>, <b>streamlined loan applications</b>, <b>online identity verification (KYC)</b></td></tr>\n<tr><td>Lending</td><td>Faster applications; wider inclusion via cash-flow data; dynamic risk monitoring; real-time verification reduces fraud. ZA Bank: no proof-of-income uploads, approvals in as little as 3 minutes. SCB: SME loans over HK$50m, as fast as one day; HASE HK$60m</td></tr>\n<tr><td>Financial management</td><td><b>PFM</b> (consumers) and <b>BFM</b> (SMEs, \"digital CFO\"). 64% of HK consumers would consider switching bank over poor digital experience (McKinsey); 36% of HK SMEs considered switching (EY)</td></tr>\n<tr><td>KYC</td><td>Reuse another bank's completed CDD. Dah Sing was the only bank using IADS for SME KYC (Oct 2024). Comparators: Singapore <b>MyInfo</b>, EU PSD2 + eIDAS</td></tr>\n<tr><td>Global</td><td><b>Open Banking</b> = consented sharing of banking data (sometimes payments). <b>Open Finance</b> = also pensions, brokers, insurance</td></tr>\n<tr><td>AI impact</td><td>AI rests on 4 pillars: training data, training methods, model architecture, computational power. Data is the bottleneck (2019 HKMA survey: 52% cited insufficient data). Fragmentation: HK consumers keep ~3 bank accounts. IADS enables better models and feedback loops. GenAI ~80% internal use; Agentic AI nascent</td></tr>\n<tr><td>Future</td><td>More banks, broader data (cards, loans, investments), deeper use cases (PFM/BFM into RM dashboards), other entities (insurers, MPF), FSS 3.1 funding up to HK$500,000</td></tr></table>\n<h2>3.6 AI ethics & regulation — four pillars</h2>\n<table><tr><th>Pillar</th><th>Issue</th><th>Response</th></tr>\n<tr><td><b>Fairness & bias</b></td><td>Historical data bias → discrimination (race, gender, location)</td><td>Bias testing; EU AI Act; MAS guidance</td></tr>\n<tr><td><b>Transparency & explainability</b></td><td>Black-box models cannot justify a mortgage rejection</td><td><b>SHAP</b>, <b>LIME</b>; human-in-the-loop; GDPR right to explanation</td></tr>\n<tr><td><b>Privacy & security</b></td><td>Personal data in training</td><td>Differential privacy, federated learning, homomorphic encryption, Privacy by Design</td></tr>\n<tr><td><b>Accountability & governance</b></td><td>Who is responsible: bank, vendor or data provider?</td><td>Board oversight, AI risk committees, AI ethics policy; HKMA <b>High-level Principles on AI</b> (1 Nov 2019; 12 domains)</td></tr></table>\n<div class=\"trap\"><b class=\"t\">Trap</b>The main regulatory concern with complex AI is <b>lack of transparency and explainability</b> (Mock Q31 = B).</div>\n", "q": [{"q": "Why was alternative credit scoring introduced?", "o": ["Few people have bank accounts in some developing countries", "Unbanked lack credit history", "Non-traditional data reduces bad loans", "Behavioural/social data is available", "All of the above"], "a": 4, "e": ""}, {"q": "What is fundamentally different about new lenders using alternative scoring?", "o": ["Seemingly irrelevant data to predict behaviour", "Neural nets to maximise interest", "No branches", "Always more accurate", "All of the above"], "a": 0, "e": ""}, {"q": "Which data might Lenddo-type companies use?", "o": ["Phone brand", "Suburb", "Mobile network provider", "Purchase / 'Like' history", "All of the above"], "a": 4, "e": ""}, {"q": "How does a data broker differ from a credit reference agency?", "o": ["Doesn't keep credit history", "Agencies don't aggregate sources", "Brokers collect far more varieties of data", "Brokers earn from lending", "None"], "a": 2, "e": ""}, {"q": "Shortcomings of credit ratings:", "o": ["Lag", "Expensive", "Issuer-paid", "Political pressure", "All of the above"], "a": 4, "e": ""}, {"q": "Main shortcoming of market credit spreads:", "o": ["Too volatile", "Less accurate than ratings", "Hard to interpret", "Hard to observe for illiquid products", "Easy to forge"], "a": 3, "e": ""}, {"q": "Mock Q24: exploratory fraud detection without knowing what is fraudulent:", "o": ["Regression", "Clustering", "Naive Bayes", "Probabilistic"], "a": 1, "e": ""}, {"q": "Mock Q30: suspicious activity without labelled fraud data:", "o": ["Regression", "Supervised learning", "Unsupervised learning", "Descriptive analytics"], "a": 2, "e": ""}, {"q": "Mock Q29: why supplement rule-based AML with ML?", "o": ["Rules prohibited", "ML eliminates false positives", "ML adapts to evolving patterns", "Regulators mandate AI-only"], "a": 2, "e": ""}, {"q": "Mock Q10: NOT a property of data mining analytics:", "o": ["Actionable information", "Predicting likely outcome", "Automatic pattern discovery", "Probability of every outcome"], "a": 3, "e": ""}, {"q": "Mock Q26: a characteristic of a data warehouse:", "o": ["All data loaded, none turned away", "Highly structured", "Stored 'as is'", "Encrypted"], "a": 1, "e": ""}]}, {"t": "Ch4 Digital Channels", "h": "\n<h1>Chapter 4 · FinTech for Digital Banking & Service Channels</h1>\n<div class=\"card\"><b>Big picture:</b> Payments → remittance → chatbots → robo-advice → digital branches → digital currency/assets/VASPs → DLT → mobile first. Heaviest exam value: payment infrastructure (FPS/SVF), digital-asset regulation, DLT, and the new role of branches.</div>\n<h2>4.1 Fintech Promotion Roadmap</h2>\n<p>Objectives: promote innovation (AI, DLT) · financial inclusion · collaboration · regulatory support. Initiatives: Fintech Knowledge Hub · regulatory sandboxes (FSS, GenA.I.) · Open API Framework · <b>FPS</b>.</p>\n<h2>4.2 Payments</h2>\n<svg viewBox=\"0 0 700 170\"><rect x=\"20\" y=\"10\" width=\"660\" height=\"40\" rx=\"8\" fill=\"#fde68a\"/><text x=\"40\" y=\"35\">HKMA oversight · CSSO (Nov 2004) → renamed PSSVFO (Cap. 584) on 13 Nov 2015</text>\n<rect x=\"20\" y=\"70\" width=\"210\" height=\"80\" rx=\"8\" fill=\"#bfdbfe\"/><text x=\"35\" y=\"95\">CHATS (RTGS), by HKICL</text><text x=\"35\" y=\"115\">HKD / USD / RMB / EUR</text><text x=\"35\" y=\"135\">Real-time gross; final & irrevocable</text>\n<rect x=\"250\" y=\"70\" width=\"200\" height=\"80\" rx=\"8\" fill=\"#bbf7d0\"/><text x=\"265\" y=\"95\">CMU: debt securities</text><text x=\"265\" y=\"115\">CLS: FX payment-vs-payment</text><text x=\"265\" y=\"135\">DvP for securities</text>\n<rect x=\"470\" y=\"70\" width=\"210\" height=\"80\" rx=\"8\" fill=\"#fbcfe8\"/><text x=\"485\" y=\"95\">HKICL also runs</text><text x=\"485\" y=\"115\">FPS + Payment Connect</text><text x=\"485\" y=\"135\">(Exchange Fund Ord., Cap. 66)</text></svg>\n<ul><li>CHATS also clears bulk items: stock trades, credit cards, cheques, EPS, auto-credit/debit, ATM transfers. <b>Yen is NOT supported</b> (Ch4 review Q1).</li><li>Non-bank payment providers (telcos, ISPs) blur payment-instrument boundaries; NFC phone apps on top of cards.</li></ul>\n<table><tr><th>Item</th><th>Facts</th></tr>\n<tr><td>SVF</td><td>E-wallets and prepaid cards; HKMA licenses/supervises; unlicensed operation of non-exempt SVF = <b>criminal offence</b>. End-May 2026: <b>11</b> non-bank + <b>4</b> bank licensees. Q3 2025: <b>83.4m</b> accounts; 2.1bn transactions; value HK$268.9bn (POS $45.2bn, online $30.6bn, P2P $16.5bn); float HK$20.7bn</td></tr>\n<tr><td>FPS</td><td>Introduced <b>2018</b>; run by <b>HKICL</b>; cross-bank/e-wallet payments by <b>mobile number or email</b>; <b>24×7</b>; <b>HKD and RMB</b>; all licensed banks must join, SVF licensees may; supports e-CNY wallet set-up and top-up</td></tr>\n<tr><td>Payment Connect</td><td>Launched <b>22 Jun 2025</b> (HKMA + PBoC; MOU). Links mainland <b>IBPS</b> (China National Clearing Center) with HK's <b>FPS</b>; instant small-value cross-boundary remittances 24×7 by mobile or account number</td></tr></table>\n<div class=\"card\"><b>Financial inclusion:</b> World Bank Findex 2025 — <b>1.3bn</b> adults lack an account; poorer adults 11 pp less likely to hold one; top barriers: affordability, accessibility, insufficient funds; 80m unbanked in sub-Saharan Africa already own phone + ID + SIM. Kenya: ~2/3 of adults use mobile payments. ATMs, IVR, mobile and online banking cut cost per customer served.</div>\n<h2>4.3 Remittance</h2>\n<ul><li>Current architecture: central bank, commercial and retail banks interacting through RTGS and correspondent accounts — slow, multi-layered, up to a week.</li><li><b>SWIFT</b>: founded <b>1973</b> by 239 banks in 15 countries (replacing telex), Belgium-based cooperative, went live 1977 (518 institutions, 22 countries); now 11,000+ institutions in 200+ countries; record 68m+ messages/day (2025). <b>SWIFT is secure messaging only — it does NOT clear or settle</b> (orders settle via correspondent accounts; Ch4 review Q2 = C). Moving to <b>ISO 20022</b> (global cross-border standard Nov 2025; 97%+ of traffic); 75% of payments reach the beneficiary bank within 10 minutes; plan for a blockchain-based shared ledger with 30+ institutions; HKMA and Banque de France in FX experiments.</li><li>Emerging: Ripple (RTXP; Santander, UniCredit, UBS trials), Stellar, Bitspark (HK–Philippines bitcoin remittance; stopped Mar 2020), WorldRemit.</li><li>HK P2P/payment apps: PayMe, Jetco Pay P2P, Octopus O! ePay, Alipay, WeChat Pay; eCheque. Cheaper (sometimes free), faster, app-based.</li></ul>\n<h2>4.4 Chatbots</h2>\n<table><tr><th>Topic</th><th>Facts</th></tr>\n<tr><td>Types</td><td>Rule-based (keywords, flows, triggers) vs ML/NLP-based (understand sentiment and meaning; learn). Delivered over Messenger, WeChat, SMS etc.; examples: Clare.AI (HK), IBM Watson, Microsoft Bot Framework</td></tr>\n<tr><td>Banking use</td><td>RBS <b>Luvo</b> (IBM Watson; hands complex cases to advisers); Wells Fargo Messenger bot; Bank of America <b>Erica</b>; Gartner: 85% of interactions without humans by 2020</td></tr>\n<tr><td>Process re-engineering</td><td>Change of address via chat instead of branch visit; needs cross-department alignment (branch ops, credit risk, service, internet banking, IT)</td></tr>\n<tr><td>Compliance (7 areas)</td><td>1 internal policies · 2 website T&amp;Cs/disclaimers · 3 regulated activities (keep advice current, escalation) · 4 <b>data collection</b> (PDPO, controller/processor agreements) · 5 defamation/abuse/harassment · 6 third-party rights infringement · 7 monitoring and <b>human-intervention trigger</b></td></tr>\n<tr><td>Customer notifications</td><td>HKMA (Complaints Watch 23): distinct email subject lines, reminders before deadlines, critical info via app push notifications</td></tr></table>\n<h2>4.5 Robo-advisory</h2>\n<ul><li>Robo-advisors are <b>algorithms, not robots</b> (\"allocators\"): take goals, age, income, risk tolerance and allocate across asset classes, usually managed <b>ETF portfolios</b>; then rebalance. US D2C leaders Betterment (US$7.3bn AUM) and Wealthfront (US$5.1bn); Bambu = B2B.</li><li>Robo vs human: robo is basic, cheap; humans reassure clients in difficult markets, persuade action and synthesise solutions — <b>human touch</b> is why robo will not replace humans soon. HSBC CEO (Mar 2025): banks are \"people-oriented businesses\". Best model = unified human + robo experience.</li><li><b>Regulation (4.5.4):</b> regulators act as gatekeepers on algorithm expertise and technology risk; accountability, suitability and compliance get harder as ML makes decisions untraceable. <b>SFC</b> issued suitability-obligation guidance (23 Dec 2016) and consulted on online distribution and advisory platforms (8 May 2017). <b>\"Profitability\" is NOT a key consideration</b> (Ch4 review Q5).</li><li><b>Social investing (4.5.5):</b> peer influence on investment decisions; values-matched, socially responsible investment (SRI) and ESG offerings; sustainability performance not yet standardised.</li><li><b>Algorithm trading (4.5.6):</b> automated model-based trading and order routing; <b>humans still make final decisions and set the parameters</b>; HFT is a subset.</li><li>Use case: AI call analytics with ASR + NLP flags missing client information for RMs before the call ends (3-month PoC; 100% call monitoring instead of samples).</li></ul>\n<h2>4.6 Digital branch</h2>\n<table><tr><th>Topic</th><th>Facts</th></tr>\n<tr><td>BEA digital branch (Feb 2014)</td><td><b>i-Counter</b> (manned by day, i-Teller by video after hours) · <b>i-Window</b> (touch screen for investment products, e-signature, audio recording) · <b>i-Kit</b> (OCR + AirPrint). Account in 15 min; mortgage approval in 30 min. Standard Chartered HK similar</td></tr>\n<tr><td>Bank Hapoalim (Israel)</td><td>Poalim Digital; tablets, touchscreen walls, digital workstations; Bluetooth/iBeacon alerts staff watches, video advisory wall, Digital Desk, smartphone-ordered ATM cash</td></tr>\n<tr><td>Staff roles</td><td>Branch officers must teach digital channels and use them themselves; tellers retrained as <b>universal sales consultants</b>; investment advisors get real-time information; premier service benchmarks need enhancing; commercial customers rate digital capability highly (API-based aggregators threaten profitability)</td></tr>\n<tr><td>Branch roles today</td><td><b>Digital ambassador · advisory hub · problem solver</b> (Ch4 review Q10: \"7x24 service centre\" is NOT a role)</td></tr></table>\n<h2>4.7 Digital currency, digital assets, VASPs</h2>\n<ul><li><b>Why digital currency:</b> faster/cheaper transfers, global remittances, trust where local currency is unstable. Bitcoin: Satoshi Nakamoto (2009), peer-to-peer, public ledger (blockchain), mining, 21 million cap (last coin ~2140).</li><li><b>HK stance:</b> HKMA treats bitcoin as a virtual commodity, not legal tender. April 2017: HKMA + HKICL + R3 + banks explored a central-bank digital currency (DvP, interbank payments).</li><li><b>CBDC benefits for central banks:</b> wider monetary-policy options · safer financial system · competition and innovation in payments · recapture seigniorage · address decline of physical cash · alternative-finance implications for money creation · financial inclusion.</li><li>Cashless: Octopus (1997), Visa payWave / Mastercard PayPass, NFC Apple Pay / Android Pay.</li><li>Risks: money laundering, terrorist financing, tax evasion, fraud; most digital currencies sit outside the conventional system.</li></ul>\n<table><tr><th>Digital-asset type</th><th>Examples</th></tr><tr><td>Cryptocurrencies</td><td>BTC, ETH, LTC</td></tr><tr><td>Stablecoins</td><td>USDT, USDC (pegged)</td></tr><tr><td>CBDC</td><td>e-CNY, digital euro</td></tr><tr><td>Tokenised assets</td><td>Stocks, bonds, real estate on chain</td></tr><tr><td>NFTs</td><td>Art, collectibles, IP</td></tr><tr><td>Utility tokens</td><td>BNB, UNI</td></tr><tr><td>Security tokens</td><td>Ownership claims, regulated as securities</td></tr></table>\n<table><tr><th>Region</th><th>Regulator</th><th>Regime</th></tr><tr><td>Global</td><td><b>FATF</b></td><td>AML/CTF, <b>Travel Rule</b></td></tr><tr><td>EU</td><td>ESMA</td><td><b>MiCA</b></td></tr><tr><td>US</td><td><b>FinCEN</b></td><td>Bank Secrecy Act; registration</td></tr><tr><td>Hong Kong</td><td><b>SFC</b></td><td>AMLO; VATP licensing from <b>1 Jun 2023</b>; Type 7 (dealing) and VATP (automated trading) licences</td></tr></table>\n<ul><li>HK also: government virtual-asset policy statement, pilots (NFT issuance, green bond tokenisation, e-HKD). Mock Q33: AI-based RegTech aggregating customer data must observe the <b>PDPO</b>.</li><li><b>VASP roles:</b> exchange/trading · custody · payments and cross-border remittance · token issuance (ICO/STO/tokenisation) · lending and yield (BlockFi, Aave, Compound…) · compliance/RegTech (Chainalysis, Elliptic). <b>Challenges:</b> regulatory divergence · cyber threats · volatility · banking and fiat on-ramp access.</li><li><b>Custody:</b> self-custody (full control, key loss = irreversible) · third-party · institutional (regulated, insured). Controls: multi-sig, HSM, threshold cryptography; <b>cold</b> (offline, safe) + <b>hot</b> (online, convenient) wallets; end-to-end encryption, intrusion detection, audits, zero-trust, biometrics, insurance, DR plans. Institutional drivers: diversification, clearer regulation, custody solutions (Fidelity Digital Assets, Coinbase Institutional, Anchorage), RWA tokenisation, cross-border payments, smart-contract settlement.</li></ul>\n<h2>4.8 Distributed ledger technology</h2>\n<svg viewBox=\"0 0 700 170\"><text x=\"30\" y=\"20\" font-weight=\"bold\">Central ledger</text><circle cx=\"120\" cy=\"90\" r=\"22\" fill=\"#fde68a\"/><text x=\"100\" y=\"94\">Central</text>\n<circle cx=\"40\" cy=\"50\" r=\"10\" fill=\"#bfdbfe\"/><circle cx=\"40\" cy=\"130\" r=\"10\" fill=\"#bfdbfe\"/><circle cx=\"200\" cy=\"50\" r=\"10\" fill=\"#bfdbfe\"/><circle cx=\"200\" cy=\"130\" r=\"10\" fill=\"#bfdbfe\"/>\n<line x1=\"48\" y1=\"56\" x2=\"100\" y2=\"80\" stroke=\"#667\"/><line x1=\"48\" y1=\"124\" x2=\"100\" y2=\"100\" stroke=\"#667\"/><line x1=\"192\" y1=\"56\" x2=\"140\" y2=\"80\" stroke=\"#667\"/><line x1=\"192\" y1=\"124\" x2=\"140\" y2=\"100\" stroke=\"#667\"/>\n<text x=\"400\" y=\"20\" font-weight=\"bold\">DLT: every node holds a copy; consensus</text>\n<circle cx=\"440\" cy=\"60\" r=\"14\" fill=\"#bbf7d0\"/><circle cx=\"560\" cy=\"60\" r=\"14\" fill=\"#bbf7d0\"/><circle cx=\"440\" cy=\"130\" r=\"14\" fill=\"#bbf7d0\"/><circle cx=\"560\" cy=\"130\" r=\"14\" fill=\"#bbf7d0\"/><circle cx=\"620\" cy=\"95\" r=\"14\" fill=\"#bbf7d0\"/>\n<line x1=\"454\" y1=\"60\" x2=\"546\" y2=\"60\" stroke=\"#16a34a\"/><line x1=\"440\" y1=\"74\" x2=\"440\" y2=\"116\" stroke=\"#16a34a\"/><line x1=\"560\" y1=\"74\" x2=\"560\" y2=\"116\" stroke=\"#16a34a\"/><line x1=\"454\" y1=\"130\" x2=\"546\" y2=\"130\" stroke=\"#16a34a\"/><line x1=\"454\" y1=\"68\" x2=\"546\" y2=\"122\" stroke=\"#16a34a\"/><line x1=\"546\" y1=\"68\" x2=\"454\" y2=\"122\" stroke=\"#16a34a\"/><line x1=\"574\" y1=\"60\" x2=\"610\" y2=\"88\" stroke=\"#16a34a\"/><line x1=\"574\" y1=\"130\" x2=\"610\" y2=\"102\" stroke=\"#16a34a\"/></svg>\n<ul><li>DLT lets parties who <b>do not fully trust each other</b> reach consensus on shared facts; conventional distributed systems focus on workload distribution. DLT beats traditional databases when <b>multiple institutions need shared, consistent data</b> (Mock Q19).</li><li>Review Q7 (FALSE statement): \"a centralised organisation is responsible for reconciliation\".</li><li><b>Smart contracts</b>: terms in code; ownership transfers automatically.</li><li>Platforms: <b>Ethereum</b> (white paper Nov 2013, Vitalik Buterin; ether; Solidity; DAOs) · <b>Hyperledger</b> (Linux Foundation) · <b>Ripple</b> (RTXP, XRP, 2012) · <b>R3 Corda</b> (2014; consensus between transaction parties only, protects privacy).</li><li>Challenges: scalability and latency, lack of mainstream understanding, some sectors not ready to rely on digital-only records, legacy systems. Mock Q28 official key: <b>\"lack of accessibility\" is NOT considered a weakness</b>. Mock Q36: \"an open, publicly accessible database\" is the <b>incorrect</b> statement.</li><li>Mock Q37: US FATCA and AMLO are relevant to HK big-data systems; <b>NAFTA is not</b>.</li></ul>\n<h2>4.9 Mobile first / mobile only</h2>\n<ul><li><b>Mobile First</b> = design for mobile before desktop (WhatsApp). <b>Mobile Only</b> = delivered (almost) exclusively via dedicated apps. In India and Indonesia mobile is the primary device.</li><li>Facts: mobile-banking users doubled in five years to 43% (2015); most common actions: check balance, transfer, notifications; branch visits in UK fell 476m (2011) → 278m (2016); Bank of America cut hundreds of branches (2016); mobile cheque deposit is a top feature.</li><li><b>UX cautionary case</b> (Complaints Watch 27): an app that did not distinguish ledger balance from available balance helped a cheque-deposit scam — label balances unambiguously.</li><li><b>Analytics:</b> segmentation, profiling, transaction patterns → real-time, customised offers (e.g. BankAmeriDeals).</li><li><b>Technologies:</b> <b>HTML5</b> (W3C, Oct 2014; rich multimedia, cross-device); <b>push technology</b> (server-initiated publish/subscribe vs client-initiated pull); Open Banking API (PSD2, CMA, GDPR in Europe; PFM integration); mobile devices.</li><li>Key considerations for strategy: analytics · user experience · demographics · banking behaviour (Ch4 review Q8 = all).</li></ul>\n", "q": [{"q": "Which currency is NOT supported by CHATS?", "o": ["US Dollar", "Japanese Yen", "RMB", "Euro"], "a": 1, "e": ""}, {"q": "Which is FALSE about SWIFT?", "o": ["Links 11,000+ institutions", "Founded in 1973", "Clearing or settlement is performed by SWIFT", "Financial messaging for payment orders"], "a": 2, "e": ""}, {"q": "Essential compliance aspects for chatbots:", "o": ["Data collection", "Defamation and abuse", "Human-intervention triggers", "Third-party rights", "All of the above"], "a": 4, "e": ""}, {"q": "Which is NOT a well-known digital currency?", "o": ["Ripple", "Ethereum", "Bitcoin", "eCash"], "a": 3, "e": ""}, {"q": "Which is NOT a key consideration for AI-driven robo investment decisions?", "o": ["Accountability", "Profitability", "Investment suitability", "Compliance"], "a": 1, "e": ""}, {"q": "Which is NOT a role of branches today?", "o": ["Advisory hub", "7x24 service centre", "Problem solver", "Digital ambassador"], "a": 1, "e": ""}, {"q": "Mock Q44: 'Suitability Obligation Guideline' issuer:", "o": ["HKAB", "OGCIO", "HKMA", "SFC"], "a": 3, "e": ""}, {"q": "Mock Q23: why robo-advisors won't replace humans soon:", "o": ["High cost", "Human touch drives action", "Lack of diversity", "Language flexibility"], "a": 1, "e": ""}, {"q": "Mock Q19: DLT is most effective when banks need:", "o": ["Shared data consistency across institutions", "High-speed batch only", "Strong anonymisation", "Simpler reporting"], "a": 0, "e": ""}, {"q": "Mock Q28: which is NOT a DLT weakness?", "o": ["Lack of accessibility", "Lack of scalability", "Lack of latency", "Lack of readiness"], "a": 0, "e": "Official key: A."}, {"q": "Mock Q36: which statement about DLT is incorrect?", "o": ["Shared record across a network", "Records transactions across locations", "Spread across computers", "Open, publicly accessible database"], "a": 3, "e": ""}, {"q": "Mock Q37: beyond HK regulatory scope for big-data systems:", "o": ["PDPO", "AMLO", "US FATCA", "NAFTA"], "a": 3, "e": ""}, {"q": "Mock Q8: market development signalling need for scalable, fast architecture:", "o": ["Branch automation", "Growth of mobile/digital behaviour", "Decline in interbank payments", "Less IT outsourcing"], "a": 1, "e": ""}]}, {"t": "Ch5 Compliance", "h": "\n<h1>Chapter 5 · Compliance with Information Technology</h1>\n<div class=\"card\"><b>Big picture:</b> Since 2008 regulation (and compliance cost) keeps rising → RegTech uses AI/analytics → main use cases are <b>transaction surveillance (AML)</b> and <b>KYC/onboarding</b> → international bodies (JFIU, FATF, APG) set standards. Short chapter, but almost every fact is testable — and Section B Question 3 in the mock paper is on RegTech.</div>\n<h2>5.1 RegTech</h2>\n<ul><li><b>RegTech</b> = regulatory technology; a <b>subset of FinTech</b>; its definition is <b>evolving</b>.</li><li>Accenture 2017: 89% of executives expect rising compliance costs; 23% of institutions expect to spend more than 5% of net income on compliance.</li><li>HKMA newsletter <b>Regtech Watch</b>; Regtech Knowledge Hub (26 Apr 2022; later Fintech Knowledge Hub).</li></ul>\n<table><tr><th>Date</th><th>HKMA RegTech action</th></tr><tr><td>1 Nov 2019</td><td><b>High-level Principles on AI</b> — 12 domains across governance, application design &amp; development, and ongoing monitoring &amp; maintenance</td></tr><tr><td>26 Apr 2022</td><td>Regtech Knowledge Hub</td></tr><tr><td>7 Feb 2024</td><td>AML/CFT Surveillance Capability Enhancement Project (AMLS) — data and Suptech-driven supervision</td></tr><tr><td>9 Sep 2024</td><td>Circular on using AI to monitor suspicious activities</td></tr></table>\n<h3>Applications</h3>\n<ul><li><b>Remote account opening — 2 stages:</b> (1) authenticate the ID document is genuine; (2) confirm the holder is the customer. Mock paper full flow: capture HKID photo → authenticate the HKID → selfie matched to HKID → application form → customer risk assessment → account opened. A <b>liveness check</b> detects whether biometrics come from a real person (blocks fingerprint moulds, 3D masks, pre-recorded video).</li><li><b>Transaction monitoring:</b> AI on top of rule-based screening; supervised ML cuts false positives; data mining finds suspicious networks.</li><li><b>RPA</b> speeds manual ML/TF risk operations. <b>Suptech:</b> HKMA's STT + RPA + analytics → complaint handling 8% faster, 100% response performance.</li></ul>\n<h3>Why institutions hesitate; benefits (Mock Section B Q3)</h3>\n<table><tr><th>Reasons for not adopting</th><th>Benefits</th></tr><tr><td>Budget/resource limits · immature solutions for local requirements · lack of skilled talent · data formats hard to digitise</td><td><b>For FIs:</b> better risk management (fewer errors, faster analysis of large data, enterprise-wide view, predictive fraud detection), lower KYC/CDD cost, attract and retain customers. <b>For customers:</b> faster experience (OCR/AI), financial inclusion (alternative data). <b>For regulators:</b> lower systemic risk, granular timely reporting (better supervision), efficiency</td></tr></table>\n<h2>5.2 Transaction surveillance & AML</h2>\n<p>Surveillance = front-line due diligence (manual) + systematic review of historical transactions (system).</p>\n<table><tr><th></th><th>Rule-based</th><th>AI / ML</th></tr><tr><td>How</td><td>Pre-defined criteria</td><td>Learns from many factors; spots emerging patterns</td></tr><tr><td>Weakness</td><td>Many false positives; criminals adapt so banks \"play catch-up\"</td><td>Still developing; depends on algorithm quality, computing power, data volume; hindered by privacy; bias risk</td></tr><tr><td>Promise</td><td>—</td><td>Monitor every transaction and predict whether it is suspicious</td></tr></table>\n<div class=\"card\"><b>Privacy debate:</b> some argue privacy should evolve to let big data/AI reach full potential; others say privacy matters more than ever. Resolution: <b>the concept evolves, the need to protect it never changes</b>. AI is human-designed, so bias may be embedded intentionally or not.</div>\n<div class=\"must\"><b class=\"t\">Drivers of RegTech in AML (Mock Section B Q3d)</b>Disparate transactions and more complex fraud · cross-border, multi-jurisdiction rules · cross-channel detection · standardised data for central analysis · dynamic continuous customer risk assessment · new payment methods (wallets, virtual currency) · real-time analytics &amp; behavioural alerts · social media for ID/PEP checks · sanctions-screening software · streaming/parallel processing · pattern comparison with past crim
